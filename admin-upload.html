<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>上传漫画（自动分片）</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* 保留原有的进度样式 */
        .upload-area {
            border: 2px dashed #ccc;
            border-radius: 12px;
            padding: 30px;
            text-align: center;
            margin-bottom: 20px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .upload-area:hover {
            border-color: #0070f3;
            background: #f5f9ff;
        }
        .file-info {
            background: #f5f5f5;
            border-radius: 8px;
            padding: 12px;
            margin: 15px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .cover-area {
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 15px;
            margin: 15px 0;
            background: #fefefe;
        }
        .cover-preview {
            display: flex;
            align-items: center;
            gap: 20px;
            flex-wrap: wrap;
        }
        .cover-preview img {
            max-width: 120px;
            max-height: 120px;
            border-radius: 8px;
            border: 1px solid #eee;
        }
        .preview-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            gap: 10px;
            max-height: 400px;
            overflow-y: auto;
            margin: 20px 0;
            border: 1px solid #eee;
            border-radius: 8px;
            padding: 10px;
        }
        .preview-item {
            text-align: center;
            background: #fafafa;
            border-radius: 6px;
            padding: 5px;
        }
        .preview-item img {
            width: 80px;
            height: 80px;
            object-fit: cover;
            border-radius: 4px;
        }
        .preview-item .filename {
            font-size: 0.7rem;
            color: #666;
            margin-top: 4px;
            word-break: break-all;
        }
        .comic-form input, .comic-form textarea, .comic-form select {
            margin-bottom: 12px;
        }
        .btn-secondary {
            background: #6c757d;
        }
        .btn-secondary:hover {
            background: #5a6268;
        }
        /* 进度列表样式 - 与之前一致 */
        .file-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #f0f0f0;
        }
        .file-name {
            flex: 1;
            font-size: 0.9rem;
        }
        .file-status {
            width: 80px;
            text-align: center;
            font-size: 0.8rem;
            padding: 2px 6px;
            border-radius: 12px;
        }
        .status-pending { background: #f0f0f0; color: #666; }
        .status-uploading { background: #ffc107; color: #333; }
        .status-success { background: #4caf50; color: white; }
        .status-error { background: #f44336; color: white; }
        .progress-bar {
            width: 100%;
            height: 4px;
            background: #eee;
            border-radius: 2px;
            overflow: hidden;
            margin-top: 4px;
        }
        .progress-fill {
            height: 100%;
            background: #0070f3;
            width: 0%;
            transition: width 0.2s;
        }
        .required-star {
            color: red;
            margin-left: 4px;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
</head>
<body>
    <div class="container">
        <h2>📤 上传漫画（自动分片）</h2>
        <p>1. 选择 ZIP 文件 → 2. 上传封面 → 3. 填写信息 → 4. 自动分片上传</p>

        <!-- ZIP 上传区域 -->
        <div class="upload-area" id="zipUploadArea">
            <p>📂 点击或拖拽 ZIP 文件到此处</p>
            <input type="file" id="zipInput" accept=".zip" style="display: none;">
        </div>
        <div id="zipFileInfo" style="display: none;">
            <div class="file-info">
                <span id="zipFileName"></span>
                <span id="zipFileSize"></span>
                <button id="clearZipBtn" class="btn-secondary" style="width: auto; padding: 4px 12px;">清除</button>
            </div>
        </div>

        <!-- 图片预览 -->
        <div id="previewArea" style="display: none;">
            <h4>图片预览（前30张）</h4>
            <div id="previewGrid" class="preview-grid"></div>
            <p id="totalImagesCount"></p>
        </div>

        <!-- 封面选择（必须） -->
        <div id="coverArea" style="display: none;" class="cover-area">
            <h4>📷 漫画封面（必须）</h4>
            <div class="cover-preview">
                <div id="coverUploadPlaceholder" style="flex:1;">
                    <input type="file" id="coverInput" accept="image/jpeg,image/png,image/webp" style="margin-bottom: 8px;">
                    <div id="coverHint" style="font-size:0.8rem; color:#888;">支持 JPG/PNG/WEBP，不超过 5MB</div>
                </div>
                <div id="coverPreviewImg" style="display: none;">
                    <img id="coverImg" alt="封面预览">
                    <button id="clearCoverBtn" style="display:block; margin-top: 5px; width: auto; padding: 2px 8px;">清除</button>
                </div>
            </div>
            <div id="coverError" style="color:red; font-size:0.8rem; margin-top:5px;"></div>
        </div>

        <!-- 漫画信息表单 -->
        <form id="comicForm" class="comic-form" style="display: none;">
            <label>漫画名 *</label>
            <input type="text" name="title" placeholder="例如：海贼王 第一卷" required>

            <label>作者 *</label>
            <input type="text" name="author" placeholder="例如：尾田荣一郎" required>

            <label>上传者（自动填充）</label>
            <input type="text" id="uploaderDisplay" readonly>

            <label>标签（用英文逗号分隔）</label>
            <input type="text" name="tags" placeholder="例如：热血,冒险,少年">

            <label>章数</label>
            <input type="number" name="chapters" value="1" min="1">

            <label>总页数 *</label>
            <input type="number" name="total_pages" id="totalPagesInput" readonly required>

            <label>简介</label>
            <textarea name="description" rows="4" placeholder="简单描述漫画内容..."></textarea>

            <div class="toggle-switch">
                <label>高危内容：</label>
                <input type="checkbox" id="isAdultCheckbox">
                <span>是（包含敏感内容）</span>
            </div>

            <button type="button" id="uploadBtn" class="btn-submit" disabled>开始上传</button>
        </form>

        <!-- 上传进度区域（与之前样式一致） -->
        <div id="uploadProgress" style="display: none; margin-top: 20px;">
            <h4>上传进度</h4>
            <div id="partsList"></div>
        </div>

        <div id="result" style="margin-top: 20px;"></div>
        <div class="admin-link">
            <a href="admin-manage.html">📋 管理已有漫画</a>
        </div>
    </div>

    <script>
        if (!localStorage.getItem('loggedIn')) {
            window.location.replace('login.html?needlogin=1');
        }
        const currentUser = localStorage.getItem('currentUser') || 'unknown';
        const userRole = localStorage.getItem('userRole') || 'user';
        if (userRole !== 'system' && userRole !== 'admin') {
            window.location.replace('index.html');
        }
        document.getElementById('uploaderDisplay').value = `${currentUser} (${userRole})`;

        const UPLOAD_TOKEN = 'manga-upload-secret-2025';
        let selectedZipFile = null;
        let imageFiles = [];
        let totalPages = 0;
        let parts = [];
        let comicId = null;
        let coverFile = null;

        // DOM 元素
        const zipInput = document.getElementById('zipInput');
        const zipUploadArea = document.getElementById('zipUploadArea');
        const zipFileInfoDiv = document.getElementById('zipFileInfo');
        const zipFileNameSpan = document.getElementById('zipFileName');
        const zipFileSizeSpan = document.getElementById('zipFileSize');
        const clearZipBtn = document.getElementById('clearZipBtn');
        const previewArea = document.getElementById('previewArea');
        const previewGrid = document.getElementById('previewGrid');
        const totalImagesCountSpan = document.getElementById('totalImagesCount');
        const coverArea = document.getElementById('coverArea');
        const coverInput = document.getElementById('coverInput');
        const coverPreviewImgDiv = document.getElementById('coverPreviewImg');
        const coverImg = document.getElementById('coverImg');
        const clearCoverBtn = document.getElementById('clearCoverBtn');
        const coverError = document.getElementById('coverError');
        const comicForm = document.getElementById('comicForm');
        const totalPagesInput = document.getElementById('totalPagesInput');
        const uploadBtn = document.getElementById('uploadBtn');
        const uploadProgressDiv = document.getElementById('uploadProgress');
        const partsListDiv = document.getElementById('partsList');
        const resultDiv = document.getElementById('result');

        // 1. ZIP 文件处理
        function handleZipFile(file) {
            resetUI();
            selectedZipFile = file;
            zipFileNameSpan.textContent = `文件名: ${file.name}`;
            zipFileSizeSpan.textContent = `大小: ${(file.size / 1024 / 1024).toFixed(2)} MB`;
            zipFileInfoDiv.style.display = 'block';
            
            resultDiv.innerHTML = '<p>正在解压并分析 ZIP 文件...</p>';
            const zip = new JSZip();
            zip.loadAsync(file).then(async (zipData) => {
                const allFiles = [];
                zipData.forEach((relativePath, zipEntry) => {
                    if (!zipEntry.dir && /\.(jpg|jpeg|png|gif|webp|bmp)$/i.test(relativePath)) {
                        allFiles.push({ path: relativePath, zipEntry });
                    }
                });
                allFiles.sort((a, b) => a.path.localeCompare(b.path, undefined, { numeric: true, sensitivity: 'base' }));
                totalPages = allFiles.length;
                totalPagesInput.value = totalPages;
                if (totalPages === 0) throw new Error('ZIP 中没有找到图片文件');
                
                // 预览前30张
                const previewLimit = Math.min(30, totalPages);
                previewGrid.innerHTML = '';
                for (let i = 0; i < previewLimit; i++) {
                    const entry = allFiles[i];
                    const blob = await entry.zipEntry.async('blob');
                    const url = URL.createObjectURL(blob);
                    const div = document.createElement('div');
                    div.className = 'preview-item';
                    div.innerHTML = `<img src="${url}"><div class="filename">${entry.path.split('/').pop()}</div>`;
                    previewGrid.appendChild(div);
                }
                if (totalPages > previewLimit) {
                    const more = document.createElement('div');
                    more.className = 'preview-item';
                    more.innerHTML = `<div style="padding:20px;">... 共 ${totalPages} 张图片</div>`;
                    previewGrid.appendChild(more);
                }
                totalImagesCountSpan.textContent = `共 ${totalPages} 张图片`;
                previewArea.style.display = 'block';
                
                // 存储图片 Blob
                imageFiles = [];
                for (let i = 0; i < allFiles.length; i++) {
                    const blob = await allFiles[i].zipEntry.async('blob');
                    imageFiles.push({ name: allFiles[i].path.split('/').pop(), blob });
                    if ((i + 1) % 100 === 0) {
                        resultDiv.innerHTML = `<p>正在加载图片... ${i+1}/${totalPages}</p>`;
                    }
                }
                resultDiv.innerHTML = '<p>✅ ZIP 解压完成，请上传封面并填写信息</p>';
                coverArea.style.display = 'block';
                comicForm.style.display = 'block';
                checkUploadReady();
            }).catch(err => {
                console.error(err);
                resultDiv.innerHTML = `<p style="color:red;">❌ 处理 ZIP 失败: ${err.message}</p>`;
                resetUI();
            });
        }

        zipUploadArea.addEventListener('click', () => zipInput.click());
        zipUploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            zipUploadArea.style.borderColor = '#0070f3';
            zipUploadArea.style.background = '#f5f9ff';
        });
        zipUploadArea.addEventListener('dragleave', () => {
            zipUploadArea.style.borderColor = '#ccc';
            zipUploadArea.style.background = '';
        });
        zipUploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            zipUploadArea.style.borderColor = '#ccc';
            zipUploadArea.style.background = '';
            const files = e.dataTransfer.files;
            if (files.length && files[0].name.endsWith('.zip')) {
                handleZipFile(files[0]);
            } else {
                alert('请拖拽 ZIP 文件');
            }
        });
        zipInput.addEventListener('change', (e) => {
            if (e.target.files.length) handleZipFile(e.target.files[0]);
        });
        clearZipBtn.addEventListener('click', () => resetUI());

        // 2. 封面处理
        coverInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            if (!file.type.startsWith('image/')) {
                coverError.innerText = '请选择图片文件';
                return;
            }
            if (file.size > 5 * 1024 * 1024) {
                coverError.innerText = '图片不能超过 5MB';
                return;
            }
            coverFile = file;
            const reader = new FileReader();
            reader.onload = (ev) => {
                coverImg.src = ev.target.result;
                coverPreviewImgDiv.style.display = 'block';
                coverError.innerText = '';
            };
            reader.readAsDataURL(file);
            checkUploadReady();
        });
        clearCoverBtn.addEventListener('click', () => {
            coverFile = null;
            coverInput.value = '';
            coverPreviewImgDiv.style.display = 'none';
            coverImg.src = '';
            coverError.innerText = '';
            checkUploadReady();
        });

        function checkUploadReady() {
            const ready = selectedZipFile && coverFile && totalPages > 0;
            uploadBtn.disabled = !ready;
            if (!ready) {
                let msg = '';
                if (!selectedZipFile) msg = '请先选择 ZIP 文件';
                else if (!coverFile) msg = '请上传封面图片';
                else if (totalPages === 0) msg = 'ZIP 中没有图片';
                resultDiv.innerHTML = `<p style="color:#888;">⚠️ ${msg}</p>`;
            } else {
                resultDiv.innerHTML = '<p>✅ 可以开始上传</p>';
            }
        }

        function resetUI() {
            selectedZipFile = null;
            imageFiles = [];
            totalPages = 0;
            parts = [];
            comicId = null;
            coverFile = null;
            coverInput.value = '';
            coverPreviewImgDiv.style.display = 'none';
            coverImg.src = '';
            coverError.innerText = '';
            zipFileInfoDiv.style.display = 'none';
            previewArea.style.display = 'none';
            coverArea.style.display = 'none';
            comicForm.style.display = 'none';
            uploadProgressDiv.style.display = 'none';
            uploadBtn.disabled = true;
            resultDiv.innerHTML = '';
            zipInput.value = '';
        }

        // 3. 分片打包
        async function createParts() {
            const PART_SIZE = 10;
            const partCount = Math.ceil(totalPages / PART_SIZE);
            const newParts = [];
            for (let i = 0; i < partCount; i++) {
                const start = i * PART_SIZE;
                const end = Math.min(start + PART_SIZE, totalPages);
                const slice = imageFiles.slice(start, end);
                const zip = new JSZip();
                for (let j = 0; j < slice.length; j++) {
                    const img = slice[j];
                    const filename = `${String(start + j + 1).padStart(3, '0')}_${img.name}`;
                    zip.file(filename, img.blob);
                }
                const blob = await zip.generateAsync({ type: 'blob', compression: 'DEFLATE', compressionOptions: { level: 6 } });
                newParts.push({ index: i + 1, blob, size: blob.size });
            }
            return newParts;
        }

        // 4. 上传元数据（包含封面）
        async function uploadMetadata() {
            const form = document.getElementById('comicForm');
            const formData = new FormData();
            formData.append('title', form.title.value);
            formData.append('author', form.author.value);
            formData.append('uploader', `${currentUser} (${userRole})`);
            formData.append('tags', form.tags.value);
            formData.append('chapters', form.chapters.value);
            formData.append('total_pages', totalPages);
            formData.append('description', form.description.value);
            formData.append('owner_role', userRole);
            formData.append('is_adult', document.getElementById('isAdultCheckbox').checked ? 'yes' : 'no');
            formData.append('total_parts', parts.length);
            formData.append('cover', coverFile); // 上传封面

            const response = await fetch('/api/comics/create', {
                method: 'POST',
                headers: { 'X-Upload-Token': UPLOAD_TOKEN },
                body: formData
            });
            const data = await response.json();
            if (!response.ok) throw new Error(data.error || `HTTP ${response.status}`);
            if (!data.success) throw new Error(data.error || '未知错误');
            return data.id;
        }

        // 5. 上传分片（带真实进度）
        function uploadPart(comicId, partIndex, blob, originalName, onProgress) {
            return new Promise((resolve, reject) => {
                const formData = new FormData();
                formData.append('comicId', comicId);
                formData.append('partIndex', partIndex - 1);
                formData.append('zipFile', blob, originalName);
                formData.append('originalName', originalName);

                const xhr = new XMLHttpRequest();
                xhr.open('POST', '/api/comics/upload-part', true);
                xhr.setRequestHeader('X-Upload-Token', UPLOAD_TOKEN);
                xhr.upload.onprogress = (e) => {
                    if (e.lengthComputable && onProgress) onProgress(Math.round((e.loaded / e.total) * 100));
                };
                xhr.onload = () => {
                    if (xhr.status === 200) {
                        try {
                            const data = JSON.parse(xhr.responseText);
                            data.success ? resolve(data) : reject(new Error(data.error));
                        } catch { reject(new Error('解析响应失败')); }
                    } else reject(new Error(`HTTP ${xhr.status}`));
                };
                xhr.onerror = () => reject(new Error('网络错误'));
                xhr.send(formData);
            });
        }

        // 6. 完成上传
        async function finishUpload(comicId) {
            const form = document.getElementById('comicForm');
            const response = await fetch('/api/comics/finish-upload', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'X-Upload-Token': UPLOAD_TOKEN },
                body: JSON.stringify({ comicId, total_pages: totalPages, total_parts: parts.length })
            });
            const data = await response.json();
            if (!response.ok) throw new Error(data.error || `HTTP ${response.status}`);
            if (!data.success) throw new Error(data.error || '未知错误');
            return data;
        }

        // 7. 主上传流程
        uploadBtn.addEventListener('click', async () => {
            if (!selectedZipFile || !coverFile) return;
            uploadBtn.disabled = true;
            resultDiv.innerHTML = '<p>正在生成分片... 请稍候</p>';
            try {
                parts = await createParts();
                if (parts.length === 0) throw new Error('没有生成任何分片');
                resultDiv.innerHTML = `<p>已生成 ${parts.length} 个分片，开始上传到服务器...</p>`;
                
                uploadProgressDiv.style.display = 'block';
                partsListDiv.innerHTML = '';
                for (let i = 0; i < parts.length; i++) {
                    const div = document.createElement('div');
                    div.id = `part-${i+1}`;
                    div.className = 'file-item';
                    div.innerHTML = `
                        <div class="file-name">分片 ${i+1} (${(parts[i].size / 1024 / 1024).toFixed(2)} MB)</div>
                        <div class="file-status status-pending" id="status-${i+1}">等待上传</div>
                        <div class="progress-bar" id="progress-${i+1}">
                            <div class="progress-fill" id="progress-fill-${i+1}"></div>
                        </div>
                    `;
                    partsListDiv.appendChild(div);
                }
                
                comicId = await uploadMetadata();
                resultDiv.innerHTML = `漫画记录已创建 (ID: ${comicId})，开始上传分片...`;
                
                for (let i = 0; i < parts.length; i++) {
                    const part = parts[i];
                    const statusSpan = document.getElementById(`status-${part.index}`);
                    const progressFill = document.getElementById(`progress-fill-${part.index}`);
                    const progressBar = document.getElementById(`progress-${part.index}`);
                    
                    statusSpan.innerText = '上传中';
                    statusSpan.className = 'file-status status-uploading';
                    progressBar.style.display = 'block';
                    
                    await uploadPart(comicId, part.index, part.blob, `part_${part.index}.zip`, (pct) => {
                        progressFill.style.width = pct + '%';
                    });
                    progressFill.style.width = '100%';
                    statusSpan.innerText = '成功';
                    statusSpan.className = 'file-status status-success';
                }
                
                await finishUpload(comicId);
                resultDiv.innerHTML = `
                    <div style="color:green; background:#e8f5e8; padding:15px; border-radius:8px;">
                        ✅ 所有分片上传成功！<br>
                        <a href="detail.html?id=${comicId}">查看漫画</a>
                    </div>
                `;
            } catch (err) {
                resultDiv.innerHTML = `<div style="color:red;">❌ 上传失败: ${err.message}</div>`;
                uploadBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
