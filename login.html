<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 · 漫画站</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .login-box {
            position: relative;
            overflow: hidden;
            isolation: isolate; /* 建立层叠上下文，让装饰光斑稳定位于内容之下 */
            border: 2px solid transparent;
            background:
                linear-gradient(#ffffff, #ffffff) padding-box,
                linear-gradient(135deg, #ffb6c1 0%, #4da3ff 100%) border-box;
            /* 加宽加高：更舒展的登录窗口，内容垂直居中 */
            max-width: 480px;
            padding: 3rem 2.8rem;
            min-height: 560px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            animation: popIn 0.5s var(--ease-spring) both;
        }
        .login-box::before,
        .login-box::after {
            z-index: -1; /* 光斑只在卡片背景之上、内容之下，不再遮挡图标与文字 */
        }
        .login-box::before {
            content: '';
            position: absolute;
            top: -80px; right: -80px;
            width: 220px; height: 220px;
            background: radial-gradient(circle, rgba(255, 182, 193, 0.35), transparent 70%);
            border-radius: 50%;
            pointer-events: none;
        }
        .login-box::after {
            content: '';
            position: absolute;
            bottom: -70px; left: -70px;
            width: 180px; height: 180px;
            background: radial-gradient(circle, rgba(0, 112, 243, 0.16), transparent 70%);
            border-radius: 50%;
            pointer-events: none;
        }
        .login-title {
            text-align: center;
            margin-bottom: 10px;
        }
        .lock-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 64px; height: 64px;
            font-size: 1.7rem;
            border-radius: 20px;
            background: var(--grad-pink);
            color: #fff;
            box-shadow: 0 10px 26px rgba(255, 143, 171, 0.45);
            animation: floatY 4.5s ease-in-out infinite;
        }
        .login-title h2 {
            margin-top: 14px;
            font-size: 1.5rem;
            font-weight: 800;
            background: linear-gradient(120deg, #0070f3, #7c5cff 60%, #ff8fab);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .login-box input {
            animation: fadeUp 0.5s var(--ease-out) both;
        }
        .login-box button {
            animation: fadeUp 0.5s 0.08s var(--ease-out) backwards;
        }
        #message {
            text-align: center;
            min-height: 20px;
            font-size: 0.9rem;
            font-weight: 600;
        }
        .back-home {
            display: inline-block;
            margin-top: 18px;
            color: var(--ink-soft);
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 600;
            transition: color 0.2s ease, transform 0.2s ease;
        }
        .back-home:hover { color: var(--primary); transform: translateX(-3px); }
        /* 登录界面整体垂直水平居中 */
        body {
            align-items: center;
        }
        /* 登录成功过渡：登录窗口放大淡出（配合主页“镜头拉近”入场） */
        .login-box {
            transition: transform 0.5s var(--ease-spring), opacity 0.45s ease, filter 0.5s ease;
        }
        .login-box.leaving {
            animation: none;
            transform: scale(1.35);
            opacity: 0;
            filter: blur(6px);
        }
        @media (max-height: 700px) {
            .login-box { min-height: auto; padding: 2.4rem 2rem; }
        }
        @media (max-height: 560px) {
            body { align-items: flex-start; }
        }
        @media (prefers-reduced-motion: reduce) {
            .lock-icon { animation: none; }
        }
    </style>
    <script src="common.js" defer></script>
</head>
<body>
    <!-- 无 JS 环境提示 -->
    <noscript><div style="position:fixed;top:0;left:0;right:0;background:#ff6b6b;color:#fff;padding:10px;text-align:center;z-index:99999;">本站功能需要启用 JavaScript 才能正常使用</div></noscript>

    <div class="login-box">
        <div class="login-title">
            <span class="lock-icon">🔐</span>
            <h2>登录漫画站</h2>
        </div>

        <!-- 登录表单（初始可见） -->
        <div id="loginForm">
            <input type="text" id="username" placeholder="用户名">
            <input type="password" id="password" placeholder="密码">
            <button class="btn-shine" onclick="submitLogin()">登录</button>
        </div>

        <!-- 第二层验证表单（初始隐藏） -->
        <div id="secondFactorForm" style="display: none;">
            <p>IP地址异常，请输入第二层验证码</p>
            <input type="text" id="secondFactor" placeholder="8位验证码" maxlength="8">
            <button class="btn-shine" onclick="submitSecondFactor()">验证</button>
        </div>

        <!-- 设置第二因子表单（初始隐藏） -->
        <div id="setSecondFactorForm" style="display: none;">
            <p>您的账户尚未设置第二层验证码。请设置一个8位验证码，用于IP变化时的安全验证。</p>
            <input type="text" id="newSecondFactor" placeholder="8位验证码" maxlength="8">
            <button class="btn-shine" onclick="submitSetSecondFactor()">设置并登录</button>
        </div>

        <p id="message" style="color:red; margin-top:15px;"></p>
        <p style="margin-top:20px; text-align:center;">
            <a class="back-home" href="index.html">← 返回主页</a>
        </p>
    </div>

    <script>
        let pendingUsername = '';
        let pendingPassword = '';

        // 登录成功后的精细过渡：登录窗口放大淡出，主页以“镜头拉近”入场
        function goHomeAfterLogin() {
            try { sessionStorage.setItem('fromLogin', '1'); } catch (e) {}
            // 标记本次登录需要弹出一次新站宣传（主页检测后弹出并清除，每次登录只弹一次）
            try { sessionStorage.setItem('siteModalPending', '1'); } catch (e) {}
            const box = document.querySelector('.login-box');
            if (box) {
                box.classList.add('leaving');
                setTimeout(function () { window.location.href = 'index.html'; }, 500);
            } else {
                window.location.href = 'index.html';
            }
        }

        // 从详情页等被引导过来登录时的提示
        (function () {
            const params = new URLSearchParams(window.location.search);
            if (params.get('needlogin')) {
                const msg = document.getElementById('message');
                if (msg) {
                    msg.style.color = '#e67e22';
                    msg.innerText = '请先登录后再访问该页面';
                }
            }
        })();

        // Enter 键提交（与点击按钮等效）
        document.addEventListener('keydown', function (e) {
            if (e.key !== 'Enter') return;
            const active = document.activeElement;
            if (!active) return;
            if (document.getElementById('loginForm').style.display !== 'none' &&
                (active.id === 'username' || active.id === 'password')) {
                submitLogin();
            } else if (document.getElementById('secondFactorForm').style.display !== 'none' &&
                active.id === 'secondFactor') {
                submitSecondFactor();
            } else if (document.getElementById('setSecondFactorForm').style.display !== 'none' &&
                active.id === 'newSecondFactor') {
                submitSetSecondFactor();
            }
        });

        function disableButtons(disabled) {
            document.querySelectorAll('#loginForm button, #secondFactorForm button, #setSecondFactorForm button').forEach(function (btn) {
                btn.disabled = disabled;
            });
        }

        async function submitLogin() {
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const msg = document.getElementById('message');

            if (!username || !password) {
                msg.innerText = '请输入用户名和密码';
                return;
            }

            disableButtons(true);
            msg.innerText = '登录中...';
            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await res.json();

                if (res.ok && data.success) {
                    localStorage.setItem('loggedIn', 'true');
                    localStorage.setItem('currentUser', data.username);
                    localStorage.setItem('userRole', data.role);
                    localStorage.setItem('currentUserId', data.userId);
                    goHomeAfterLogin();
                } else if (data.needSetSecondFactor) {
                    pendingUsername = data.username;
                    pendingPassword = password;
                    localStorage.setItem('currentUserId', data.userId); // 存储用户ID
                    document.getElementById('loginForm').style.display = 'none';
                    document.getElementById('setSecondFactorForm').style.display = 'block';
                    msg.innerText = '';
                } else if (data.needSecondFactor) {
                    pendingUsername = username;
                    pendingPassword = password;
                    document.getElementById('loginForm').style.display = 'none';
                    document.getElementById('secondFactorForm').style.display = 'block';
                    msg.innerText = '';
                } else {
                    msg.innerText = data.error || '登录失败';
                }
            } catch (err) {
                msg.innerText = '网络错误，请稍后重试';
            } finally {
                disableButtons(false);
            }
        }

        async function submitSecondFactor() {
            const secondFactor = document.getElementById('secondFactor').value.trim();
            const msg = document.getElementById('message');

            if (!secondFactor || secondFactor.length !== 8) {
                msg.innerText = '请输入8位验证码';
                return;
            }

            disableButtons(true);
            msg.innerText = '验证中...';
            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        username: pendingUsername, 
                        password: pendingPassword,
                        secondFactor: secondFactor
                    })
                });
                const data = await res.json();

                if (res.ok && data.success) {
                    localStorage.setItem('loggedIn', 'true');
                    localStorage.setItem('currentUser', data.username);
                    localStorage.setItem('userRole', data.role);
                    localStorage.setItem('currentUserId', data.userId);
                    goHomeAfterLogin();
                } else {
                    msg.innerText = data.error || '验证失败';
                }
            } catch (err) {
                msg.innerText = '网络错误，请稍后重试';
            } finally {
                disableButtons(false);
            }
        }

        async function submitSetSecondFactor() {
            const newSecondFactor = document.getElementById('newSecondFactor').value.trim();
            const msg = document.getElementById('message');

            if (!newSecondFactor || newSecondFactor.length !== 8) {
                msg.innerText = '请输入8位验证码';
                return;
            }

            const userId = localStorage.getItem('currentUserId');
            if (!userId) {
                msg.innerText = '用户信息丢失，请重新登录';
                setTimeout(() => { window.location.href = 'login.html'; }, 1500);
                return;
            }

            disableButtons(true);
            msg.innerText = '设置中...';
            try {
                const res = await fetch('/api/set-second-factor', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Auth-UserId': userId
                    },
                    body: JSON.stringify({ secondFactor: newSecondFactor })
                });
                const data = await res.json();

                if (res.ok && data.success) {
                    localStorage.removeItem('loggedIn');
                    localStorage.removeItem('currentUser');
                    localStorage.removeItem('userRole');
                    localStorage.removeItem('currentUserId');
                    msg.style.color = 'green';
                    msg.innerText = '设置成功！请重新登录。';
                    setTimeout(() => {
                        window.location.href = 'login.html';
                    }, 1500);
                } else {
                    msg.innerText = data.error || '设置失败';
                }
            } catch (err) {
                msg.innerText = '网络错误，请稍后重试';
            } finally {
                disableButtons(false);
            }
        }
    </script>
</body>
</html>
