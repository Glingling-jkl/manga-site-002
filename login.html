<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 · 漫画站</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="login-box">
        <h2>🔐 登录漫画站</h2>
        
        <!-- 登录表单 -->
        <div id="loginForm">
            <input type="text" id="username" placeholder="用户名">
            <input type="password" id="password" placeholder="密码">
            <button onclick="submitLogin()">登录</button>
        </div>

        <!-- 第二层验证表单（初始隐藏） -->
        <div id="secondFactorForm" style="display: none;">
            <p>IP地址异常，请输入第二层验证码</p>
            <input type="text" id="secondFactor" placeholder="8位验证码" maxlength="8">
            <button onclick="submitSecondFactor()">验证</button>
        </div>

        <p id="message" style="color:red; margin-top:15px;"></p>
        <p style="margin-top:20px; text-align:center;">
            <a href="index.html">← 返回主页</a>
        </p>
    </div>

    <script>
        let pendingUsername = '';
        let pendingPassword = '';

        async function submitLogin() {
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const msg = document.getElementById('message');

            if (!username || !password) {
                msg.innerText = '请输入用户名和密码';
                return;
            }

            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await res.json();

                if (res.ok && data.success) {
                    localStorage.setItem('loggedIn', 'true');
                    localStorage.setItem('currentUser', data.username);
                    localStorage.setItem('userRole', data.role);
                    window.location.href = 'index.html';
                } else if (data.needSetSecondFactor) {
                    // 未设置第二因子，跳转到设置页面
                    localStorage.setItem('currentUser', data.username);
                    window.location.href = 'set-second-factor.html';
                } else if (data.needSecondFactor) {
                    // 需要输入第二因子
                    pendingUsername = username;
                    pendingPassword = password;
                    document.getElementById('loginForm').style.display = 'none';
                    document.getElementById('secondFactorForm').style.display = 'block';
                    msg.innerText = '';
                } else {
                    msg.innerText = data.error || '登录失败';
                }
            } catch (err) {
                msg.innerText = '网络错误，请稍后重试';
            }
        }

        async function submitSecondFactor() {
            const secondFactor = document.getElementById('secondFactor').value;
            const msg = document.getElementById('message');

            if (!secondFactor || secondFactor.length !== 8) {
                msg.innerText = '请输入8位验证码';
                return;
            }

            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        username: pendingUsername, 
                        password: pendingPassword,
                        secondFactor: secondFactor
                    })
                });
                const data = await res.json();

                if (res.ok && data.success) {
                    localStorage.setItem('loggedIn', 'true');
                    localStorage.setItem('currentUser', data.username);
                    localStorage.setItem('userRole', data.role);
                    window.location.href = 'index.html';
                } else {
                    msg.innerText = data.error || '验证失败';
                }
            } catch (err) {
                msg.innerText = '网络错误，请稍后重试';
            }
        }
    </script>
</body>
</html>
