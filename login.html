<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 · 漫画站</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- 无 JS 环境提示 -->
    <noscript><div style="position:fixed;top:0;left:0;right:0;background:#ff6b6b;color:#fff;padding:10px;text-align:center;z-index:99999;">本站功能需要启用 JavaScript 才能正常使用</div></noscript>

    <div class="login-box">
        <h2>🔐 登录漫画站</h2>
        
        <!-- 登录表单（初始可见） -->
        <div id="loginForm">
            <input type="text" id="username" placeholder="用户名">
            <input type="password" id="password" placeholder="密码">
            <button onclick="submitLogin()">登录</button>
        </div>

        <!-- 第二层验证表单（初始隐藏） -->
        <div id="secondFactorForm" style="display: none;">
            <p>IP地址异常，请输入第二层验证码</p>
            <input type="text" id="secondFactor" placeholder="8位验证码" maxlength="8">
            <button onclick="submitSecondFactor()">验证</button>
        </div>

        <!-- 设置第二因子表单（初始隐藏） -->
        <div id="setSecondFactorForm" style="display: none;">
            <p>您的账户尚未设置第二层验证码。请设置一个8位验证码，用于IP变化时的安全验证。</p>
            <input type="text" id="newSecondFactor" placeholder="8位验证码" maxlength="8">
            <button onclick="submitSetSecondFactor()">设置并登录</button>
        </div>

        <p id="message" style="color:red; margin-top:15px;"></p>
        <p style="margin-top:20px; text-align:center;">
            <a href="index.html">← 返回主页</a>
        </p>
    </div>

    <script>
        let pendingUsername = '';
        let pendingPassword = '';

        // 从详情页等被引导过来登录时的提示
        (function () {
            const params = new URLSearchParams(window.location.search);
            if (params.get('needlogin')) {
                const msg = document.getElementById('message');
                if (msg) {
                    msg.style.color = '#e67e22';
                    msg.innerText = '请先登录后再访问该页面';
                }
            }
        })();

        // Enter 键提交（与点击按钮等效）
        document.addEventListener('keydown', function (e) {
            if (e.key !== 'Enter') return;
            const active = document.activeElement;
            if (!active) return;
            if (document.getElementById('loginForm').style.display !== 'none' &&
                (active.id === 'username' || active.id === 'password')) {
                submitLogin();
            } else if (document.getElementById('secondFactorForm').style.display !== 'none' &&
                active.id === 'secondFactor') {
                submitSecondFactor();
            } else if (document.getElementById('setSecondFactorForm').style.display !== 'none' &&
                active.id === 'newSecondFactor') {
                submitSetSecondFactor();
            }
        });

        function disableButtons(disabled) {
            document.querySelectorAll('#loginForm button, #secondFactorForm button, #setSecondFactorForm button').forEach(function (btn) {
                btn.disabled = disabled;
            });
        }

        async function submitLogin() {
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const msg = document.getElementById('message');

            if (!username || !password) {
                msg.innerText = '请输入用户名和密码';
                return;
            }

            disableButtons(true);
            msg.innerText = '登录中...';
            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await res.json();

                if (res.ok && data.success) {
                    localStorage.setItem('loggedIn', 'true');
                    localStorage.setItem('currentUser', data.username);
                    localStorage.setItem('userRole', data.role);
                    localStorage.setItem('currentUserId', data.userId);
                    window.location.href = 'index.html';
                } else if (data.needSetSecondFactor) {
                    pendingUsername = data.username;
                    pendingPassword = password;
                    localStorage.setItem('currentUserId', data.userId); // 存储用户ID
                    document.getElementById('loginForm').style.display = 'none';
                    document.getElementById('setSecondFactorForm').style.display = 'block';
                    msg.innerText = '';
                } else if (data.needSecondFactor) {
                    pendingUsername = username;
                    pendingPassword = password;
                    document.getElementById('loginForm').style.display = 'none';
                    document.getElementById('secondFactorForm').style.display = 'block';
                    msg.innerText = '';
                } else {
                    msg.innerText = data.error || '登录失败';
                }
            } catch (err) {
                msg.innerText = '网络错误，请稍后重试';
            } finally {
                disableButtons(false);
            }
        }

        async function submitSecondFactor() {
            const secondFactor = document.getElementById('secondFactor').value.trim();
            const msg = document.getElementById('message');

            if (!secondFactor || secondFactor.length !== 8) {
                msg.innerText = '请输入8位验证码';
                return;
            }

            disableButtons(true);
            msg.innerText = '验证中...';
            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        username: pendingUsername, 
                        password: pendingPassword,
                        secondFactor: secondFactor
                    })
                });
                const data = await res.json();

                if (res.ok && data.success) {
                    localStorage.setItem('loggedIn', 'true');
                    localStorage.setItem('currentUser', data.username);
                    localStorage.setItem('userRole', data.role);
                    localStorage.setItem('currentUserId', data.userId);
                    window.location.href = 'index.html';
                } else {
                    msg.innerText = data.error || '验证失败';
                }
            } catch (err) {
                msg.innerText = '网络错误，请稍后重试';
            } finally {
                disableButtons(false);
            }
        }

        async function submitSetSecondFactor() {
            const newSecondFactor = document.getElementById('newSecondFactor').value.trim();
            const msg = document.getElementById('message');

            if (!newSecondFactor || newSecondFactor.length !== 8) {
                msg.innerText = '请输入8位验证码';
                return;
            }

            const userId = localStorage.getItem('currentUserId');
            if (!userId) {
                msg.innerText = '用户信息丢失，请重新登录';
                setTimeout(() => { window.location.href = 'login.html'; }, 1500);
                return;
            }

            disableButtons(true);
            msg.innerText = '设置中...';
            try {
                const res = await fetch('/api/set-second-factor', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Auth-UserId': userId
                    },
                    body: JSON.stringify({ secondFactor: newSecondFactor })
                });
                const data = await res.json();

                if (res.ok && data.success) {
                    localStorage.removeItem('loggedIn');
                    localStorage.removeItem('currentUser');
                    localStorage.removeItem('userRole');
                    localStorage.removeItem('currentUserId');
                    msg.style.color = 'green';
                    msg.innerText = '设置成功！请重新登录。';
                    setTimeout(() => {
                        window.location.href = 'login.html';
                    }, 1500);
                } else {
                    msg.innerText = data.error || '设置失败';
                }
            } catch (err) {
                msg.innerText = '网络错误，请稍后重试';
            } finally {
                disableButtons(false);
            }
        }
    </script>
</body>
</html>
