<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 · 漫画站</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="login-box">
        <h2>🔐 登录漫画站</h2>
        
        <!-- 登录表单（初始可见） -->
        <div id="loginForm">
            <input type="text" id="username" placeholder="用户名">
            <input type="password" id="password" placeholder="密码">
            <button onclick="submitLogin()">登录</button>
        </div>

        <!-- 第二层验证表单（初始隐藏） -->
        <div id="secondFactorForm" style="display: none;">
            <p id="secondFactorMessage">IP地址异常，请输入第二层验证码</p>
            <input type="text" id="secondFactor" placeholder="8位验证码" maxlength="8">
            <button onclick="submitSecondFactor()">验证</button>
        </div>

        <!-- 设置第二因子表单（初始隐藏） -->
        <div id="setSecondFactorForm" style="display: none;">
            <p>您的账户尚未设置第二层验证码。请设置一个8位验证码，用于IP变化时的安全验证。</p>
            <input type="text" id="newSecondFactor" placeholder="8位验证码" maxlength="8">
            <button onclick="submitSetSecondFactor()">设置并登录</button>
        </div>

        <p id="message" style="color:red; margin-top:15px;"></p>
        <p style="margin-top:20px; text-align:center;">
            <a href="index.html">← 返回主页</a>
        </p>
    </div>

    <script>
        let pendingUsername = '';
        let pendingPassword = '';

        async function submitLogin() {
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const msg = document.getElementById('message');

            if (!username || !password) {
                msg.innerText = '请输入用户名和密码';
                return;
            }

            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await res.json();

                if (res.ok && data.success) {
                    // 登录成功
                    localStorage.setItem('loggedIn', 'true');
                    localStorage.setItem('currentUser', data.username);
                    localStorage.setItem('userRole', data.role);
                    window.location.href = 'index.html';
                } else if (data.needSetSecondFactor) {
                    // 未设置第二因子，显示设置表单
                    pendingUsername = data.username;
                    pendingPassword = password;
                    document.getElementById('loginForm').style.display = 'none';
                    document.getElementById('setSecondFactorForm').style.display = 'block';
                    msg.innerText = '';
                } else if (data.needSecondFactor) {
                    // 需要输入第二因子
                    pendingUsername = username;
                    pendingPassword = password;
                    document.getElementById('loginForm').style.display = 'none';
                    document.getElementById('secondFactorForm').style.display = 'block';
                    msg.innerText = '';
                } else {
                    msg.innerText = data.error || '登录失败';
                }
            } catch (err) {
                msg.innerText = '网络错误，请稍后重试';
            }
        }

        async function submitSecondFactor() {
            const secondFactor = document.getElementById('secondFactor').value.trim();
            const msg = document.getElementById('message');

            if (!secondFactor || secondFactor.length !== 8) {
                msg.innerText = '请输入8位验证码';
                return;
            }

            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        username: pendingUsername, 
                        password: pendingPassword,
                        secondFactor: secondFactor
                    })
                });
                const data = await res.json();

                if (res.ok && data.success) {
                    localStorage.setItem('loggedIn', 'true');
                    localStorage.setItem('currentUser', data.username);
                    localStorage.setItem('userRole', data.role);
                    window.location.href = 'index.html';
                } else {
                    msg.innerText = data.error || '验证失败';
                }
            } catch (err) {
                msg.innerText = '网络错误，请稍后重试';
            }
        }

        async function submitSetSecondFactor() {
            const newSecondFactor = document.getElementById('newSecondFactor').value.trim();
            const msg = document.getElementById('message');

            if (!newSecondFactor || newSecondFactor.length !== 8) {
                msg.innerText = '请输入8位验证码';
                return;
            }

            try {
                const res = await fetch('/api/set-second-factor', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Auth-Username': pendingUsername
                    },
                    body: JSON.stringify({ secondFactor: newSecondFactor })
                });
                const data = await res.json();

                if (res.ok && data.success) {
                    // 设置成功后，自动再次尝试登录
                    msg.innerText = '设置成功，正在登录...';
                    // 重新调用登录
                    const loginRes = await fetch('/api/login', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ 
                            username: pendingUsername, 
                            password: pendingPassword 
                        })
                    });
                    const loginData = await loginRes.json();
                    if (loginRes.ok && loginData.success) {
                        localStorage.setItem('loggedIn', 'true');
                        localStorage.setItem('currentUser', loginData.username);
                        localStorage.setItem('userRole', loginData.role);
                        window.location.href = 'index.html';
                    } else {
                        msg.innerText = '设置成功，但自动登录失败，请手动登录';
                        setTimeout(() => {
                            window.location.href = 'login.html';
                        }, 2000);
                    }
                } else {
                    msg.innerText = data.error || '设置失败';
                }
            } catch (err) {
                msg.innerText = '网络错误，请稍后重试';
            }
        }
    </script>
</body>
</html>
