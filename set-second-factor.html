<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>设置第二层验证码</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .set-form {
            max-width: 400px;
            margin: 0 auto;
        }
        .set-form input, .set-form button {
            margin: 10px 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>🔐 设置第二层验证码</h2>
        <p>为了账户安全，请设置一个8位的第二层验证码。它将在IP地址变化时要求输入。</p>
        <form id="setForm" class="set-form">
            <input type="text" id="secondFactor" placeholder="8位验证码 (可包含字母、数字、特殊符号)" maxlength="8" required>
            <button type="submit">设置</button>
        </form>
        <div id="result" style="margin-top: 20px;"></div>
    </div>

    <script>
        // 检查是否已登录（但没有第二因子）
        if (!localStorage.getItem('loggedIn')) {
            // 如果没有 loggedIn，可能用户刚登录但还没设置？实际上登录成功后已设置，所以此处理论上不会触发
            // 但以防万一，跳转到登录页
            window.location.replace('login.html');
        }
        const currentUser = localStorage.getItem('currentUser') || '';

        function escapeHtml(str) {
            if (str == null) return '';
            return String(str).replace(/[&<>]/g, function (m) {
                return m === '&' ? '&amp;' : (m === '<' ? '&lt;' : '&gt;');
            });
        }

        document.getElementById('setForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.querySelector('#setForm button');
            const secondFactor = document.getElementById('secondFactor').value.trim();
            const resultDiv = document.getElementById('result');
            if (secondFactor.length !== 8) {
                resultDiv.innerHTML = '<p style="color:red;">验证码必须为8位</p>';
                return;
            }
            if (btn) btn.disabled = true;
            resultDiv.innerHTML = '设置中...';
            try {
                const res = await fetch('/api/set-second-factor', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Auth-Username': currentUser
                    },
                    body: JSON.stringify({ secondFactor })
                });
                const data = await res.json();
                if (res.ok && data.success) {
                    resultDiv.innerHTML = '<p style="color:green;">✅ 设置成功！请重新登录。</p>';
                    // 清除登录状态，让用户重新登录（因为现在有了第二因子）
                    localStorage.removeItem('loggedIn');
                    localStorage.removeItem('currentUser');
                    localStorage.removeItem('userRole');
                    setTimeout(() => {
                        window.location.href = 'login.html';
                    }, 2000);
                } else {
                    resultDiv.innerHTML = `<p style="color:red;">❌ 设置失败: ${escapeHtml(data.error || '未知错误')}</p>`;
                }
            } catch (err) {
                resultDiv.innerHTML = `<p style="color:red;">网络错误: ${escapeHtml(err.message)}</p>`;
            } finally {
                if (btn) btn.disabled = false;
            }
        });
    </script>
</body>
</html>
