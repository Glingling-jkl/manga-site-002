<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>用户管理</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .user-form {
            max-width: 400px;
            margin: 0 auto;
        }
        .user-form input, .user-form select, .user-form button {
            margin: 10px 0;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th, td {
            padding: 10px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }
        .action-btn {
            padding: 5px 10px;
            margin-right: 5px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        .delete-btn {
            background: #f44336;
            color: white;
        }
        .promote-btn {
            background: #4caf50;
            color: white;
        }
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        .tab {
            padding: 10px 20px;
            cursor: pointer;
            background: #f0f0f0;
            border-radius: 5px;
        }
        .tab.active {
            background: #0070f3;
            color: white;
        }
        .tab-content {
            display: none;
        }
        .tab-content.active {
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>👥 用户管理</h2>

        <div class="tabs" id="tabs">
            <div class="tab active" data-tab="register">新注册</div>
            <div class="tab" data-tab="manage">管理</div>
        </div>

        <div id="registerTab" class="tab-content active">
            <form id="createUserForm" class="user-form">
                <input type="text" id="username" placeholder="用户名 (至少3位)" required>
                <input type="password" id="password" placeholder="密码 (至少6位)" required>
                <input type="password" id="secondFactor" placeholder="第二层验证码 (8位，可选)" maxlength="8">
                <div id="roleSelector">
                    <label>角色：</label>
                    <select id="role">
                        <option value="user">普通用户 (user)</option>
                        <option value="admin" id="adminOption" style="display:none;">管理员 (admin)</option>
                        <option value="system" id="systemOption" style="display:none;">系统所有者 (system)</option>
                    </select>
                </div>
                <button type="submit">创建用户</button>
            </form>
            <div id="registerResult" style="margin-top: 20px;"></div>
        </div>

        <div id="manageTab" class="tab-content">
            <h3>用户列表</h3>
            <div id="userListContainer">
                <table id="userTable">
                    <thead>
                        <tr><th>ID</th><th>用户名</th><th>角色</th><th>注册时间</th><th>操作</th></tr>
                    </thead>
                    <tbody id="userListBody">
                        <tr><td colspan="5">加载中...</td></tr>
                    </tbody>
                </table>
            </div>
            <div id="manageResult" style="margin-top: 20px;"></div>
        </div>
    </div>

    <script>
        // 登录和权限检查
        if (!localStorage.getItem('loggedIn')) {
            window.location.replace('login.html?needlogin=1');
        }
        const currentUserRole = localStorage.getItem('userRole') || '';
        const currentUser = localStorage.getItem('currentUser') || '';
        if (currentUserRole !== 'system' && currentUserRole !== 'admin') {
            window.location.replace('index.html');
        }

        // 根据角色控制选项可见性
        if (currentUserRole === 'system') {
            document.getElementById('adminOption').style.display = 'block';
            document.getElementById('systemOption').style.display = 'block';
        } else if (currentUserRole === 'admin') {
            // admin 不能创建 admin 或 system，隐藏角色选择
            document.getElementById('roleSelector').style.display = 'none';
        }

        // 选项卡切换
        const tabs = document.querySelectorAll('.tab');
        tabs.forEach(tab => {
            tab.addEventListener('click', () => {
                tabs.forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
                const tabId = tab.getAttribute('data-tab');
                document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
                document.getElementById(tabId + 'Tab').classList.add('active');
                if (tabId === 'manage') loadUsers();
            });
        });

        // 默认激活管理选项卡（如果是管理员）
        if (currentUserRole === 'system' || currentUserRole === 'admin') {
            // 直接激活管理选项卡
            document.querySelector('.tab[data-tab="manage"]').click();
        }

        // 创建用户表单提交
        document.getElementById('createUserForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const secondFactor = document.getElementById('secondFactor').value.trim() || undefined;
            let role = document.getElementById('role').value;
            if (currentUserRole === 'admin') role = 'user';

            const resultDiv = document.getElementById('registerResult');
            resultDiv.innerHTML = '创建中...';
            try {
                const res = await fetch('/api/create-user', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Auth-Role': currentUserRole
                    },
                    body: JSON.stringify({ username, password, secondFactor, role })
                });
                const data = await res.json();
                if (res.ok && data.success) {
                    resultDiv.innerHTML = '<p style="color:green;">✅ 用户创建成功</p>';
                    document.getElementById('createUserForm').reset();
                    if (document.getElementById('manageTab').classList.contains('active')) {
                        loadUsers();
                    }
                } else {
                    resultDiv.innerHTML = `<p style="color:red;">❌ 创建失败: ${data.error}</p>`;
                }
            } catch (err) {
                resultDiv.innerHTML = `<p style="color:red;">网络错误: ${err.message}</p>`;
            }
        });

        // 加载用户列表
        async function loadUsers() {
            const tbody = document.getElementById('userListBody');
            tbody.innerHTML = '<tr><td colspan="5">加载中...</td></tr>';
            try {
                const res = await fetch('/api/get-users', {
                    headers: { 'X-Auth-Role': currentUserRole }
                });
                if (!res.ok) {
                    const text = await res.text();
                    tbody.innerHTML = `<tr><td colspan="5">HTTP错误 ${res.status}: ${text}</td></tr>`;
                    return;
                }
                const data = await res.json();
                console.log('用户数据:', data); // 调试输出
                if (data.success) {
                    renderUsers(data.data);
                } else {
                    tbody.innerHTML = `<tr><td colspan="5">加载失败: ${data.error}</td></tr>`;
                }
            } catch (err) {
                console.error('加载用户错误:', err);
                tbody.innerHTML = `<tr><td colspan="5">网络错误: ${err.message}</td></tr>`;
            }
        }

        function renderUsers(users) {
            const tbody = document.getElementById('userListBody');
            if (users.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5">暂无用户</td></tr>';
                return;
            }
            let html = '';
            for (let u of users) {
                let deleteBtn = '', promoteBtn = '';
                const canDelete = (currentUserRole === 'system' && u.role !== 'system') ||
                                 (currentUserRole === 'admin' && u.role === 'user');
                const canPromote = (currentUserRole === 'system' && u.role === 'user');

                if (canDelete) deleteBtn = `<button class="action-btn delete-btn" onclick="deleteUser(${u.id})">删除</button>`;
                if (canPromote) promoteBtn = `<button class="action-btn promote-btn" onclick="promoteUser(${u.id})">提权为管理员</button>`;

                html += `<tr>
                    <td>${u.id}</td>
                    <td>${escapeHtml(u.username)}</td>
                    <td>${u.role}</td>
                    <td>${new Date(u.created_at).toLocaleString()}</td>
                    <td>${deleteBtn} ${promoteBtn}</td>
                </tr>`;
            }
            tbody.innerHTML = html;
        }

        // 防止 XSS
        function escapeHtml(str) {
            return str.replace(/[&<>]/g, function(m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            });
        }

        window.deleteUser = async function(userId) {
            if (!confirm('确定要删除该用户吗？此操作不可撤销！')) return;
            const resultDiv = document.getElementById('manageResult');
            resultDiv.innerHTML = '删除中...';
            try {
                const res = await fetch(`/api/delete-user?id=${userId}`, {
                    method: 'DELETE',
                    headers: { 'X-Auth-Role': currentUserRole }
                });
                const data = await res.json();
                if (data.success) {
                    resultDiv.innerHTML = '<p style="color:green;">✅ 用户已删除</p>';
                    loadUsers();
                } else {
                    resultDiv.innerHTML = `<p style="color:red;">❌ 删除失败: ${data.error}</p>`;
                }
            } catch (err) {
                resultDiv.innerHTML = `<p style="color:red;">网络错误: ${err.message}</p>`;
            }
        };

        window.promoteUser = async function(userId) {
            if (!confirm('确定要将该用户提升为管理员吗？')) return;
            const resultDiv = document.getElementById('manageResult');
            resultDiv.innerHTML = '处理中...';
            try {
                const res = await fetch('/api/update-user-role', {
                    method: 'PATCH',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Auth-Role': currentUserRole
                    },
                    body: JSON.stringify({ userId, newRole: 'admin' })
                });
                const data = await res.json();
                if (data.success) {
                    resultDiv.innerHTML = '<p style="color:green;">✅ 已提升为管理员</p>';
                    loadUsers();
                } else {
                    resultDiv.innerHTML = `<p style="color:red;">❌ 提权失败: ${data.error}</p>`;
                }
            } catch (err) {
                resultDiv.innerHTML = `<p style="color:red;">网络错误: ${err.message}</p>`;
            }
        };
    </script>
</body>
</html>
