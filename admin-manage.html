<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理漫画</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .comic-manage-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px;
            border-bottom: 1px solid #eee;
        }
        .comic-manage-item img {
            width: 60px;
            height: 60px;
            object-fit: cover;
            margin-right: 10px;
        }
        .comic-info {
            flex: 1;
        }
        .delete-btn {
            background: #f44336;
            color: white;
            border: none;
            border-radius: 20px;
            padding: 5px 15px;
            cursor: pointer;
        }
        .delete-btn:hover {
            background: #d32f2f;
        }
        .no-permission {
            color: #999;
            font-style: italic;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>📋 管理漫画</h2>
        <div id="comic-list"></div>
        <div id="result" style="margin-top: 20px;"></div>
    </div>

    <script>
        // 登录和权限检查
        if (!localStorage.getItem('loggedIn')) {
            window.location.replace('login.html?needlogin=1');
        }
        const currentUser = localStorage.getItem('currentUser') || '';
        const currentUserRole = localStorage.getItem('userRole') || '';
        if (currentUserRole !== 'system' && currentUserRole !== 'admin') {
            window.location.replace('index.html'); // 普通用户跳转
        }

        const UPLOAD_TOKEN = 'manga-upload-secret-2025'; // 与后端环境变量一致

        async function loadComics() {
            try {
                const res = await fetch('/api/comics');
                const data = await res.json();
                if (data.success) {
                    renderComics(data.data);
                } else {
                    document.getElementById('comic-list').innerHTML = '<p>加载失败</p>';
                }
            } catch (err) {
                document.getElementById('comic-list').innerHTML = `<p>网络错误: ${err.message}</p>`;
            }
        }

        function renderComics(comics) {
            const listDiv = document.getElementById('comic-list');
            if (comics.length === 0) {
                listDiv.innerHTML = '<p>暂无漫画</p>';
                return;
            }
            let html = '';
            for (let c of comics) {
                let actionButton = '';
                // 判断权限：system 可删所有；admin 可删非 system 的漫画
                if (currentUserRole === 'system' || (currentUserRole === 'admin' && c.owner_role !== 'system')) {
                    actionButton = `<button class="delete-btn" onclick="deleteComic(${c.id})">删除</button>`;
                } else {
                    actionButton = `<span class="no-permission">无权限</span>`;
                }
                html += `
                    <div class="comic-manage-item" data-id="${c.id}">
                        <img src="${c.cover_url}" alt="${c.title}">
                        <div class="comic-info">
                            <strong>${c.title}</strong> (${c.author})<br>
                            上传者: ${c.uploader} | 所有者: ${c.owner_role}
                        </div>
                        ${actionButton}
                    </div>
                `;
            }
            listDiv.innerHTML = html;
        }

        async function deleteComic(id) {
            if (!confirm('确定要删除这本漫画吗？此操作不可撤销！')) return;
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = '删除中...';
            try {
                const res = await fetch(`/api/comics/${id}`, {
                    method: 'DELETE',
                    headers: {
                        'X-Upload-Token': UPLOAD_TOKEN,
                        'X-Auth-Role': currentUserRole  // 只发送角色，避免中文用户名导致编码错误
                    }
                });
                const data = await res.json();
                if (data.success) {
                    resultDiv.innerHTML = '<p style="color:green;">删除成功</p>';
                    loadComics(); // 刷新列表
                } else {
                    resultDiv.innerHTML = `<p style="color:red;">删除失败: ${data.error}</p>`;
                }
            } catch (err) {
                resultDiv.innerHTML = `<p style="color:red;">网络错误: ${err.message}</p>`;
            }
        }

        loadComics();
    </script>
</body>
</html>
