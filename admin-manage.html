<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理漫画</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .page-header {
            text-align: center;
            margin-bottom: 22px;
            animation: fadeUp 0.5s var(--ease-out) both;
        }
        .page-header h2 {
            font-size: 1.5rem;
            font-weight: 800;
            background: linear-gradient(120deg, #0070f3, #7c5cff 60%, #ff8fab);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .comic-manage-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 14px;
            margin-bottom: 10px;
            background: #fff;
            border: 1px solid rgba(0, 0, 0, 0.05);
            border-radius: 14px;
            box-shadow: var(--shadow-sm);
            transition: transform 0.22s var(--ease-spring), box-shadow 0.25s ease, border-color 0.2s ease;
            animation: fadeUp 0.4s var(--ease-out) both;
        }
        .comic-manage-item:hover {
            transform: translateY(-3px);
            box-shadow: var(--shadow-md);
            border-color: rgba(0, 112, 243, 0.25);
        }
        .comic-manage-item img {
            width: 56px;
            height: 76px;
            object-fit: cover;
            margin-right: 14px;
            border-radius: 10px;
            box-shadow: var(--shadow-sm);
        }
        .comic-info {
            flex: 1;
            font-size: 0.9rem;
        }
        .comic-info strong {
            color: var(--ink);
            font-size: 0.95rem;
        }
        .comic-info br + span, .comic-info + span { color: var(--ink-soft); }
        .delete-btn {
            width: auto;
            background: linear-gradient(135deg, #f87171, #ef4444);
            color: white;
            border: none;
            border-radius: 20px;
            padding: 7px 18px;
            cursor: pointer;
            font-weight: 700;
            box-shadow: 0 4px 14px rgba(239, 68, 68, 0.35);
            transition: transform 0.18s var(--ease-spring), filter 0.2s ease;
        }
        .delete-btn:hover {
            filter: brightness(1.08);
            transform: translateY(-2px);
        }
        .no-permission {
            color: var(--ink-faint);
            font-style: italic;
        }
    </style>
    <script src="common.js" defer></script>
</head>
<body>
    <div class="container">
        <div class="page-header">
            <h2>📋 管理漫画</h2>
        </div>
        <div id="comic-list"></div>
        <div id="result" style="margin-top: 20px;"></div>
    </div>

    <script>
        if (!localStorage.getItem('loggedIn')) {
            window.location.replace('login.html?needlogin=1');
        }
        const currentUserRole = localStorage.getItem('userRole') || '';
        const currentUser = localStorage.getItem('currentUser') || '';
        if (currentUserRole !== 'system' && currentUserRole !== 'admin') {
            window.location.replace('index.html');
        }

        const UPLOAD_TOKEN = 'manga-upload-secret-2025';

        function escapeHtml(str) {
            if (str == null) return '';
            return String(str).replace(/[&<>]/g, function (m) {
                return m === '&' ? '&amp;' : (m === '<' ? '&lt;' : '&gt;');
            });
        }

        async function loadComics() {
            try {
                const res = await fetch('/api/comics', {
                    headers: {
                        'X-Auth-UserId': localStorage.getItem('currentUserId'),
                        'X-Auth-Role': currentUserRole
                    }
                });
                const data = await res.json();
                if (data.success) {
                    renderComics(data.data);
                } else {
                    document.getElementById('comic-list').innerHTML = '<p>加载失败</p>';
                }
            } catch (err) {
                document.getElementById('comic-list').innerHTML = `<p>网络错误: ${escapeHtml(err.message)}</p>`;
            }
        }

        function renderComics(comics) {
            const listDiv = document.getElementById('comic-list');
            if (comics.length === 0) {
                listDiv.innerHTML = '<p>暂无漫画</p>';
                return;
            }
            let html = '';
            for (let c of comics) {
                let actionButton = '';
                if (currentUserRole === 'system' || (currentUserRole === 'admin' && c.owner_role !== 'system')) {
                    actionButton = `<button class="delete-btn" onclick="deleteComic(${c.id})">删除</button>`;
                } else {
                    actionButton = `<span class="no-permission">无权限</span>`;
                }
                html += `
                    <div class="comic-manage-item" data-id="${c.id}">
                        <img src="/api/proxy?url=${encodeURIComponent(c.cover_url || '')}" alt="${escapeHtml(c.title || '')}" loading="lazy" onerror="this.style.visibility='hidden'">
                        <div class="comic-info">
                            <strong>${escapeHtml(c.title || '')}</strong> (${escapeHtml(c.author || '')})<br>
                            上传者: ${escapeHtml(c.uploader || '')} | 所有者: ${escapeHtml(c.owner_role || '')}
                        </div>
                        ${actionButton}
                    </div>
                `;
            }
            listDiv.innerHTML = html;
        }

        async function deleteComic(id) {
            if (!confirm('确定要删除这本漫画吗？此操作不可撤销！')) return;
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = '删除中...';
            try {
                const res = await fetch(`/api/comics/${id}`, {
                    method: 'DELETE',
                    headers: {
                        'X-Upload-Token': UPLOAD_TOKEN,
                        'X-Auth-Role': currentUserRole
                    }
                });
                const data = await res.json();
                if (data.success) {
                    resultDiv.innerHTML = '<p style="color:green;">删除成功</p>';
                    loadComics();
                } else {
                    resultDiv.innerHTML = `<p style="color:red;">删除失败: ${escapeHtml(data.error || '未知错误')}</p>`;
                }
            } catch (err) {
                resultDiv.innerHTML = `<p style="color:red;">网络错误: ${escapeHtml(err.message)}</p>`;
            }
        }

        loadComics();
    </script>
</body>
</html>
