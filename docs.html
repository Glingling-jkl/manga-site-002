<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>文档中心</title>
<style>
    /* === 全局重置 === */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #f8f9fc; }

    /* === 主内容区 === */
    .container { max-width: 800px; margin: 0 auto; padding: 40px 20px; }
    .doc-content { 
        background: white; border-radius: 16px; padding: 40px; 
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05); line-height: 1.8; 
    }

    /* === 侧边栏样式 (毛玻璃/滑动) === */
    .sidebar {
        position: fixed; top: 0; right: -320px; width: 300px; height: 100%;
        background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px);
        box-shadow: -4px 0 24px rgba(0, 0, 0, 0.1); transition: right 0.4s;
        z-index: 1000; padding: 24px 16px; overflow-y: auto;
    }
    .sidebar.open { right: 0; }

    /* === 列表项通用样式 === */
    .folder-item, .file-item {
        padding: 12px 16px; border-radius: 12px; cursor: pointer;
        transition: all 0.2s; color: #333; font-size: 0.95rem;
        display: flex; justify-content: space-between; align-items: center;
    }
    
    /* === 文件夹箭头动画 === */
    .folder-arrow {
        font-size: 1.1rem; color: #666;
        transition: all 0.3s; margin-left: 8px;
    }
    /* 点击展开后：箭头旋转90度(变向下)且颜色变淡 */
    .folder-arrow.rotated { 
        transform: rotate(90deg); 
        color: #aaa; 
    }

    /* 悬停效果 */
    .folder-item:hover, .file-item:hover { background: #f0f4ff; }

    /* === 子菜单展开收起动画 === */
    .folder-children {
        overflow: hidden; transition: max-height 0.4s; max-height: 0;
    }
    .folder-children.open { max-height: 1000px; }

    /* === 右下角按钮 === */
    .menu-btn {
        position: fixed; bottom: 32px; right: 32px; width: 60px; height: 60px;
        border-radius: 50%; background: white; color: #4f46e5; border: none;
        font-size: 1.5rem; cursor: pointer; box-shadow: 0 4px 16px rgba(0,0,0,0.1);
        transition: all 0.3s; display: flex; align-items: center; justify-content: center;
    }
    .menu-btn:hover { transform: scale(1.05); }
    .menu-btn.left-arrow { background: white; color: #4f46e5; }
</style>
</head>
<body>

<div class="container">
    <div id="doc-content" class="doc-content">
        <h1>文档中心</h1>
        <p>点击右下角按钮查看目录</p>
    </div>
</div>

<!-- 侧边栏 -->
<div id="sidebar" class="sidebar">
    <div id="tree"></div>
</div>

<!-- 右下角按钮 -->
<button id="menuBtn" class="menu-btn">☰</button>

<script>
    // === 核心变量 ===
    const sidebar = document.getElementById('sidebar');
    const menuBtn = document.getElementById('menuBtn');
    const treeContainer = document.getElementById('tree');
    let openFolderId = null; // 记录当前展开的文件夹

    // === 1. 按钮交互：打开/关闭侧边栏并改变图标 ===
    menuBtn.addEventListener('click', () => {
        sidebar.classList.toggle('open');
        // 侧边栏打开时显示返回箭头
        menuBtn.className = sidebar.classList.contains('open') ? 'menu-btn left-arrow' : 'menu-btn';
        menuBtn.innerHTML = sidebar.classList.contains('open') ? '←' : '☰';
    });

    // === 2. 动态加载数据 (保留你原有的接口逻辑) ===
    async function loadTree() {
        try {
            // 这里保留你原有的 fetch 逻辑
            const res = await fetch('/api/docs/list');
            const data = await res.json();
            
            if (data.success) {
                buildTree(data.data);
            }
        } catch (err) {
            treeContainer.innerHTML = '<div>加载失败</div>';
        }
    }

    // === 3. 构建树形结构 (无图标版本) ===
    function buildTree(data) {
        treeContainer.innerHTML = '';
        
        // 假设 data.children 是文件夹数组
        (data.children || []).forEach(item => {
            if (item.type === 'folder') {
                const folderId = 'folder_' + Date.now() + Math.random().toString(36).substr(2, 9);
                
                // 创建文件夹 DOM 结构
                const folderEl = document.createElement('div');
                folderEl.className = 'folder-item';
                folderEl.setAttribute('data-folder-id', folderId);
                folderEl.innerHTML = `
                    <div class="folder-label" data-id="${folderId}">
                        ${item.name} <!-- 文件夹名字 -->
                        <span class="folder-arrow">‹</span> <!-- 左箭头符号 -->
                    </div>
                    <div class="folder-children" id="${folderId}-children"></div>
                `;
                treeContainer.appendChild(folderEl);

                // 填充子文件 (如果没有子文件，这一步可以省略)
                const childrenContainer = document.getElementById(`${folderId}-children`);
                (item.children || []).forEach(child => {
                    if (child.type === 'file') {
                        const fileEl = document.createElement('div');
                        fileEl.className = 'file-item';
                        fileEl.setAttribute('data-path', child.path);
                        fileEl.textContent = child.name.replace('.md', '');
                        childrenContainer.appendChild(fileEl);
                    }
                });

                // 绑定点击事件
                const label = folderEl.querySelector('.folder-label');
                label.addEventListener('click', () => toggleFolder(folderId, folderEl, label));
            }
        });
    }

    // === 4. 核心动画函数：文件夹展开/折叠 ===
    function toggleFolder(folderId, folderElement, labelElement) {
        const isCurrentlyOpen = openFolderId === folderId;
        const allFolders = Array.from(treeContainer.querySelectorAll('.folder-item'));
        const clickedIndex = allFolders.indexOf(folderElement);

        // 如果点击的是同一个，直接关闭
        if (isCurrentlyOpen) {
            closeFolder(folderId);
            return;
        }

        // 如果有其他打开的，先关闭它
        if (openFolderId) {
            closeFolder(openFolderId);
        }

        // --- 动画开始：移出屏幕 ---
        allFolders.forEach((folder, index) => {
            if (folder !== folderElement) {
                folder.style.transition = 'transform 0.3s, opacity 0.2s';
                // 上面的向上飞，下面的向下飞
                folder.style.transform = index < clickedIndex ? 'translateY(-100%)' : 'translateY(100%)';
                folder.style.opacity = '0';
            }
        });

        // --- 位置重组：将当前点击的移到顶部 ---
        setTimeout(() => {
            treeContainer.insertBefore(folderElement, treeContainer.firstChild);
            
            // 恢复其他文件夹位置
            allFolders.forEach(folder => {
                if (folder !== folderElement) {
                    folder.style.transform = '';
                    folder.style.opacity = '1';
                }
            });

            // 最后展开子菜单
            openFolder(folderId, labelElement);
        }, 300); // 300ms 等待移出动画结束
    }

    function openFolder(id, label) {
        document.getElementById(`${id}-children`)?.classList.add('open');
        label.querySelector('.folder-arrow')?.classList.add('rotated');
        openFolderId = id;
    }

    function closeFolder(id) {
        document.getElementById(`${id}-children`)?.classList.remove('open');
        document.querySelector(`.folder-label[data-id="${id}"] .folder-arrow`)?.classList.remove('rotated');
        openFolderId = null;
    }

    // === 5. 绑定文档加载事件 ===
    // 这里保留你原有的文件加载逻辑
    async function loadDocument(path) {
        const docContent = document.getElementById('doc-content');
        docContent.innerHTML = '加载中...';
        try {
            const res = await fetch(`/api/docs/content?path=${encodeURIComponent(path)}`);
            const content = await res.text();
            docContent.innerHTML = content; // 实际项目中建议用 DOMPurify 处理
        } catch (err) {
            docContent.innerHTML = '加载失败';
        }
    }

    // 页面加载完成后初始化
    document.addEventListener('DOMContentLoaded', loadTree);

    // 代理点击事件给动态生成的文件项
    treeContainer.addEventListener('click', (e) => {
        const fileItem = e.target.closest('.file-item');
        if (fileItem) {
            const path = fileItem.getAttribute('data-path');
            loadDocument(path);
            sidebar.classList.remove('open'); // 加载后关闭侧边栏
        }
    });
</script>

</body>
</html>
