<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>文档中心</title>
    <link rel="stylesheet" href="style.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #f8f9fc;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
            overflow-x: hidden;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 20px;
        }

        .doc-content {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.03);
            line-height: 1.7;
            color: #1e293b;
            font-size: 1rem;
        }

        .doc-content h1 {
            font-size: 1.8rem;
            margin-top: 0;
            margin-bottom: 1rem;
            color: #0f172a;
            font-weight: 600;
        }
        .doc-content h2 {
            font-size: 1.4rem;
            margin-top: 2rem;
            margin-bottom: 1rem;
            color: #1e293b;
            font-weight: 500;
        }
        .doc-content p {
            margin: 1rem 0;
            line-height: 1.7;
        }
        .doc-content blockquote {
            border-left: 4px solid #3b82f6;
            padding-left: 1rem;
            color: #475569;
            margin: 1rem 0;
            background: #f1f5f9;
            border-radius: 0 12px 12px 0;
        }
        .doc-content code {
            background: #f1f5f9;
            padding: 0.2rem 0.4rem;
            border-radius: 6px;
            font-family: 'SF Mono', monospace;
            font-size: 0.9rem;
        }
        .doc-content pre {
            background: #1e293b;
            color: #e2e8f0;
            padding: 1rem;
            border-radius: 12px;
            overflow-x: auto;
        }

        .sidebar {
            position: fixed;
            top: 0;
            right: -100%;
            width: 320px;
            height: 100%;
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(10px);
            box-shadow: -4px 0 24px rgba(0, 0, 0, 0.05);
            transition: right 0.4s cubic-bezier(0.2, 0.9, 0.4, 1.1);
            z-index: 1000;
            overflow-y: auto;
            padding: 24px 20px;
            border-left: 1px solid rgba(0, 0, 0, 0.05);
        }

        .sidebar.open {
            right: 0;
        }

        .sidebar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 32px;
            padding-bottom: 16px;
            border-bottom: 1px solid #eef2f6;
        }

        .sidebar-header h3 {
            font-size: 1.1rem;
            font-weight: 500;
            color: #0f172a;
            margin: 0;
        }

        .close-sidebar {
            background: none;
            border: none;
            font-size: 1.4rem;
            cursor: pointer;
            padding: 8px;
            color: #64748b;
            transition: all 0.2s;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .close-sidebar:hover {
            background: #f1f5f9;
            color: #0f172a;
        }

        .tree {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .tree li {
            list-style: none;
            margin: 0;
            padding: 0;
        }

        .folder-item {
            margin-bottom: 8px;
        }

        .folder-label {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 12px;
            cursor: pointer;
            border-radius: 12px;
            transition: background 0.2s;
            color: #334155;
            font-size: 0.95rem;
            font-weight: 500;
        }

        .folder-label:hover {
            background: #f1f5f9;
        }

        .folder-name {
            flex: 1;
        }

        .folder-arrow {
            font-size: 1rem;
            color: #94a3b8;
            transition: transform 0.2s;
            display: inline-block;
            width: 20px;
            text-align: center;
        }

        .folder-arrow.rotated {
            transform: rotate(90deg);
        }

        .folder-children {
            display: none;
            margin-left: 0;
        }

        .folder-children.open {
            display: block;
        }

        .file-item {
            padding: 10px 12px 10px 32px;
            cursor: pointer;
            border-radius: 12px;
            transition: background 0.2s;
            color: #64748b;
            font-size: 0.9rem;
        }

        .file-item:hover {
            background: #f1f5f9;
            color: #0f172a;
        }

        .menu-btn {
            position: fixed;
            bottom: 24px;
            right: 24px;
            width: 56px;
            height: 56px;
            border-radius: 28px;
            background: #ffffff;
            color: #3b82f6;
            font-size: 1.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.2, 0.9, 0.4, 1.1);
            z-index: 1000;
            border: 1px solid rgba(59, 130, 246, 0.2);
            backdrop-filter: blur(8px);
            background: rgba(255, 255, 255, 0.95);
        }

        .menu-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 24px rgba(59, 130, 246, 0.2);
        }

        .menu-btn.left-arrow {
            background: #ffffff;
            color: #3b82f6;
        }

        .menu-btn.left-arrow::before {
            content: "←";
        }

        .menu-btn span {
            display: none;
        }

        .menu-btn.left-arrow span {
            display: none;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #94a3b8;
        }

        .welcome-message {
            text-align: center;
            padding: 60px 20px;
            color: #94a3b8;
        }

        .welcome-message h2 {
            color: #3b82f6;
            margin-bottom: 12px;
            font-weight: 500;
        }

        .retry-btn {
            margin-top: 20px;
            padding: 8px 24px;
            background: #3b82f6;
            color: white;
            border: none;
            border-radius: 40px;
            cursor: pointer;
            font-size: 0.9rem;
        }

        @media (max-width: 600px) {
            .sidebar {
                width: 280px;
            }
            .doc-content {
                padding: 24px;
            }
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.6/purify.min.js"></script>
</head>
<body>
    <div class="container">
        <div id="doc-content" class="doc-content">
            <div class="welcome-message">
                <h2>📚 文档中心</h2>
                <p>点击右下角按钮打开目录</p>
            </div>
        </div>
    </div>

    <div id="sidebar" class="sidebar">
        <div class="sidebar-header">
            <h3>目录</h3>
            <button class="close-sidebar" id="closeSidebarBtn">←</button>
        </div>
        <div id="tree"></div>
    </div>

    <div id="menuBtn" class="menu-btn">☰</div>

    <script>
        // DOM 元素
        const sidebar = document.getElementById('sidebar');
        const menuBtn = document.getElementById('menuBtn');
        const closeSidebarBtn = document.getElementById('closeSidebarBtn');
        const docContent = document.getElementById('doc-content');
        const treeContainer = document.getElementById('tree');

        // 状态
        let openFolders = new Set(); // 记录打开的文件夹ID

        // 辅助函数
        function updateMenuButton() {
            if (sidebar.classList.contains('open')) {
                menuBtn.classList.add('left-arrow');
                menuBtn.innerHTML = '<span></span>';
            } else {
                menuBtn.classList.remove('left-arrow');
                menuBtn.innerHTML = '☰';
            }
        }

        function openSidebar() {
            sidebar.classList.add('open');
            updateMenuButton();
        }

        function closeSidebar() {
            sidebar.classList.remove('open');
            updateMenuButton();
        }

        menuBtn.addEventListener('click', openSidebar);
        closeSidebarBtn.addEventListener('click', closeSidebar);
        document.addEventListener('click', function(e) {
            if (sidebar.classList.contains('open') && !sidebar.contains(e.target) && e.target !== menuBtn && !menuBtn.contains(e.target)) {
                closeSidebar();
            }
        });

        // 递归构建树形结构（无图标，仅文字，不包含顶层 docs 文件夹）
        function buildTreeHTML(node) {
            if (!node) return '';
            if (node.type === 'file') {
                return `<div class="file-item" data-path="${node.path || node.name}">
                            <span class="file-name">${escapeHtml(node.name.replace('.md', ''))}</span>
                        </div>`;
            }
            if (node.type === 'folder') {
                const folderId = 'folder_' + Date.now() + '_' + Math.random();
                return `<div class="folder-item" data-folder-id="${folderId}">
                            <div class="folder-label" data-folder="${node.name}" data-id="${folderId}">
                                <span class="folder-name">${escapeHtml(node.name)}</span>
                                <span class="folder-arrow">›</span>
                            </div>
                            <div class="folder-children" id="${folderId}-children">
                                ${node.children ? node.children.map(child => buildTreeHTML(child)).join('') : ''}
                            </div>
                        </div>`;
            }
            return '';
        }

        // 切换文件夹展开/折叠
        function toggleFolder(labelElement) {
            const folderId = labelElement.getAttribute('data-id');
            const childrenDiv = document.getElementById(`${folderId}-children`);
            const arrow = labelElement.querySelector('.folder-arrow');
            if (!childrenDiv) return;

            const isOpen = openFolders.has(folderId);
            if (isOpen) {
                // 关闭
                childrenDiv.classList.remove('open');
                arrow.classList.remove('rotated');
                openFolders.delete(folderId);
            } else {
                // 打开
                childrenDiv.classList.add('open');
                arrow.classList.add('rotated');
                openFolders.add(folderId);
            }
        }

        // 加载文档内容
        async function loadDocument(path) {
            docContent.innerHTML = '<div class="loading">加载文档...</div>';
            try {
                const res = await fetch(`/api/docs/content?path=${encodeURIComponent(path)}`);
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                const markdown = await res.text();
                const rawHtml = marked.parse(markdown);
                const cleanHtml = DOMPurify.sanitize(rawHtml);
                docContent.innerHTML = cleanHtml;
            } catch (err) {
                docContent.innerHTML = `<div class="loading" style="color:red;">加载失败: ${err.message}</div>`;
            }
        }

        // 绑定事件
        function bindEvents() {
            // 文件夹点击
            document.querySelectorAll('.folder-label').forEach(label => {
                label.removeEventListener('click', handleFolderClick);
                label.addEventListener('click', handleFolderClick);
            });
            // 文件点击
            document.querySelectorAll('.file-item').forEach(file => {
                file.removeEventListener('click', handleFileClick);
                file.addEventListener('click', handleFileClick);
            });
        }

        function handleFolderClick(e) {
            e.stopPropagation();
            const label = e.currentTarget;
            toggleFolder(label);
        }

        function handleFileClick(e) {
            const path = e.currentTarget.getAttribute('data-path');
            if (path) {
                loadDocument(path);
                closeSidebar();
            }
        }

        // 加载目录树
        async function loadTree() {
            treeContainer.innerHTML = '<div class="loading">加载中...</div>';
            try {
                const res = await fetch('/api/docs/list');
                const data = await res.json();
                if (data.success) {
                    const children = data.data.children || [];
                    let html = '';
                    for (const child of children) {
                        html += buildTreeHTML(child);
                    }
                    treeContainer.innerHTML = html;
                    bindEvents();
                } else {
                    treeContainer.innerHTML = `<div class="loading"><p>加载失败</p><button class="retry-btn" onclick="location.reload()">重试</button></div>`;
                }
            } catch (err) {
                console.error(err);
                treeContainer.innerHTML = `<div class="loading"><p>网络错误</p><button class="retry-btn" onclick="location.reload()">重试</button></div>`;
            }
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>]/g, function(m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            });
        }

        loadTree();
    </script>
</body>
</html>
