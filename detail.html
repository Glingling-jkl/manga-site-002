<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>漫画详情</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* 打开详情页时的“镜头拉近”入场 */
        .container {
            animation: pageZoomIn 0.55s var(--ease-out) both;
        }
        .comic-detail {
            text-align: center;
        }
        .comic-detail img {
            max-width: 220px;
            border-radius: 16px;
            background: #eef1f6;
            box-shadow: var(--shadow-lg);
            animation: popIn 0.55s var(--ease-spring) both;
        }
        .comic-detail h1 {
            margin-top: 18px;
            font-size: 1.7rem;
            font-weight: 800;
            background: linear-gradient(120deg, var(--ink) 40%, var(--primary) 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            animation: fadeUp 0.5s 0.08s var(--ease-out) both;
        }
        .comic-detail > p {
            color: var(--ink-soft);
            margin-top: 12px;
            line-height: 1.6;
            animation: fadeUp 0.5s 0.12s var(--ease-out) both;
        }
        .comic-detail button {
            font-size: 1.1rem;
            margin-top: 22px;
            width: auto;
            padding: 14px 42px;
            border-radius: var(--radius-pill);
            animation: fadeUp 0.5s 0.16s var(--ease-out) both;
        }
        .back-btn {
            width: auto;
            padding: 10px 22px;
            margin-bottom: 22px;
            border-radius: var(--radius-pill);
        }
        .comic-info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin: 22px 0;
        }
        .comic-info-card {
            background: linear-gradient(160deg, #ffffff, #f7faff);
            border: 1px solid rgba(0, 112, 243, 0.08);
            border-radius: 14px;
            padding: 13px 16px;
            box-shadow: var(--shadow-sm);
            text-align: left;
            font-size: 0.9rem;
            line-height: 1.4;
            word-break: break-word;
            transition: transform 0.2s var(--ease-spring), box-shadow 0.25s ease, border-color 0.2s ease;
            animation: fadeUp 0.5s var(--ease-out) both;
        }
        .comic-info-card:nth-child(1) { animation-delay: 0.05s; }
        .comic-info-card:nth-child(2) { animation-delay: 0.1s; }
        .comic-info-card:nth-child(3) { animation-delay: 0.15s; }
        .comic-info-card:nth-child(4) { animation-delay: 0.2s; }
        .comic-info-card:nth-child(5) { animation-delay: 0.25s; }
        .comic-info-card:nth-child(6) { animation-delay: 0.3s; }
        .comic-info-card:hover {
            transform: translateY(-3px);
            box-shadow: var(--shadow-md);
            border-color: rgba(0, 112, 243, 0.3);
        }
        .comic-info-card strong {
            color: #2c3e50;
            font-weight: 700;
            margin-right: 8px;
            display: inline-block;
            min-width: 52px;
        }
        .comic-info-card.tags-card {
            grid-column: 1 / -1;
        }
        .adult-warning {
            color: #ff6b6b;
            margin-top: 12px;
            font-size: 0.9rem;
            font-weight: 600;
            animation: glowPulse 3s ease-in-out infinite;
            border-radius: var(--radius-pill);
        }
        @media (max-width: 768px) {
            .comic-info-grid {
                gap: 8px;
            }
            .comic-info-card {
                padding: 8px 12px;
                font-size: 0.75rem;
            }
            .comic-info-card strong {
                min-width: 40px;
                margin-right: 6px;
                font-size: 0.75rem;
            }
        }
        @media (max-width: 480px) {
            .comic-info-grid {
                gap: 6px;
            }
            .comic-info-card {
                padding: 6px 10px;
                font-size: 0.7rem;
            }
            .comic-info-card strong {
                min-width: 36px;
                margin-right: 4px;
                font-size: 0.7rem;
            }
        }
        .comments-section {
            margin-top: 40px;
            text-align: left;
        }
        .comments-section h3 {
            border-bottom: 2px solid var(--pink-light);
            padding-bottom: 10px;
            font-size: 1.2rem;
            font-weight: 800;
        }
        .comment-item {
            padding: 12px 0;
            border-bottom: 1px solid #f0f0f0;
            position: relative;
            cursor: default;
            user-select: none;
            animation: fadeUp 0.4s var(--ease-out) both;
        }
        .comment-user-info {
            display: inline-block;
            margin-bottom: 5px;
        }
        .comment-user {
            font-weight: 700;
            color: var(--primary);
            font-size: 0.9rem;
        }
        .comment-group {
            font-size: 0.7rem;
            color: #666;
            margin-left: 6px;
            background: #f0f0f0;
            padding: 1px 6px;
            border-radius: 12px;
            vertical-align: middle;
        }
        .comment-time {
            font-size: 0.7rem;
            color: var(--ink-faint);
            margin-left: 10px;
        }
        .comment-content {
            margin-top: 5px;
            font-size: 0.9rem;
            line-height: 1.5;
            white-space: pre-wrap;
            word-break: break-word;
        }
        .replies-container {
            margin-left: 24px;
            padding-left: 12px;
            border-left: 2px solid var(--pink-light);
            margin-top: 8px;
        }
        .reply-item {
            margin-top: 12px;
            padding: 10px;
            background: linear-gradient(160deg, #fbfcff, #f7f9fc);
            border-radius: 12px;
            animation: fadeUp 0.4s var(--ease-out) both;
        }
        .reply-user {
            font-weight: 700;
            color: var(--primary);
            font-size: 0.85rem;
        }
        .reply-group {
            font-size: 0.7rem;
            color: #666;
            margin-left: 6px;
            background: #e8e8e8;
            padding: 1px 6px;
            border-radius: 12px;
        }
        .reply-time {
            font-size: 0.7rem;
            color: var(--ink-faint);
            margin-left: 10px;
        }
        .reply-text {
            margin-top: 4px;
            font-size: 0.85rem;
            line-height: 1.4;
        }
        .reply-at {
            color: var(--primary);
            font-weight: 600;
        }
        .reply-button {
            font-size: 0.7rem;
            color: var(--primary);
            cursor: pointer;
            margin-left: 10px;
            display: inline-block;
            font-weight: 600;
            padding: 2px 10px;
            border-radius: 12px;
            background: rgba(0, 112, 243, 0.08);
            transition: background 0.2s ease;
        }
        .reply-button:hover {
            background: rgba(0, 112, 243, 0.16);
        }
        .reply-form {
            margin-top: 10px;
            margin-bottom: 10px;
            background: #f5f7fb;
            border: 1px solid rgba(0, 112, 243, 0.1);
            padding: 12px;
            border-radius: 14px;
            display: none;
            animation: fadeUp 0.25s var(--ease-out);
        }
        .reply-form .reply-textarea-row {
            margin-bottom: 8px;
        }
        .reply-form .reply-textarea-row textarea {
            width: 100%;
            padding: 10px;
            border-radius: 12px;
            border: 1px solid #e3e8f0;
            resize: vertical;
            font-size: 0.85rem;
            box-sizing: border-box;
        }
        .reply-form .reply-actions-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .reply-form button {
            background: var(--grad-brand);
            color: white;
            border: none;
            padding: 7px 18px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: 700;
            white-space: nowrap;
            width: auto;
            box-shadow: 0 4px 12px rgba(0, 112, 243, 0.3);
        }
        .reply-form button:hover {
            filter: brightness(1.06);
        }
        .reply-at-toggle {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: #aaa;
            color: white;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s, transform 0.2s var(--ease-spring);
            flex-shrink: 0;
        }
        .reply-at-toggle.active {
            background: var(--primary);
            transform: scale(1.1);
        }
        .reply-at-toggle.inactive {
            background: #aaa;
        }
        .comment-form {
            margin-top: 20px;
        }
        .comment-form textarea {
            width: 100%;
            padding: 12px;
            border-radius: 14px;
            border: 1px solid #e3e8f0;
            resize: vertical;
            background: rgba(255, 255, 255, 0.85);
        }
        .comment-form button {
            margin-top: 10px;
            background: var(--grad-brand);
            color: white;
            border: none;
            padding: 10px 26px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 700;
            width: auto;
            box-shadow: 0 6px 16px rgba(0, 112, 243, 0.3);
        }
        .comment-error {
            color: #ef4444;
            margin-top: 5px;
            font-size: 0.85rem;
        }
        .login-prompt {
            margin-top: 20px;
            background: linear-gradient(160deg, #f9fbff, #fdf6f9);
            border: 1px dashed rgba(0, 112, 243, 0.25);
            padding: 18px;
            border-radius: 14px;
            text-align: center;
        }
        .login-prompt a { color: var(--primary); font-weight: 700; text-decoration: none; }
        .comment-context-menu {
            position: fixed;
            background: rgba(255, 255, 255, 0.97);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(0, 0, 0, 0.06);
            border-radius: 12px;
            box-shadow: var(--shadow-lg);
            z-index: 10000;
            min-width: 120px;
            overflow: hidden;
            animation: popIn 0.16s var(--ease-spring);
        }
        .comment-context-menu ul {
            list-style: none;
            margin: 0;
            padding: 6px;
        }
        .comment-context-menu li {
            padding: 8px 14px;
            cursor: pointer;
            font-size: 0.9rem;
            border-radius: 8px;
            font-weight: 600;
            transition: background 0.15s ease;
        }
        .comment-context-menu li:hover {
            background: rgba(0, 112, 243, 0.08);
        }
        .comment-context-menu li.disabled {
            color: var(--ink-faint);
            cursor: not-allowed;
        }
        .comment-context-menu li.disabled:hover {
            background: none;
        }
    </style>
    <script src="common.js" defer></script>
</head>
<body>
    <div class="container">
        <button class="btn-ghost back-btn" onclick="location.href='index.html'">⬅ 返回列表</button>
        <div id="comic-detail" class="comic-detail"></div>

        <div id="comments-section" class="comments-section">
            <h3>💬 评论区</h3>
            <div id="comment-list"></div>
            <div id="comment-form-container"></div>
        </div>
    </div>

    <script>
        // ========== 辅助函数 ==========
        const CHUNK_COUNT = 4;
        async function fetchWithChunks(url) {
            const headRes = await fetch(url, { method: 'HEAD', mode: 'cors' });
            if (!headRes.ok) throw new Error(`HTTP ${headRes.status}`);
            const contentLength = headRes.headers.get('content-length');
            const acceptRanges = headRes.headers.get('accept-ranges');
            if (!contentLength || acceptRanges !== 'bytes') {
                const res = await fetch(url, { mode: 'cors' });
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                return await res.blob();
            }
            const total = parseInt(contentLength, 10);
            const chunkSize = Math.ceil(total / CHUNK_COUNT);
            const promises = [];
            for (let i = 0; i < CHUNK_COUNT; i++) {
                const start = i * chunkSize;
                const end = (i === CHUNK_COUNT - 1) ? total - 1 : Math.min(start + chunkSize - 1, total - 1);
                if (start > end) continue;
                promises.push(
                    fetch(url, {
                        mode: 'cors',
                        headers: { 'Range': `bytes=${start}-${end}` }
                    }).then(res => res.arrayBuffer())
                );
            }
            const buffers = await Promise.all(promises);
            const totalLength = buffers.reduce((acc, buf) => acc + buf.byteLength, 0);
            const merged = new Uint8Array(totalLength);
            let offset = 0;
            for (const buf of buffers) {
                merged.set(new Uint8Array(buf), offset);
                offset += buf.byteLength;
            }
            return new Blob([merged]);
        }

        let coverObjectUrl = null;
        async function loadCoverImage(imgElement, url) {
            // 释放上一次封面占用的 Blob URL，避免页面内反复加载导致内存泄漏
            if (coverObjectUrl) {
                URL.revokeObjectURL(coverObjectUrl);
                coverObjectUrl = null;
            }
            if (!url) {
                imgElement.src = '';
                return;
            }
            try {
                const proxyUrl = `/api/proxy?url=${encodeURIComponent(url)}`;
                const blob = await fetchWithChunks(proxyUrl);
                coverObjectUrl = URL.createObjectURL(blob);
                imgElement.src = coverObjectUrl;
            } catch (err) {
                console.error('封面加载失败', url, err);
                imgElement.src = '';
            }
        }

        // ========== 登录状态 ==========
        const isLoggedIn = localStorage.getItem('loggedIn') === 'true';
        const currentUserId = localStorage.getItem('currentUserId') || '';
        const currentUserRole = localStorage.getItem('userRole') || '';

        if (!isLoggedIn) {
            window.location.replace('login.html?needlogin=1');
        }

        const urlParams = new URLSearchParams(window.location.search);
        const comicId = urlParams.get('id');
        if (!comicId) {
            document.getElementById('comic-detail').innerHTML = '<p>参数错误</p>';
        } else {
            loadComicDetail(comicId);
            loadComments(comicId);
        }

        // ========== 漫画详情 ==========
        async function loadComicDetail(id) {
            try {
                const res = await fetch(`/api/comics/${id}`, {
                    headers: { 'X-Auth-UserId': currentUserId }
                });
                const data = await res.json();
                if (data.success) {
                    renderComic(data.data);
                } else if (res.status === 403) {
                    document.getElementById('comic-detail').innerHTML = `<p style="color:red;">${data.error}</p>`;
                } else {
                    document.getElementById('comic-detail').innerHTML = '<p>漫画不存在</p>';
                }
            } catch (err) {
                document.getElementById('comic-detail').innerHTML = '<p>加载失败，请稍后重试</p>';
            }
        }

        function extractUsername(uploaderStr) {
            if (!uploaderStr) return '';
            const match = uploaderStr.match(/^([^(]+)/);
            return match ? match[1].trim() : uploaderStr;
        }

        function renderComic(comic) {
            const tags = comic.tags && Array.isArray(comic.tags) ? comic.tags.join(' · ') : '无';
            let warningHtml = '';
            if (comic.is_adult === 'yes') {
                warningHtml = '<div class="adult-warning">⚠️ 不安全性内容</div>';
            }
            const uploaderName = extractUsername(comic.uploader);
            const infoHtml = `
                <div class="comic-info-grid">
                    <div class="comic-info-card"><strong>作者：</strong> ${escapeHtml(comic.author || '未知')}</div>
                    <div class="comic-info-card"><strong>上传者：</strong> ${escapeHtml(uploaderName || '未知')}</div>
                    <div class="comic-info-card"><strong>章数：</strong> ${comic.chapters || 0} 话</div>
                    <div class="comic-info-card"><strong>总页数：</strong> ${comic.pages || 0} 页</div>
                    <div class="comic-info-card"><strong>上传时间：</strong> ${formatDate(comic.uploaded_at)}</div>
                    <div class="comic-info-card tags-card"><strong>标签：</strong> ${escapeHtml(tags)}</div>
                </div>
            `;
            const html = `
                <img id="cover-img" alt="${escapeHtml(comic.title || '')}">
                <h1>${escapeHtml(comic.title || '未知标题')}</h1>
                ${infoHtml}
                <p>${escapeHtml(comic.description || '')}</p>
                <button id="start-reading-btn">📖 开始阅读</button>
                ${warningHtml}
            `;
            document.getElementById('comic-detail').innerHTML = html;

            const coverImg = document.getElementById('cover-img');
            if (coverImg) {
                loadCoverImage(coverImg, comic.cover_url);
            }
            // 用事件绑定代替内联 onclick，避免 zip_url 含特殊字符时注入或出错
            const startBtn = document.getElementById('start-reading-btn');
            if (startBtn) {
                startBtn.addEventListener('click', function () { startReading(comic.zip_url); });
            }
        }

        function startReading(zipUrl) {
            if (!zipUrl) {
                alert('该漫画缺少文件链接，无法阅读');
                return;
            }
            window.location.href = `reader.html?zip=${encodeURIComponent(zipUrl)}&id=${comicId}`;
        }

        function formatDate(value) {
            const d = new Date(value);
            return isNaN(d.getTime()) ? '未知' : d.toLocaleDateString();
        }

        // ========== 评论区 ==========
        let currentMenu = null;
        let allComments = [];
        let topComments = [];

        function getPosition(x, y, menuWidth, menuHeight) {
            const winWidth = window.innerWidth;
            const winHeight = window.innerHeight;
            let offsetX = 10, offsetY = 10;
            let left = x + offsetX;
            let top = y + offsetY;
            if (left + menuWidth > winWidth) left = x - menuWidth - offsetX;
            if (top + menuHeight > winHeight) top = y - menuHeight - offsetY;
            if (left < 0) left = 0;
            if (top < 0) top = 0;
            return { left, top };
        }

        async function loadComments(comicId) {
            const listDiv = document.getElementById('comment-list');
            listDiv.innerHTML = '加载评论中...';
            try {
                const res = await fetch(`/api/comments?comicId=${comicId}`);
                const data = await res.json();
                if (data.success) {
                    allComments = data.data;
                    const repliesMap = new Map();
                    const top = [];
                    for (const comment of allComments) {
                        if (comment.parent_id === 0) top.push(comment);
                        else {
                            if (!repliesMap.has(comment.parent_id)) repliesMap.set(comment.parent_id, []);
                            repliesMap.get(comment.parent_id).push(comment);
                        }
                    }
                    topComments = top.map(topComment => ({
                        ...topComment,
                        replies: (repliesMap.get(topComment.id) || []).sort((a, b) => a.created_at - b.created_at)
                    }));
                    renderComments(topComments);
                } else {
                    listDiv.innerHTML = `<p class="comment-error">加载失败: ${data.error}</p>`;
                }
            } catch (err) {
                listDiv.innerHTML = `<p class="comment-error">网络错误: ${err.message}</p>`;
            }
        }

        // 渲染评论，并对二级评论中开头的 @用户名 进行高亮
        function renderComments(topComments) {
            const listDiv = document.getElementById('comment-list');
            if (topComments.length === 0) {
                listDiv.innerHTML = '<p>暂无评论，来说两句吧～</p>';
                return;
            }
            let html = '';
            for (const top of topComments) {
                let groupName = '';
                if (top.user_role === 'system') groupName = '系统';
                else if (top.user_role === 'admin') groupName = '管理员';
                else groupName = '用户';
                html += `
                    <div class="comment-item" data-comment-id="${top.id}" data-user-id="${top.user_id}" data-user-role="${top.user_role}" data-created-at="${top.created_at}">
                        <div class="comment-user-info">
                            <span class="comment-user">${escapeHtml(top.username)}</span>
                            <span class="comment-group">${groupName}</span>
                            <span class="comment-time">${fmtTime(top.created_at)}</span>
                            <span class="reply-button" data-id="${top.id}">回复</span>
                        </div>
                        <div class="comment-content">${escapeHtml(top.content)}</div>
                        <div class="reply-form" id="reply-form-${top.id}" style="display: none;">
                            <div class="reply-textarea-row">
                                <textarea rows="2" placeholder="回复 @${escapeAttr(top.username)} ..."></textarea>
                            </div>
                            <div class="reply-actions-row">
                                <button data-id="${top.id}">发送</button>
                                <div class="reply-at-toggle inactive" data-id="${top.id}" data-username="${escapeAttr(top.username)}">@</div>
                            </div>
                        </div>
                `;
                if (top.replies && top.replies.length > 0) {
                    html += `<div class="replies-container">`;
                    for (const reply of top.replies) {
                        let replyGroup = '';
                        if (reply.user_role === 'system') replyGroup = '系统';
                        else if (reply.user_role === 'admin') replyGroup = '管理员';
                        else replyGroup = '用户';
                        // 对内容进行高亮处理：如果以 @用户名 开头，则将其包裹为蓝色
                        let contentHtml = escapeHtml(reply.content);
                        const match = contentHtml.match(/^@([^\s]+)\s/);
                        if (match) {
                            const atPart = match[0];
                            const rest = contentHtml.slice(atPart.length);
                            contentHtml = `<span class="reply-at">${atPart}</span>${rest}`;
                        }
                        html += `
                            <div class="reply-item" data-comment-id="${reply.id}" data-user-id="${reply.user_id}" data-user-role="${reply.user_role}" data-created-at="${reply.created_at}">
                                <span class="reply-user">${escapeHtml(reply.username)}</span>
                                <span class="reply-group">${replyGroup}</span>
                                <span class="reply-time">${fmtTime(reply.created_at)}</span>
                                <div class="reply-text">${contentHtml}</div>
                            </div>
                        `;
                    }
                    html += `</div>`;
                }
                html += `</div>`;
            }
            listDiv.innerHTML = html;
        }

        function bindCommentEvents() {
            const listDiv = document.getElementById('comment-list');
            if (!listDiv) return;

            // 回复按钮点击
            listDiv.addEventListener('click', (e) => {
                const btn = e.target.closest('.reply-button');
                if (!btn) return;
                e.stopPropagation();
                const commentId = btn.getAttribute('data-id');
                const form = document.getElementById(`reply-form-${commentId}`);
                if (form) form.style.display = form.style.display === 'none' ? 'block' : 'none';
            });

            // @按钮切换（默认灰色，点击变蓝）
            listDiv.addEventListener('click', (e) => {
                const toggle = e.target.closest('.reply-at-toggle');
                if (!toggle) return;
                e.stopPropagation();
                const isActive = toggle.classList.contains('active');
                const form = toggle.closest('.reply-form');
                const textarea = form.querySelector('textarea');
                const username = toggle.getAttribute('data-username');
                if (isActive) {
                    toggle.classList.remove('active');
                    toggle.classList.add('inactive');
                    if (textarea) textarea.placeholder = '回复...';
                } else {
                    toggle.classList.remove('inactive');
                    toggle.classList.add('active');
                    if (textarea) textarea.placeholder = `回复 @${username} ...`;
                }
            });

            // 发送按钮
            listDiv.addEventListener('click', async (e) => {
                const btn = e.target.closest('.reply-form button');
                if (!btn) return;
                e.stopPropagation();
                const parentId = btn.getAttribute('data-id');
                const form = btn.closest('.reply-form');
                const textarea = form.querySelector('textarea');
                const toggle = form.querySelector('.reply-at-toggle');
                let content = textarea.value.trim();
                if (!content) {
                    alert('请输入回复内容');
                    return;
                }
                const topComment = topComments.find(t => t.id == parentId);
                if (!topComment) return;

                // 如果 @ 按钮是激活状态，则在内容前加上 @主评论用户名
                if (toggle.classList.contains('active')) {
                    const mention = `@${topComment.username} `;
                    if (!content.startsWith(mention)) {
                        content = mention + content;
                    }
                }

                await submitReply(parentId, content);
                textarea.value = '';
                form.style.display = 'none';
            });

            // 右键菜单（桌面）
            listDiv.addEventListener('contextmenu', (e) => {
                const commentElem = e.target.closest('.comment-item, .reply-item');
                if (!commentElem) return;
                e.preventDefault();
                if (currentMenu) {
                    currentMenu.remove();
                    currentMenu = null;
                }
                const commentId = commentElem.getAttribute('data-comment-id');
                const commentUserId = commentElem.getAttribute('data-user-id');
                const commentUserRole = commentElem.getAttribute('data-user-role');
                const commentCreatedAt = parseInt(commentElem.getAttribute('data-created-at'));
                const currentUserId = localStorage.getItem('currentUserId');
                const currentUserRole = localStorage.getItem('userRole');
                const isOwner = (commentUserId === currentUserId);
                const now = Date.now();
                const isWithin5Min = (now - commentCreatedAt) <= 5 * 60 * 1000;
                const canRecall = isOwner && isWithin5Min;
                let canDelete = false;
                if (currentUserRole === 'system') canDelete = true;
                else if (currentUserRole === 'admin' && commentUserRole === 'user') canDelete = true;
                const isTop = commentElem.classList.contains('comment-item') && !commentElem.classList.contains('reply-item');
                let menuHtml = '<ul>';
                if (isTop) menuHtml += `<li data-action="reply">回复</li>`;
                menuHtml += `<li class="${!canRecall ? 'disabled' : ''}" data-action="recall">撤回</li>`;
                menuHtml += `<li class="${!canDelete ? 'disabled' : ''}" data-action="delete">删除</li>`;
                menuHtml += '</ul>';
                const menu = document.createElement('div');
                menu.className = 'comment-context-menu';
                menu.innerHTML = menuHtml;
                document.body.appendChild(menu);
                const menuWidth = menu.offsetWidth;
                const menuHeight = menu.offsetHeight;
                const pos = getPosition(e.clientX, e.clientY, menuWidth, menuHeight);
                menu.style.left = pos.left + 'px';
                menu.style.top = pos.top + 'px';
                menu.querySelectorAll('li').forEach(li => {
                    li.addEventListener('click', async (e) => {
                        e.stopPropagation();
                        const action = li.getAttribute('data-action');
                        if (action === 'reply' && isTop) {
                            const form = document.getElementById(`reply-form-${commentId}`);
                            if (form) form.style.display = 'block';
                            menu.remove();
                            currentMenu = null;
                        } else if (action === 'recall' && canRecall) {
                            await deleteComment(commentId);
                            menu.remove();
                            currentMenu = null;
                        } else if (action === 'delete' && canDelete) {
                            await deleteComment(commentId);
                            menu.remove();
                            currentMenu = null;
                        }
                    });
                });
                const hideMenu = (e) => {
                    if (!menu.contains(e.target)) {
                        menu.remove();
                        currentMenu = null;
                        document.removeEventListener('click', hideMenu);
                        document.removeEventListener('contextmenu', hideMenu);
                    }
                };
                setTimeout(() => {
                    document.addEventListener('click', hideMenu);
                    document.addEventListener('contextmenu', hideMenu);
                }, 0);
                currentMenu = menu;
            });

            // 移动端长按
            let touchTimer = null;
            listDiv.addEventListener('touchstart', (e) => {
                const target = e.target.closest('.comment-item, .reply-item');
                if (!target) return;
                touchTimer = setTimeout(() => {
                    const fakeEvent = new MouseEvent('contextmenu', {
                        clientX: e.touches[0].clientX,
                        clientY: e.touches[0].clientY,
                        bubbles: true
                    });
                    target.dispatchEvent(fakeEvent);
                }, 500);
            });
            listDiv.addEventListener('touchend', () => { if (touchTimer) clearTimeout(touchTimer); });
            listDiv.addEventListener('touchmove', () => { if (touchTimer) clearTimeout(touchTimer); });
        }

        async function submitReply(parentId, content) {
            try {
                const res = await fetch('/api/comments', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Auth-UserId': currentUserId,
                        'X-Auth-Role': currentUserRole
                    },
                    body: JSON.stringify({
                        comicId,
                        content,
                        parentId
                    })
                });
                const data = await res.json();
                if (data.success) {
                    await loadComments(comicId);
                } else {
                    alert('回复失败: ' + (data.error || '未知错误'));
                }
            } catch (err) {
                alert('网络错误: ' + err.message);
            }
        }

        async function deleteComment(commentId) {
            try {
                const res = await fetch(`/api/comments?id=${commentId}`, {
                    method: 'DELETE',
                    headers: {
                        'X-Auth-UserId': localStorage.getItem('currentUserId'),
                        'X-Auth-Role': localStorage.getItem('userRole')
                    }
                });
                const data = await res.json();
                if (data.success) {
                    await loadComments(comicId);
                } else {
                    alert('删除失败: ' + data.error);
                }
            } catch (err) {
                alert('网络错误: ' + err.message);
            }
        }

        function escapeHtml(str) {
            if (str == null) return '';
            return String(str).replace(/[&<>]/g, m => m === '&' ? '&amp;' : (m === '<' ? '&lt;' : '&gt;'));
        }

        // 用于 HTML 属性上下文的转义（额外转义引号）
        function escapeAttr(str) {
            return escapeHtml(str).replace(/"/g, '&quot;').replace(/'/g, '&#39;');
        }

        function fmtTime(value) {
            const d = new Date(value);
            return isNaN(d.getTime()) ? '未知时间' : d.toLocaleString();
        }

        // ========== 评论输入框 ==========
        const container = document.getElementById('comment-form-container');
        if (isLoggedIn) {
            container.innerHTML = `
                <div class="comment-form">
                    <textarea id="commentContent" rows="3" placeholder="写下你的评论..."></textarea>
                    <button id="submitCommentBtn">发表评论</button>
                    <div id="commentError" class="comment-error"></div>
                </div>
            `;
            document.getElementById('submitCommentBtn').addEventListener('click', async () => {
                const content = document.getElementById('commentContent').value.trim();
                const errorDiv = document.getElementById('commentError');
                if (!content) {
                    errorDiv.innerText = '评论内容不能为空';
                    return;
                }
                errorDiv.innerText = '';
                try {
                    const res = await fetch('/api/comments', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'X-Auth-UserId': currentUserId,
                            'X-Auth-Role': currentUserRole
                        },
                        body: JSON.stringify({ comicId, content })
                    });
                    const data = await res.json();
                    if (data.success) {
                        document.getElementById('commentContent').value = '';
                        await loadComments(comicId);
                    } else {
                        errorDiv.innerText = data.error || '发表失败';
                    }
                } catch (err) {
                    errorDiv.innerText = '网络错误，请稍后重试';
                }
            });
        } else {
            container.innerHTML = `<div class="login-prompt"><p>请先 <a href="login.html">登录</a> 后发表评论。</p></div>`;
        }

        bindCommentEvents();
    </script>
