<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>漫画详情</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .comic-detail {
            text-align: center;
        }
        .comic-detail img {
            max-width: 200px;
            border-radius: 8px;
            background: #ddd;
        }
        .comic-detail button {
            font-size: 1.2rem;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <button onclick="location.href='index.html'" style="margin-bottom:20px;">⬅ 返回列表</button>
        <div id="comic-detail" class="comic-detail"></div>
    </div>

    <script>
        // ---------- 分片下载函数（用于封面）----------
        const CHUNK_COUNT = 4;

        async function fetchWithChunks(url) {
            const headRes = await fetch(url, { method: 'HEAD', mode: 'cors' });
            if (!headRes.ok) throw new Error(`HTTP ${headRes.status}`);

            const contentLength = headRes.headers.get('content-length');
            const acceptRanges = headRes.headers.get('accept-ranges');
            if (!contentLength || acceptRanges !== 'bytes') {
                const res = await fetch(url, { mode: 'cors' });
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                return await res.blob();
            }

            const total = parseInt(contentLength, 10);
            const chunkSize = Math.ceil(total / CHUNK_COUNT);
            const promises = [];
            for (let i = 0; i < CHUNK_COUNT; i++) {
                const start = i * chunkSize;
                const end = (i === CHUNK_COUNT - 1) ? total - 1 : Math.min(start + chunkSize - 1, total - 1);
                if (start > end) continue;
                promises.push(
                    fetch(url, {
                        mode: 'cors',
                        headers: { 'Range': `bytes=${start}-${end}` }
                    }).then(res => res.arrayBuffer())
                );
            }
            const buffers = await Promise.all(promises);
            const totalLength = buffers.reduce((acc, buf) => acc + buf.byteLength, 0);
            const merged = new Uint8Array(totalLength);
            let offset = 0;
            for (const buf of buffers) {
                merged.set(new Uint8Array(buf), offset);
                offset += buf.byteLength;
            }
            return new Blob([merged]);
        }

        async function loadCoverImage(imgElement, url) {
            try {
                const blob = await fetchWithChunks(url);
                const objectUrl = URL.createObjectURL(blob);
                imgElement.src = objectUrl;
            } catch (err) {
                console.error('封面加载失败', url, err);
                imgElement.src = '';
            }
        }

        // ---------- 登录检查 ----------
        if (!localStorage.getItem('loggedIn')) {
            window.location.replace('login.html?needlogin=1');
        }

        const urlParams = new URLSearchParams(window.location.search);
        const comicId = urlParams.get('id');
        if (!comicId) {
            document.getElementById('comic-detail').innerHTML = '<p>参数错误</p>';
        } else {
            loadComicDetail(comicId);
        }

        async function loadComicDetail(id) {
            try {
                const res = await fetch(`/api/comics/${id}`);
                const data = await res.json();
                if (data.success) {
                    renderComic(data.data);
                } else {
                    document.getElementById('comic-detail').innerHTML = '<p>漫画不存在</p>';
                }
            } catch (err) {
                document.getElementById('comic-detail').innerHTML = '<p>加载失败，请稍后重试</p>';
            }
        }

        function renderComic(comic) {
            const tags = comic.tags && Array.isArray(comic.tags) ? comic.tags.join(' · ') : '';
            const html = `
                <img id="cover-img" data-src="${comic.cover_url}" alt="${comic.title}">
                <h1>${comic.title}</h1>
                <p>作者：${comic.author}</p>
                <p>上传者：${comic.uploader}</p>
                <p>${comic.chapters} 话 · ${comic.pages} 页</p>
                <p>标签：${tags || '无'}</p>
                <p>上传时间：${new Date(comic.uploaded_at).toLocaleDateString()}</p>
                <p>${comic.description || ''}</p>
                <button onclick="startReading('${comic.zip_url}')">📖 开始阅读</button>
            `;
            document.getElementById('comic-detail').innerHTML = html;

            // 加载封面
            const coverImg = document.getElementById('cover-img');
            if (coverImg) {
                loadCoverImage(coverImg, comic.cover_url);
            }
        }

        // 【关键修改】跳转阅读器时同时传递 id 和 zip 参数
        function startReading(zipUrl) {
            const currentId = new URLSearchParams(window.location.search).get('id');
            window.location.href = `reader.html?zip=${encodeURIComponent(zipUrl)}&id=${currentId}`;
        }
    </script>
</body>
</html>
