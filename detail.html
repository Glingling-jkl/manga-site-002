<script>
    // 登录检查（保持原有）
    if (!localStorage.getItem('loggedIn')) {
        window.location.replace('index.html?needlogin=1');
    }

    const urlParams = new URLSearchParams(window.location.search);
    const comicId = urlParams.get('id');

    async function loadComicDetail() {
        try {
            const resp = await fetch(`/api/comics/${comicId}`);
            const data = await resp.json();
            if (data.success) {
                renderComic(data.data);
            } else {
                document.getElementById('comic-detail').innerHTML = '<p>漫画不存在</p>';
            }
        } catch (err) {
            document.getElementById('comic-detail').innerHTML = '<p>加载失败</p>';
        }
    }

    function renderComic(comic) {
        document.getElementById('comic-detail').innerHTML = `
            <img src="${comic.cover_url}" style="max-width:200px;">
            <h1>${comic.title}</h1>
            <p>作者：${comic.author} · 上传者：${comic.uploader}</p>
            <p>${comic.chapters}话 · ${comic.pages}页</p>
            <p>标签：${comic.tags.join(' · ')}</p>
            <p>上传时间：${new Date(comic.uploaded_at).toLocaleDateString()}</p>
            <p>${comic.description || ''}</p>
            <button onclick="location.href='reader.html?zip=${encodeURIComponent(comic.zip_url)}'">📖 开始阅读</button>
        `;
    }

    if (comicId) {
        loadComicDetail();
    } else {
        document.getElementById('comic-detail').innerHTML = '<p>参数错误</p>';
    }
</script>
