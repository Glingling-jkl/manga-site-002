<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>漫画详情</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .comic-detail {
            text-align: center;
        }
        .comic-detail img {
            max-width: 200px;
            border-radius: 8px;
            background: #ddd;
        }
        .comic-detail button {
            font-size: 1.2rem;
            margin-top: 20px;
        }
        .comments-section {
            margin-top: 40px;
            text-align: left;
        }
        .comments-section h3 {
            border-bottom: 1px solid #eee;
            padding-bottom: 10px;
        }
        .comment-item {
            padding: 10px 0;
            border-bottom: 1px solid #f0f0f0;
        }
        .comment-user {
            font-weight: bold;
            color: #0070f3;
        }
        .comment-time {
            font-size: 0.8rem;
            color: #999;
            margin-left: 10px;
        }
        .comment-content {
            margin-top: 5px;
        }
        .comment-form {
            margin-top: 20px;
        }
        .comment-form textarea {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #ddd;
            resize: vertical;
        }
        .comment-form button {
            margin-top: 10px;
            background: #0070f3;
            color: white;
            border: none;
            padding: 8px 20px;
            border-radius: 20px;
            cursor: pointer;
        }
        .comment-form button:hover {
            background: #0051b3;
        }
        .comment-error {
            color: red;
            margin-top: 5px;
        }
        .login-prompt {
            margin-top: 20px;
            background: #f9f9f9;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
</head>
<body>
    <div class="container">
        <button onclick="location.href='index.html'" style="margin-bottom:20px;">⬅ 返回列表</button>
        <div id="comic-detail" class="comic-detail"></div>

        <div id="comments-section" class="comments-section">
            <h3>💬 评论区</h3>
            <div id="comment-list"></div>
            <div id="comment-form-container"></div>
        </div>
    </div>

    <script>
        // ---------- 分片下载函数（用于封面）----------
        const CHUNK_COUNT = 4;

        async function fetchWithChunks(url) {
            const headRes = await fetch(url, { method: 'HEAD', mode: 'cors' });
            if (!headRes.ok) throw new Error(`HTTP ${headRes.status}`);

            const contentLength = headRes.headers.get('content-length');
            const acceptRanges = headRes.headers.get('accept-ranges');
            if (!contentLength || acceptRanges !== 'bytes') {
                const res = await fetch(url, { mode: 'cors' });
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                return await res.blob();
            }

            const total = parseInt(contentLength, 10);
            const chunkSize = Math.ceil(total / CHUNK_COUNT);
            const promises = [];
            for (let i = 0; i < CHUNK_COUNT; i++) {
                const start = i * chunkSize;
                const end = (i === CHUNK_COUNT - 1) ? total - 1 : Math.min(start + chunkSize - 1, total - 1);
                if (start > end) continue;
                promises.push(
                    fetch(url, {
                        mode: 'cors',
                        headers: { 'Range': `bytes=${start}-${end}` }
                    }).then(res => res.arrayBuffer())
                );
            }
            const buffers = await Promise.all(promises);
            const totalLength = buffers.reduce((acc, buf) => acc + buf.byteLength, 0);
            const merged = new Uint8Array(totalLength);
            let offset = 0;
            for (const buf of buffers) {
                merged.set(new Uint8Array(buf), offset);
                offset += buf.byteLength;
            }
            return new Blob([merged]);
        }

        async function loadCoverImage(imgElement, url) {
            try {
                const blob = await fetchWithChunks(url);
                const objectUrl = URL.createObjectURL(blob);
                imgElement.src = objectUrl;
            } catch (err) {
                console.error('封面加载失败', url, err);
                imgElement.src = '';
            }
        }

        // ---------- 登录检查 ----------
        const isLoggedIn = localStorage.getItem('loggedIn') === 'true';
        const currentUser = localStorage.getItem('currentUser') || '';
        const currentUserId = localStorage.getItem('currentUserId') || '';
        const currentUserRole = localStorage.getItem('userRole') || '';

        if (!isLoggedIn) {
            window.location.replace('login.html?needlogin=1');
        }

        const urlParams = new URLSearchParams(window.location.search);
        const comicId = urlParams.get('id');
        if (!comicId) {
            document.getElementById('comic-detail').innerHTML = '<p>参数错误</p>';
        } else {
            loadComicDetail(comicId);
            loadComments(comicId);
        }

        // 加载漫画详情
        async function loadComicDetail(id) {
            try {
                const res = await fetch(`/api/comics/${id}`);
                const data = await res.json();
                if (data.success) {
                    renderComic(data.data);
                } else {
                    document.getElementById('comic-detail').innerHTML = '<p>漫画不存在</p>';
                }
            } catch (err) {
                document.getElementById('comic-detail').innerHTML = '<p>加载失败，请稍后重试</p>';
            }
        }

        function renderComic(comic) {
            const tags = comic.tags && Array.isArray(comic.tags) ? comic.tags.join(' · ') : '';
            const html = `
                <img id="cover-img" data-src="${comic.cover_url}" alt="${comic.title}">
                <h1>${comic.title}</h1>
                <p>作者：${comic.author}</p>
                <p>上传者：${comic.uploader}</p>
                <p>${comic.chapters} 话 · ${comic.pages} 页</p>
                <p>标签：${tags || '无'}</p>
                <p>上传时间：${new Date(comic.uploaded_at).toLocaleDateString()}</p>
                <p>${comic.description || ''}</p>
                <button onclick="startReading('${comic.zip_url}')">📖 开始阅读</button>
            `;
            document.getElementById('comic-detail').innerHTML = html;

            const coverImg = document.getElementById('cover-img');
            if (coverImg) {
                loadCoverImage(coverImg, comic.cover_url);
            }
        }

        function startReading(zipUrl) {
            window.location.href = `reader.html?zip=${encodeURIComponent(zipUrl)}&id=${comicId}`;
        }

        // ---------- 评论功能 ----------
        async function loadComments(comicId) {
            const listDiv = document.getElementById('comment-list');
            listDiv.innerHTML = '加载评论中...';
            try {
                const res = await fetch(`/api/comments?comicId=${comicId}`);
                const data = await res.json();
                if (data.success) {
                    renderComments(data.data);
                } else {
                    listDiv.innerHTML = `<p class="comment-error">加载失败: ${data.error}</p>`;
                }
            } catch (err) {
                listDiv.innerHTML = `<p class="comment-error">网络错误: ${err.message}</p>`;
            }
        }

        function renderComments(comments) {
            const listDiv = document.getElementById('comment-list');
            if (comments.length === 0) {
                listDiv.innerHTML = '<p>暂无评论，来说两句吧～</p>';
                return;
            }
            let html = '';
            for (let c of comments) {
                html += `
                    <div class="comment-item">
                        <span class="comment-user">${escapeHtml(c.username)}</span>
                        <span class="comment-time">${new Date(c.created_at).toLocaleString()}</span>
                        <div class="comment-content">${escapeHtml(c.content)}</div>
                    </div>
                `;
            }
            listDiv.innerHTML = html;
        }

        function escapeHtml(str) {
            return str.replace(/[&<>]/g, function(m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            });
        }

        // 发表评论表单
        const container = document.getElementById('comment-form-container');
        if (isLoggedIn) {
            container.innerHTML = `
                <div class="comment-form">
                    <textarea id="commentContent" rows="3" placeholder="写下你的评论..."></textarea>
                    <button id="submitCommentBtn">发表评论</button>
                    <div id="commentError" class="comment-error"></div>
                </div>
            `;
            document.getElementById('submitCommentBtn').addEventListener('click', async () => {
                const content = document.getElementById('commentContent').value.trim();
                const errorDiv = document.getElementById('commentError');
                if (!content) {
                    errorDiv.innerText = '评论内容不能为空';
                    return;
                }
                errorDiv.innerText = '';
                try {
                    const res = await fetch('/api/comments', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'X-Auth-UserId': currentUserId,   // 使用用户ID
                            'X-Auth-Role': currentUserRole
                        },
                        body: JSON.stringify({ comicId, content })
                    });
                    const data = await res.json();
                    if (data.success) {
                        document.getElementById('commentContent').value = '';
                        loadComments(comicId);
                    } else {
                        errorDiv.innerText = data.error || '发表失败';
                    }
                } catch (err) {
                    errorDiv.innerText = '网络错误，请稍后重试';
                }
            });
        } else {
            container.innerHTML = `
                <div class="login-prompt">
                    <p>请先 <a href="login.html">登录</a> 后发表评论。</p>
                </div>
            `;
        }
    </script>
</body>
</html>
