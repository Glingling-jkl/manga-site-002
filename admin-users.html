<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>用户管理</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .user-form {
            max-width: 400px;
            margin: 0 auto;
        }
        .user-form input, .user-form select, .user-form button {
            margin: 10px 0;
        }
        .role-selector {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .note {
            color: #666;
            font-size: 0.9rem;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>👥 创建新用户</h2>
        <form id="createUserForm" class="user-form">
            <input type="text" id="username" placeholder="用户名 (至少3位)" required>
            <input type="password" id="password" placeholder="密码 (至少6位)" required>
            <input type="password" id="secondFactor" placeholder="第二层验证码 (8位，可选)" maxlength="8">
            <div class="role-selector">
                <label>角色：</label>
                <select id="role">
                    <option value="user">普通用户 (user)</option>
                    <!-- admin 和 system 选项需要根据当前用户权限动态显示 -->
                    <option value="admin" id="adminOption" style="display:none;">管理员 (admin)</option>
                    <option value="system" id="systemOption" style="display:none;">系统所有者 (system)</option>
                </select>
            </div>
            <button type="submit">创建用户</button>
        </form>
        <div id="result" style="margin-top: 20px;"></div>
    </div>

    <script>
        // 权限检查
        if (!localStorage.getItem('loggedIn')) {
            window.location.replace('login.html?needlogin=1');
        }
        const currentUserRole = localStorage.getItem('userRole') || '';
        const currentUser = localStorage.getItem('currentUser') || '';
        if (currentUserRole !== 'system' && currentUserRole !== 'admin') {
            window.location.replace('index.html');
        }

        // 根据当前角色显示可选的用户角色
        if (currentUserRole === 'system') {
            document.getElementById('adminOption').style.display = 'block';
            document.getElementById('systemOption').style.display = 'block';
        } else if (currentUserRole === 'admin') {
            // admin 只能创建 user，所以隐藏角色选择，强制为 user
            document.getElementById('role').style.display = 'none';
            document.querySelector('.role-selector label').style.display = 'none';
        }

        document.getElementById('createUserForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const secondFactor = document.getElementById('secondFactor').value.trim() || undefined;
            let role = document.getElementById('role').value;
            // 如果是 admin 且角色选择被隐藏，强制为 user
            if (currentUserRole === 'admin') {
                role = 'user';
            }

            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = '创建中...';

            try {
                const res = await fetch('/api/create-user', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Auth-Username': currentUser,
                        'X-Auth-Role': currentUserRole
                    },
                    body: JSON.stringify({ username, password, secondFactor, role })
                });
                const data = await res.json();
                if (res.ok && data.success) {
                    resultDiv.innerHTML = '<p style="color:green;">✅ 用户创建成功</p>';
                    document.getElementById('createUserForm').reset();
                } else {
                    resultDiv.innerHTML = `<p style="color:red;">❌ 创建失败: ${data.error}</p>`;
                }
            } catch (err) {
                resultDiv.innerHTML = `<p style="color:red;">网络错误: ${err.message}</p>`;
            }
        });
    </script>
</body>
</html>
