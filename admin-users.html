<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>用户管理</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .user-form {
            max-width: 400px;
            margin: 0 auto;
        }
        .user-form input, .user-form select, .user-form button {
            margin: 10px 0;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            font-size: 0.85rem;
            min-width: 500px; /* 增加最小宽度，防止过窄 */
        }
        th, td {
            padding: 8px 6px;
            text-align: left;
            border-bottom: 1px solid #ddd;
            word-break: break-word;
        }
        .action-buttons {
            display: flex;
            flex-direction: column;
            gap: 2px; /* 减小上下间隔 */
        }
        .action-btn {
            padding: 4px 8px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.8rem;
            white-space: nowrap;
        }
        .delete-btn {
            background: #f44336;
            color: white;
        }
        .promote-btn {
            background: #4caf50;
            color: white;
        }
        .adult-btn {
            background: #ff9800;
            color: white;
        }
        /* 角色标签样式（正方形小矩形） */
        .role-badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 4px; /* 小矩形，非圆形 */
            font-size: 0.8rem;
            font-weight: 500;
            text-align: center;
        }
        .role-badge.user {
            background: #6c757d;
            color: white;
        }
        .role-badge.admin {
            background: #ffc107;
            color: white; /* 白色文字 */
        }
        .role-badge.system {
            background: #dc3545;
            color: white;
        }
        /* 读取权限样式 */
        .read-permit-normal {
            color: #ffc107;
            font-weight: 500;
        }
        .read-permit-special {
            color: #f44336;
            font-weight: 500;
        }
        /* 表格容器横向滚动 */
        .table-wrapper {
            overflow-x: auto;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>👥 用户管理</h2>

        <form id="createUserForm" class="user-form">
            <input type="text" id="username" placeholder="用户名 (至少3位)" required>
            <input type="password" id="password" placeholder="密码 (至少6位)" required>
            <input type="password" id="secondFactor" placeholder="第二层验证码 (8位，可选)" maxlength="8">
            <div id="roleSelector">
                <label>角色：</label>
                <select id="role">
                    <option value="user">普通用户 (user)</option>
                    <option value="admin" id="adminOption">管理员 (admin)</option>
                    <option value="system" id="systemOption">系统所有者 (system)</option>
                </select>
            </div>
            <button type="submit">创建用户</button>
        </form>
        <div id="registerResult" style="margin-top: 20px;"></div>

        <h3>用户列表</h3>
        <div class="table-wrapper">
            <table id="userTable">
                <thead>
                    <tr>
                        <th>用户</th>
                        <th>用户组</th>
                        <th>读取权限</th>
                        <th>注册时间</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody id="userListBody">
                    <tr><td colspan="5">加载中...</td></tr>
                </tbody>
            </table>
        </div>
        <div id="manageResult" style="margin-top: 20px;"></div>
    </div>

    <script>
        if (!localStorage.getItem('loggedIn')) {
            window.location.replace('login.html?needlogin=1');
        }
        const currentUserRole = localStorage.getItem('userRole') || '';
        const currentUser = localStorage.getItem('currentUser') || '';
        if (currentUserRole !== 'system' && currentUserRole !== 'admin') {
            window.location.replace('index.html');
        }

        if (currentUserRole === 'system') {
            document.getElementById('adminOption').style.display = 'block';
            document.getElementById('systemOption').style.display = 'block';
        } else if (currentUserRole === 'admin') {
            document.getElementById('roleSelector').style.display = 'none';
        }

        document.getElementById('createUserForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const secondFactor = document.getElementById('secondFactor').value.trim() || undefined;
            let role = document.getElementById('role').value;
            if (currentUserRole === 'admin') role = 'user';

            const resultDiv = document.getElementById('registerResult');
            resultDiv.innerHTML = '创建中...';
            try {
                const res = await fetch('/api/create-user', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Auth-Role': currentUserRole
                    },
                    body: JSON.stringify({ username, password, secondFactor, role })
                });
                const data = await res.json();
                if (data.success) {
                    resultDiv.innerHTML = '<p style="color:green;">✅ 用户创建成功</p>';
                    document.getElementById('createUserForm').reset();
                    loadUsers();
                } else {
                    resultDiv.innerHTML = `<p style="color:red;">❌ 创建失败: ${escapeHtml(data.error || '未知错误')}</p>`;
                }
            } catch (err) {
                resultDiv.innerHTML = `<p style="color:red;">网络错误: ${escapeHtml(err.message)}</p>`;
            }
        });

        async function loadUsers() {
            const tbody = document.getElementById('userListBody');
            tbody.innerHTML = ' <td colspan="5">加载中...</td>';
            try {
                const res = await fetch('/api/get-users', {
                    headers: { 'X-Auth-Role': currentUserRole }
                });
                if (!res.ok) {
                    const text = await res.text();
                    tbody.innerHTML = `<tr><td colspan="5">HTTP错误 ${res.status}: ${text}</td></tr>`;
                    return;
                }
                const data = await res.json();
                if (data.success) {
                    renderUsers(data.data);
                } else {
                    tbody.innerHTML = `<tr><td colspan="5">加载失败: ${data.error}</td></tr>`;
                }
            } catch (err) {
                tbody.innerHTML = `<tr><td colspan="5">网络错误: ${escapeHtml(err.message)}</td></tr>`;
            }
        }

        function renderUsers(users) {
            const tbody = document.getElementById('userListBody');
            if (users.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5">暂无用户</td></tr>';
                return;
            }
            let html = '';
            for (let u of users) {
                let deleteBtn = '', promoteBtn = '', adultToggle = '';
                const canDelete = (currentUserRole === 'system' && u.role !== 'system') ||
                                 (currentUserRole === 'admin' && u.role === 'user');
                const canPromote = (currentUserRole === 'system' && u.role === 'user');

                if (canDelete) deleteBtn = `<button class="action-btn delete-btn" onclick="deleteUser(${u.id})">删除</button>`;
                if (canPromote) promoteBtn = `<button class="action-btn promote-btn" onclick="promoteUser(${u.id})">提权</button>`;
                if (currentUserRole === 'system') {
                    adultToggle = `<button class="action-btn adult-btn" onclick="toggleAdultEnabled(${u.id}, '${u.adult_enabled}')">切换读取权限</button>`;
                }

                // 角色标签
                let roleClass = '';
                let roleText = '';
                switch (u.role) {
                    case 'system':
                        roleClass = 'system';
                        roleText = 'system';
                        break;
                    case 'admin':
                        roleClass = 'admin';
                        roleText = 'admin';
                        break;
                    default:
                        roleClass = 'user';
                        roleText = 'user';
                }
                const roleBadge = `<span class="role-badge ${roleClass}">${roleText}</span>`;

                // 读取权限显示
                let readPermission = '';
                if (u.adult_enabled === 'yes') {
                    readPermission = '<span class="read-permit-special">特殊</span>';
                } else {
                    readPermission = '<span class="read-permit-normal">正常</span>';
                }

                html += `
                    <tr>
                        <td>${escapeHtml(u.username)}</td>
                        <td>${roleBadge}</td>
                        <td>${readPermission}</td>
                        <td>${new Date(u.created_at).toLocaleString()}</td>
                        <td class="action-buttons">${deleteBtn} ${promoteBtn} ${adultToggle}</td>
                    </tr>
                `;
            }
            tbody.innerHTML = html;
        }

        function escapeHtml(str) {
            if (str == null) return '';
            return String(str).replace(/[&<>]/g, function(m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            });
        }

        window.deleteUser = async function(userId) {
            if (!confirm('确定要删除该用户吗？此操作不可撤销！')) return;
            const resultDiv = document.getElementById('manageResult');
            resultDiv.innerHTML = '删除中...';
            try {
                const res = await fetch(`/api/delete-user?id=${userId}`, {
                    method: 'DELETE',
                    headers: { 'X-Auth-Role': currentUserRole }
                });
                const data = await res.json();
                if (data.success) {
                    resultDiv.innerHTML = '<p style="color:green;">✅ 用户已删除</p>';
                    loadUsers();
                } else {
                    resultDiv.innerHTML = `<p style="color:red;">❌ 删除失败: ${escapeHtml(data.error || '未知错误')}</p>`;
                }
            } catch (err) {
                resultDiv.innerHTML = `<p style="color:red;">网络错误: ${escapeHtml(err.message)}</p>`;
            }
        };

        window.promoteUser = async function(userId) {
            if (!confirm('确定要将该用户提升为管理员吗？')) return;
            const resultDiv = document.getElementById('manageResult');
            resultDiv.innerHTML = '处理中...';
            try {
                const res = await fetch('/api/update-user-role', {
                    method: 'PATCH',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Auth-Role': currentUserRole
                    },
                    body: JSON.stringify({ userId, newRole: 'admin' })
                });
                const data = await res.json();
                if (data.success) {
                    resultDiv.innerHTML = '<p style="color:green;">✅ 已提升为管理员</p>';
                    loadUsers();
                } else {
                    resultDiv.innerHTML = `<p style="color:red;">❌ 提权失败: ${escapeHtml(data.error || '未知错误')}</p>`;
                }
            } catch (err) {
                resultDiv.innerHTML = `<p style="color:red;">网络错误: ${escapeHtml(err.message)}</p>`;
            }
        };

        window.toggleAdultEnabled = async function(userId, currentValue) {
            const newValue = currentValue === 'yes' ? 'no' : 'yes';
            if (!confirm(`确定要将该用户的读取权限改为“${newValue === 'yes' ? '特殊' : '正常'}”吗？`)) return;
            const resultDiv = document.getElementById('manageResult');
            resultDiv.innerHTML = '处理中...';
            try {
                const res = await fetch('/api/update-user-adult-enabled', {
                    method: 'PATCH',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Auth-UserId': localStorage.getItem('currentUserId'),
                        'X-Auth-Role': currentUserRole
                    },
                    body: JSON.stringify({ userId, adultEnabled: newValue })
                });
                const data = await res.json();
                if (data.success) {
                    resultDiv.innerHTML = '<p style="color:green;">✅ 权限已更新</p>';
                    loadUsers();
                } else {
                    resultDiv.innerHTML = `<p style="color:red;">❌ 操作失败: ${escapeHtml(data.error || '未知错误')}</p>`;
                }
            } catch (err) {
                resultDiv.innerHTML = `<p style="color:red;">网络错误: ${escapeHtml(err.message)}</p>`;
            }
        };

        loadUsers();
    </script>
</body>
</html>
