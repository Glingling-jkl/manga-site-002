<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>漫画站 · 主页</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* 添加图片尺寸限制 */
        .comic-card img {
            max-width: 100%;
            height: auto;
            object-fit: cover; /* 保持比例填充，防止变形 */
        }
    </style>
</head>
<body>
    <!-- 启动画面元素（如果之前有，保留） -->
    <div id="splash" class="splash-screen">
        <div class="splash-content">
            <div class="spinner-outer" id="spinnerOuter"></div>
            <div class="spinner-inner" id="spinnerInner"></div>
            <div class="center-icon" id="centerIcon">✿</div>
        </div>
    </div>

    <!-- 主页内容 -->
    <div id="main-content" style="display: none;">
        <div class="container">
            <div class="import-button" onclick="location.href='reader.html'">
                <span>导入</span>
            </div>
            <div class="import-hint">在本地观看漫画</div>

            <div id="user-area" style="margin-top: 30px; text-align: center;"></div>
            <div id="comic-list-area" style="display: none; margin-top: 30px;">
                <h2>📚 在线漫画</h2>
                <input type="text" id="search" placeholder="搜索漫画..." onkeyup="filterComics()">
                <div id="comic-list" class="comic-grid"></div>
            </div>
            <div class="copyright">✿本网站由G_灵零7所有</div>
        </div>
    </div>

    <script>
        // 启动动画（如果你之前有，保留）
        (function() {
            if (sessionStorage.getItem('splashPlayed')) {
                document.getElementById('splash').classList.add('hidden');
                document.getElementById('main-content').style.display = 'block';
                initPage();
                return;
            }
            window.addEventListener('pageshow', function(event) {
                if (event.persisted) {
                    document.getElementById('splash').classList.add('hidden');
                    document.getElementById('main-content').style.display = 'block';
                    initPage();
                }
            });
            requestAnimationFrame(function() {
                const splash = document.getElementById('splash');
                const spinnerInner = document.getElementById('spinnerInner');
                const spinnerOuter = document.getElementById('spinnerOuter');
                const centerIcon = document.getElementById('centerIcon');
                const mainContent = document.getElementById('main-content');

                setTimeout(() => centerIcon.classList.add('visible'), 1500);
                setTimeout(() => {
                    spinnerInner.style.opacity = '0';
                    spinnerOuter.style.opacity = '0';
                }, 2500);
                setTimeout(() => centerIcon.classList.remove('visible'), 4000);
                setTimeout(() => {
                    splash.classList.add('hidden');
                    mainContent.style.display = 'block';
                    sessionStorage.setItem('splashPlayed', 'true');
                    initPage();
                }, 4750);
            });
        })();

        // 页面初始化
        function initPage() {
            const isLoggedIn = localStorage.getItem('loggedIn') === 'true';
            const currentUser = localStorage.getItem('currentUser') || '';
            const userArea = document.getElementById('user-area');
            if (isLoggedIn) {
                userArea.innerHTML = `
                    <p>欢迎，${currentUser}！</p>
                    <button onclick="logout()" style="width:auto; padding:8px 20px;">退出登录</button>
                `;
                document.getElementById('comic-list-area').style.display = 'block';
                loadComics();
            } else {
                userArea.innerHTML = `
                    <p>您还未登录，<a href="login.html" style="color:#0070f3;">点击登录/注册</a> 可查看在线漫画。</p>
                `;
            }
        }

        window.logout = function() {
            localStorage.removeItem('loggedIn');
            localStorage.removeItem('currentUser');
            window.location.reload();
        };

        async function loadComics() {
            try {
                const resp = await fetch('/api/comics');
                const data = await resp.json();
                if (data.success) {
                    renderComics(data.data);
                }
            } catch (err) {
                console.error('加载漫画失败', err);
            }
        }

        function renderComics(comics) {
            const listDiv = document.getElementById('comic-list');
            if (!listDiv) return;
            if (comics.length === 0) {
                listDiv.innerHTML = '<p>暂无漫画</p>';
                return;
            }
            let html = '';
            for (let c of comics) {
                html += `
                    <div class="comic-card" onclick="location.href='detail.html?id=${c.id}'">
                        <img src="${c.cover_url}" alt="${c.title}">
                        <h3>${c.title}</h3>
                        <p>${c.author} · ${c.chapters}话</p>
                        <div class="tags">${c.tags.map(t => `<span>${t}</span>`).join('')}</div>
                    </div>
                `;
            }
            listDiv.innerHTML = html;
        }

        window.filterComics = function() {
            const search = document.getElementById('search').value;
            const listDiv = document.getElementById('comic-list');
            const filtered = comics.filter(c => c.title.includes(search));
            renderComics(filtered);
        };
    </script>
</body>
</html>
