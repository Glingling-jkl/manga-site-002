<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>漫画站 · 主页</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* ================= 启动画面（粉蓝双圈 + 品牌文字） ================= */
        .splash-screen {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background:
                radial-gradient(640px 420px at 18% 12%, rgba(255, 182, 193, 0.28), transparent 62%),
                radial-gradient(640px 420px at 86% 82%, rgba(0, 112, 243, 0.16), transparent 62%),
                linear-gradient(160deg, #ffffff 0%, #fdf3f7 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.45s ease;
        }
        .splash-screen.hidden { display: none; }

        .splash-content {
            position: relative;
            width: 240px;
            height: 270px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .spinner-inner {
            position: absolute;
            width: 176px;
            height: 176px;
            border: 5px solid rgba(255, 182, 193, 0.22);
            border-top-color: #ff8fab;
            border-radius: 50%;
            animation: spin 1.4s infinite linear;
            transition: opacity 0.5s ease;
        }
        .spinner-outer {
            position: absolute;
            width: 208px;
            height: 208px;
            border: 5px solid rgba(0, 112, 243, 0.14);
            border-top-color: #4da3ff;
            border-radius: 50%;
            animation: spin 2.2s infinite linear reverse;
            opacity: 0.55;
            transition: opacity 0.5s ease;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .center-icon {
            position: absolute;
            font-size: 92px;
            color: #ff8fab;
            opacity: 0;
            transform: translateY(-6px) scale(0.9);
            transition: opacity 0.8s ease, transform 0.8s ease;
            pointer-events: none;
            z-index: 10;
        }
        .center-icon.visible {
            opacity: 1;
            transform: translateY(-6px) scale(1);
            animation: iconPulse 1.7s ease-in-out infinite;
        }
        @keyframes iconPulse {
            0%, 100% { transform: translateY(-6px) scale(1); }
            50%      { transform: translateY(-9px) scale(1.09); }
        }
        .splash-brand {
            position: absolute;
            bottom: 4px; left: 0; right: 0;
            text-align: center;
            opacity: 0;
            transform: translateY(12px);
            transition: opacity 0.7s ease, transform 0.7s ease;
        }
        .splash-brand.visible { opacity: 1; transform: none; }
        .brand-name {
            font-size: 2rem;
            font-weight: 800;
            letter-spacing: 0.06em;
            background: linear-gradient(120deg, #0070f3 0%, #7c5cff 55%, #ff8fab 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .brand-tag {
            margin-top: 6px;
            font-size: 0.85rem;
            color: #6b7280;
            letter-spacing: 0.3em;
        }

        /* ================= 主内容容器 ================= */
        #main-content {
            display: none;
            opacity: 0;
            transition: opacity 0.4s ease;
            width: 100%;
            max-width: 960px;
            flex-direction: column;
            align-items: center;
        }

        #main-content.zoom-enter .site-header,
        #main-content.zoom-enter .container {
            animation: pageZoomIn 0.6s var(--ease-out) both;
        }

        /* ================= 顶部导航 ================= */
        .site-header {
            width: 100%;
            margin-bottom: 18px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 14px 22px;
            background: rgba(255, 255, 255, 0.72);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid rgba(255, 255, 255, 0.85);
            border-radius: 22px;
            box-shadow: var(--shadow-sm);
            animation: fadeUp 0.6s var(--ease-out) both;
        }
        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.25rem;
            font-weight: 800;
            cursor: pointer;
            user-select: none;
        }
        .brand-logo {
            width: 38px; height: 38px;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.15rem;
            border-radius: 12px;
            background: var(--grad-pink);
            color: #fff;
            box-shadow: 0 6px 16px rgba(255, 143, 171, 0.45);
        }
        .brand-name-text { background: linear-gradient(120deg, #0070f3, #7c5cff 60%, #ff8fab); -webkit-background-clip: text; background-clip: text; color: transparent; }
        .nav-links { display: flex; align-items: center; gap: 10px; }
        .nav-link {
            text-decoration: none;
            color: var(--ink-soft);
            font-size: 0.9rem;
            font-weight: 600;
            padding: 8px 16px;
            border-radius: var(--radius-pill);
            transition: background 0.2s ease, color 0.2s ease, transform 0.2s ease;
        }
        .nav-link:hover { background: rgba(0, 112, 243, 0.08); color: var(--primary); transform: translateY(-1px); }
        .nav-user {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 0.9rem;
            font-weight: 700;
            color: var(--primary);
            background: rgba(0, 112, 243, 0.1);
            padding: 8px 16px;
            border-radius: var(--radius-pill);
        }
        /* 导航栏里的新站入口按钮（位于“文档中心”左侧） */
        .site-ad-nav {
            background: linear-gradient(135deg, #ff8fab, #4da3ff);
            color: #fff;
            border: none;
            font-size: 0.85rem;
            font-weight: 700;
            padding: 8px 14px;
            margin: 0;
            width: auto;
            border-radius: var(--radius-pill);
            box-shadow: 0 4px 12px rgba(255, 143, 171, 0.35);
            transition: transform 0.2s var(--ease-spring), filter 0.2s ease, box-shadow 0.25s ease;
        }
        .site-ad-nav:hover {
            background: linear-gradient(135deg, #ff8fab, #4da3ff);
            filter: brightness(1.08);
            transform: translateY(-1px);
            box-shadow: 0 6px 16px rgba(255, 143, 171, 0.5);
        }

        /* ================= 快捷操作区 ================= */
        .hero-actions {
            display: flex;
            gap: 14px;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 18px;
            animation: fadeUp 0.6s 0.05s var(--ease-out) both;
        }

        /* ================= 用户区 ================= */
        #user-area {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 26px;
            padding: 14px 18px;
            background: rgba(0, 112, 243, 0.05);
            border: 1px dashed rgba(0, 112, 243, 0.28);
            border-radius: 18px;
            animation: fadeUp 0.5s 0.12s var(--ease-out) both;
        }
        #user-area p { margin: 0; font-size: 0.95rem; color: var(--ink-soft); }
        #user-area a { color: var(--primary); text-decoration: none; font-weight: 600; }
        #user-area a:hover { text-decoration: underline; }
        .welcome-chip { font-size: 0.95rem; color: var(--ink); }
        .welcome-chip b { color: var(--primary); }
        .small-btn { width: auto; padding: 9px 18px; margin: 0; font-size: 0.85rem; }

        /* ================= 在线漫画区 ================= */
        #comic-list-area { margin-top: 30px; animation: fadeUp 0.6s 0.18s var(--ease-out) both; }
        .section-head {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 4px;
        }
        .section-head h2 { font-size: 1.35rem; font-weight: 800; }
        .section-head .count-chip {
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--primary);
            background: rgba(0, 112, 243, 0.1);
            padding: 3px 12px;
            border-radius: var(--radius-pill);
        }

        .search-wrap { position: relative; margin-top: 16px; }
        .search-icon {
            position: absolute;
            left: 20px; top: 50%;
            transform: translateY(-52%);
            opacity: 0.55;
            pointer-events: none;
            font-size: 1rem;
        }
        .search-wrap input {
            padding-left: 48px;
            background: rgba(255, 255, 255, 0.85);
            border-radius: var(--radius-pill);
        }

        /* ================= 漫画网格（响应式） ================= */
        .comic-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(185px, 1fr));
            gap: 18px;
            margin-top: 20px;
        }
        .comic-card {
            background: #fff;
            border-radius: 18px;
            overflow: hidden;
            cursor: pointer;
            text-align: center;
            padding-bottom: 14px;
            border: 1px solid rgba(0, 0, 0, 0.05);
            box-shadow: var(--shadow-sm);
            animation: cardIn 0.5s var(--ease-out) backwards;
            transition: transform 0.25s var(--ease-spring), box-shadow 0.3s ease;
        }
        .comic-card:hover {
            transform: translateY(-6px);
            box-shadow: var(--shadow-lg);
        }
        .comic-card:active {
            transform: scale(0.97);
        }
        .comic-card .thumb {
            aspect-ratio: 2 / 3;
            overflow: hidden;
            background: #eef1f6;
        }
        .comic-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.55s ease;
        }
        .comic-card:hover img { transform: scale(1.08); }
        .comic-card h3 {
            font-size: 0.92rem;
            font-weight: 700;
            margin: 10px 8px 4px;
            padding: 0 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .comic-card p {
            font-size: 0.72rem;
            color: var(--ink-faint);
            margin: 0 0 6px;
        }
        @keyframes cardIn {
            from { opacity: 0; transform: translateY(18px) scale(0.97); }
            to   { opacity: 1; transform: none; }
        }
        .tags {
            margin-top: 2px;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 5px;
            padding: 0 8px;
        }
        .tags span {
            display: inline-block;
            background: var(--pink-light);
            color: #b84a6a;
            border-radius: var(--radius-pill);
            padding: 3px 9px;
            font-size: 0.66rem;
            font-weight: 600;
        }

        /* 骨架屏占位行 */
        .sk-line {
            height: 13px;
            margin: 9px auto 0;
            border-radius: 8px;
            background: #eef1f6;
            overflow: hidden;
            position: relative;
        }
        .sk-line::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.7), transparent);
            background-size: 400px 100%;
            animation: shimmer 1.4s infinite linear;
        }

        /* ================= 菜单按钮 / 弹出菜单 ================= */
        .menu-btn {
            position: fixed;
            bottom: 30px; right: 30px;
            width: 62px; height: 62px;
            border-radius: 50%;
            background: var(--grad-brand);
            color: #fff;
            font-size: 30px;
            display: none;
            align-items: center;
            justify-content: center;
            box-shadow: 0 12px 28px rgba(0, 112, 243, 0.45);
            cursor: pointer;
            z-index: 1000;
            transition: transform 0.22s var(--ease-spring), box-shadow 0.25s ease;
            animation: fabIn 0.4s var(--ease-spring) backwards;
        }
        .menu-btn:hover {
            transform: scale(1.1) rotate(90deg);
            box-shadow: 0 16px 36px rgba(0, 112, 243, 0.6);
        }
        @keyframes fabIn {
            from { opacity: 0; transform: scale(0.4) translateY(24px); }
            to   { opacity: 1; transform: none; }
        }

        .main-menu, .sub-menu {
            position: fixed;
            background: rgba(255, 255, 255, 0.96);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            border-radius: 16px;
            box-shadow: var(--shadow-lg);
            z-index: 10000;
            min-width: 140px;
            display: none;
            overflow: hidden;
            animation: menuIn 0.18s var(--ease-spring);
        }
        .main-menu ul, .sub-menu ul {
            list-style: none;
            margin: 0;
            padding: 8px;
        }
        .main-menu li, .sub-menu li {
            padding: 10px 16px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--ink);
            white-space: nowrap;
            border-radius: 10px;
            transition: background 0.15s ease, transform 0.15s ease;
        }
        .main-menu li:hover, .sub-menu li:hover {
            background: rgba(0, 112, 243, 0.08);
            transform: translateX(3px);
        }
        @keyframes menuIn {
            from { opacity: 0; transform: scale(0.92) translateY(8px); }
            to   { opacity: 1; transform: none; }
        }

        /* ================= 响应式 ================= */
        @media (max-width: 600px) {
            .site-header { padding: 12px 16px; }
            .brand-name-text { font-size: 1.1rem; }
            .nav-link { padding: 6px 10px; font-size: 0.82rem; }
            .site-ad-nav { padding: 6px 10px; font-size: 0.76rem; }
            .comic-grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
            .menu-btn { bottom: 22px; right: 22px; width: 56px; height: 56px; font-size: 26px; }
        }
    </style>
</head>
<body>
    <!-- 无 JS 环境提示 -->
    <noscript><div style="position:fixed;top:0;left:0;right:0;background:#ff6b6b;color:#fff;padding:10px;text-align:center;z-index:99999;">本站功能需要启用 JavaScript 才能正常使用</div></noscript>

    <!-- 启动画面 -->
    <div id="splash" class="splash-screen">
        <div class="splash-content">
            <div class="spinner-outer" id="spinnerOuter"></div>
            <div class="spinner-inner" id="spinnerInner"></div>
            <div class="center-icon" id="centerIcon">✿</div>
            <div class="splash-brand" id="splashBrand">
                <div class="brand-name">漫画站</div>
                <div class="brand-tag">✿ 你的漫画小屋 ✿</div>
            </div>
        </div>
    </div>

    <!-- 主页内容 -->
    <div id="main-content">
        <!-- 顶部导航 -->
        <header class="site-header">
            <div class="brand" onclick="location.href='index.html'">
                <span class="brand-logo">✿</span>
                <span class="brand-name-text">漫画站</span>
            </div>
            <nav class="nav-links">
                <button type="button" class="site-ad-nav" onclick="showSiteModal()">🌱 新站上线</button>
                <a href="docs.html" class="nav-link">📚 文档中心</a>
                <a href="login.html" class="nav-link" id="navLogin">🔑 登录</a>
                <span class="nav-user" id="navUser" style="display:none;"></span>
            </nav>
        </header>

        <div class="container">
            <!-- 快捷操作 -->
            <div class="hero-actions">
                <a href="reader.html" class="btn btn-shine">📦 导入本地漫画</a>
                <a href="#comic-list-area" class="btn btn-ghost" id="browseBtn">📚 浏览在线漫画</a>
            </div>

            <!-- 用户区 -->
            <div id="user-area"></div>

            <!-- 在线漫画 -->
            <div id="comic-list-area" style="display: none;">
                <div class="section-head">
                    <h2>📚 在线漫画</h2>
                    <span class="count-chip" id="comicCount"></span>
                </div>
                <div class="search-wrap">
                    <span class="search-icon">🔍</span>
                    <input type="text" id="search" placeholder="搜索漫画标题或作者...">
                </div>
                <div id="comic-list" class="comic-grid"></div>
            </div>

            <div class="copyright">✿ 本网站由 G_灵零7 所有 · Made with 💙</div>
        </div>
    </div>

    <!-- 菜单按钮 -->
    <div id="menuBtn" class="menu-btn">☰</div>

    <!-- 主菜单（向上弹出） -->
    <div id="mainMenu" class="main-menu">
        <ul>
            <li id="uploadMenuItem">📤 上传漫画</li>
            <li id="manageComicsMenuItem">📋 管理漫画</li>
            <li id="settingsMenuItem">⚙️ 小设置</li>
            <li id="docsMenuItem">📚 文档中心</li>
        </ul>
    </div>

    <!-- 子菜单（向左弹出） -->
    <div id="subMenu" class="sub-menu">
        <ul>
            <li id="changePasswordItem">🔑 修改密码</li>
            <li id="changeSecondFactorItem">🔐 修改二密</li>
            <li id="toggleAdultItem" style="display:none;">⚠️ 安全内容: <span id="adultStatus"></span></li>
        </ul>
    </div>

    <script src="common.js" defer></script>
    <script>
        // ---------- 启动动画 ----------
        let pageInitialized = false;

        // 私密浏览等环境下 sessionStorage 可能抛异常，安全读取
        let splashPlayed = false;
        try { splashPlayed = sessionStorage.getItem('splashPlayed') === 'true'; } catch (e) { splashPlayed = false; }

        // 从登录页跳转而来时，主页以“镜头拉近”的方式入场
        let fromLogin = false;
        try {
            fromLogin = sessionStorage.getItem('fromLogin') === '1';
            if (fromLogin) sessionStorage.removeItem('fromLogin');
        } catch (e) { fromLogin = false; }

        function showMainContent() {
            const splash = document.getElementById('splash');
            const main = document.getElementById('main-content');
            if (splash) splash.classList.add('hidden');
            if (main) {
                main.style.display = 'flex';
                main.style.opacity = '1';
                if (fromLogin) main.classList.add('zoom-enter');
            }
        }

        // 兜底：即使脚本出错也保证主内容可见，避免一直停留在启动画面
        window.addEventListener('error', showMainContent);

        // 用户偏好“减少动态效果”时跳过启动动画
        const prefersReducedMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

        if (splashPlayed || prefersReducedMotion) {
            showMainContent();
            initPage();
        } else {
            window.addEventListener('pageshow', function(event) {
                if (event.persisted) {
                    showMainContent();
                    initPage();
                }
            });

            requestAnimationFrame(function() {
                const splash = document.getElementById('splash');
                const spinnerInner = document.getElementById('spinnerInner');
                const spinnerOuter = document.getElementById('spinnerOuter');
                const centerIcon = document.getElementById('centerIcon');
                const brandText = document.getElementById('splashBrand');

                setTimeout(() => brandText.classList.add('visible'), 650);
                setTimeout(() => centerIcon.classList.add('visible'), 1500);
                setTimeout(() => {
                    spinnerInner.style.opacity = '0';
                    spinnerOuter.style.opacity = '0';
                }, 2400);
                setTimeout(() => centerIcon.classList.remove('visible'), 3000);
                setTimeout(() => brandText.classList.remove('visible'), 3100);
                setTimeout(() => {
                    showMainContent();
                    try { sessionStorage.setItem('splashPlayed', 'true'); } catch (e) {}
                    initPage();
                }, 3300);
            });
        }

        // ---------- 页面初始化 ----------
        async function initPage() {
            // 防止重复初始化（如浏览器后退/前进触发 pageshow 与启动定时器同时调用）
            // 导致菜单等事件被重复绑定、点击失效
            if (pageInitialized) return;
            pageInitialized = true;

            const isLoggedIn = localStorage.getItem('loggedIn') === 'true';
            const currentUser = localStorage.getItem('currentUser') || '';
            const userRole = localStorage.getItem('userRole') || '';
            const userArea = document.getElementById('user-area');
            const menuBtn = document.getElementById('menuBtn');
            const mainMenu = document.getElementById('mainMenu');
            const subMenu = document.getElementById('subMenu');
            const navLogin = document.getElementById('navLogin');
            const navUser = document.getElementById('navUser');
            const browseBtn = document.getElementById('browseBtn');

            if (isLoggedIn) {
                if (navLogin) navLogin.style.display = 'none';
                if (navUser) {
                    navUser.style.display = 'inline-flex';
                    navUser.textContent = '👤 ' + currentUser;
                    navUser.title = '当前登录用户：' + currentUser;
                }
                let userHtml = `<span class="welcome-chip">✨ 欢迎回来，<b>${escapeHtml(currentUser)}</b> <span class="chip">${escapeHtml(userRole)}</span></span>`;
                if (userRole === 'system' || userRole === 'admin') {
                    userHtml += `<button class="btn-ghost small-btn" onclick="location.href='admin-users.html'">👥 用户管理</button>`;
                }
                userHtml += `<button class="small-btn" onclick="logout()">退出登录</button>`;
                userArea.innerHTML = userHtml;
                document.getElementById('comic-list-area').style.display = 'block';
                await loadComics();
                menuBtn.style.display = 'flex';

                // 获取用户权限和偏好
                await loadUserAdultStatus();

                // 每次登录后弹一次新站宣传（仅登录用户，弹出后清除标记）
                try {
                    if (sessionStorage.getItem('siteModalPending') === '1') {
                        sessionStorage.removeItem('siteModalPending');
                        // 稍等片刻再弹：等待 common.js(defer) 加载完成，也配合主页入场动画的节奏
                        setTimeout(function () {
                            if (typeof window.showSiteModal === 'function') window.showSiteModal();
                        }, 400);
                    }
                } catch (e) {}
            } else {
                if (navUser) navUser.style.display = 'none';
                if (navLogin) navLogin.style.display = '';
                userArea.innerHTML = `<p>您还未登录，<a href="login.html">点击登录</a> 可查看在线漫画。</p>`;
                menuBtn.style.display = 'none';
            }

            // Hero 浏览按钮：未登录时引导去登录
            if (browseBtn) {
                if (isLoggedIn) {
                    browseBtn.setAttribute('href', '#comic-list-area');
                    browseBtn.textContent = '📚 浏览在线漫画';
                } else {
                    browseBtn.setAttribute('href', 'login.html');
                    browseBtn.textContent = '🔑 登录后浏览在线漫画';
                }
            }

            // 菜单按钮点击事件
            menuBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                subMenu.style.display = 'none';
                if (mainMenu.style.display === 'block') {
                    mainMenu.style.display = 'none';
                } else {
                    const btnRect = menuBtn.getBoundingClientRect();
                    mainMenu.style.bottom = (window.innerHeight - btnRect.top + 10) + 'px';
                    mainMenu.style.right = (window.innerWidth - btnRect.right) + 'px';
                    mainMenu.style.display = 'block';
                }
            });

            // 上传漫画菜单项（仅管理员）
            document.getElementById('uploadMenuItem').addEventListener('click', (e) => {
                e.stopPropagation();
                if (userRole === 'system' || userRole === 'admin') {
                    window.location.href = 'admin-upload.html';
                } else {
                    alert('无权限上传漫画');
                }
                closeAllMenus();
            });

            // 管理漫画菜单项（仅管理员）
            document.getElementById('manageComicsMenuItem').addEventListener('click', (e) => {
                e.stopPropagation();
                if (userRole === 'system' || userRole === 'admin') {
                    window.location.href = 'admin-manage.html';
                } else {
                    alert('无权限管理漫画');
                }
                closeAllMenus();
            });

            // 文档中心
            document.getElementById('docsMenuItem').addEventListener('click', (e) => {
                e.stopPropagation();
                window.location.href = 'docs.html';
                closeAllMenus();
            });

            document.getElementById('settingsMenuItem').addEventListener('click', (e) => {
                e.stopPropagation();
                // 先读取主菜单宽度（置为隐藏后 offsetWidth 会变成 0）
                const mainMenuWidth = mainMenu.offsetWidth;
                mainMenu.style.display = 'none';
                const btnRect = menuBtn.getBoundingClientRect();
                const mainBottom = (window.innerHeight - btnRect.top + 10);
                const mainRight = (window.innerWidth - btnRect.right);
                const gap = 8;

                // 临时显示以测量子菜单真实宽度（不可见，不会闪烁）
                subMenu.style.visibility = 'hidden';
                subMenu.style.display = 'block';
                const subMenuWidth = subMenu.offsetWidth || 150;
                subMenu.style.display = 'none';
                subMenu.style.visibility = 'visible';

                // 子菜单默认贴主菜单左侧弹出（底部对齐）
                let subRight = mainRight + mainMenuWidth + gap;
                // 左侧空间不足时，改为贴主菜单右侧弹出，避免溢出屏幕
                if (subRight + subMenuWidth > window.innerWidth) {
                    subRight = Math.max(mainRight - subMenuWidth - gap, 10);
                }
                subMenu.style.bottom = mainBottom + 'px';
                subMenu.style.right = subRight + 'px';
                subMenu.style.display = 'block';
            });

            document.addEventListener('click', closeAllMenus);
            document.addEventListener('contextmenu', closeAllMenus);

            function closeAllMenus() {
                mainMenu.style.display = 'none';
                subMenu.style.display = 'none';
            }

            // 修改密码
            document.getElementById('changePasswordItem').addEventListener('click', async () => {
                const oldPassword = prompt('请输入当前密码：');
                if (!oldPassword) return;
                const newPassword = prompt('请输入新密码（至少6位）：');
                if (!newPassword || newPassword.length < 6) {
                    alert('新密码至少6位');
                    return;
                }
                const confirmPassword = prompt('请再次输入新密码：');
                if (newPassword !== confirmPassword) {
                    alert('两次输入的新密码不一致');
                    return;
                }
                try {
                    const res = await fetch('/api/change-password', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'X-Auth-UserId': localStorage.getItem('currentUserId')
                        },
                        body: JSON.stringify({ oldPassword, newPassword })
                    });
                    const data = await res.json();
                    if (res.ok && data.success) {
                        alert('密码修改成功，请重新登录');
                        logout();
                    } else {
                        alert('修改失败: ' + data.error);
                    }
                } catch (err) {
                    alert('网络错误: ' + err.message);
                }
                closeAllMenus();
            });

            // 修改二密
            document.getElementById('changeSecondFactorItem').addEventListener('click', async () => {
                const newSecondFactor = prompt('请输入新的8位第二层验证码：');
                if (!newSecondFactor || newSecondFactor.length !== 8) {
                    alert('验证码必须为8位');
                    return;
                }
                try {
                    const res = await fetch('/api/change-second-factor', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'X-Auth-UserId': localStorage.getItem('currentUserId')
                        },
                        body: JSON.stringify({ newSecondFactor })
                    });
                    const data = await res.json();
                    if (res.ok && data.success) {
                        alert('第二层验证码修改成功，下次登录时生效');
                    } else {
                        alert('修改失败: ' + data.error);
                    }
                } catch (err) {
                    alert('网络错误: ' + err.message);
                }
                closeAllMenus();
            });

            // 切换安全内容偏好
            document.getElementById('toggleAdultItem').addEventListener('click', async () => {
                try {
                    const res = await fetch('/api/toggle-allow-adult-self', {
                        method: 'PATCH',
                        headers: {
                            'X-Auth-UserId': localStorage.getItem('currentUserId')
                        }
                    });
                    const data = await res.json();
                    if (res.ok && data.success) {
                        alert(`已切换为${data.newStatus === 'yes' ? '允许' : '禁止'}显示高危内容`);
                        await loadUserAdultStatus();
                    } else {
                        alert('操作失败: ' + data.error);
                    }
                } catch (err) {
                    alert('网络错误: ' + err.message);
                }
                closeAllMenus();
            });
        }

        async function loadUserAdultStatus() {
            try {
                const res = await fetch('/api/get-user-allow-adult', {
                    headers: { 'X-Auth-UserId': localStorage.getItem('currentUserId') }
                });
                const data = await res.json();
                if (data.success) {
                    const toggleItem = document.getElementById('toggleAdultItem');
                    if (data.adult_enabled === 'yes') {
                        toggleItem.style.display = 'block';
                        const statusSpan = document.getElementById('adultStatus');
                        statusSpan.innerText = data.allow_adult === 'yes' ? '允许' : '禁止';
                    } else {
                        toggleItem.style.display = 'none';
                    }
                }
            } catch (err) {
                console.error('加载成人内容状态失败', err);
            }
        }

        window.logout = function() {
            localStorage.removeItem('loggedIn');
            localStorage.removeItem('currentUser');
            localStorage.removeItem('userRole');
            localStorage.removeItem('currentUserId');
            window.location.reload();
        };

        let comicsData = [];

        // 加载骨架屏占位
        function renderSkeletons(count) {
            const listDiv = document.getElementById('comic-list');
            if (!listDiv) return;
            let html = '';
            for (let i = 0; i < count; i++) {
                html += `
                    <div class="comic-card" style="animation:none;">
                        <div class="thumb skeleton"></div>
                        <div class="sk-line" style="width:65%;"></div>
                        <div class="sk-line" style="width:42%;"></div>
                    </div>
                `;
            }
            listDiv.innerHTML = html;
        }

        async function loadComics() {
            const listDiv = document.getElementById('comic-list');
            renderSkeletons(6);
            try {
                const resp = await fetch('/api/comics', {
                    headers: { 'X-Auth-UserId': localStorage.getItem('currentUserId') || '' }
                });
                const data = await resp.json();
                if (data.success) {
                    comicsData = data.data;
                    renderComics(comicsData);
                } else {
                    if (listDiv) listDiv.innerHTML = `<p>加载失败：${escapeHtml(data.error || '未知错误')}</p>`;
                }
            } catch (err) {
                console.error('加载漫画失败', err);
                if (listDiv) listDiv.innerHTML = '<p>网络错误，请检查网络后 <a href="javascript:void(0)" onclick="location.reload()" style="color:#0070f3;">刷新重试</a></p>';
            }
        }

        function renderComics(comics) {
            const listDiv = document.getElementById('comic-list');
            if (!listDiv) return;
            const countChip = document.getElementById('comicCount');
            if (countChip) countChip.textContent = comics.length + ' 本';
            if (comics.length === 0) {
                listDiv.innerHTML = '<p>暂无漫画</p>';
                return;
            }
            let html = '';
            for (let i = 0; i < comics.length; i++) {
                const c = comics[i];
                if (c.id == null) continue;
                html += `
                    <div class="comic-card" style="animation-delay:${Math.min(i * 60, 600)}ms" onclick="location.href='detail.html?id=${c.id}'">
                        <div class="thumb">
                            <img src="/api/proxy?url=${encodeURIComponent(c.cover_url || '')}" alt="${escapeHtml(c.title || '')}" loading="lazy" onerror="this.style.visibility='hidden'">
                        </div>
                        <h3>${escapeHtml(c.title || '未知标题')}</h3>
                        <p>${escapeHtml(c.author || '未知作者')} · ${c.chapters || 0}话</p>
                        <div class="tags">${(c.tags || []).map(t => `<span>${escapeHtml(t)}</span>`).join('')}</div>
                    </div>
                `;
            }
            listDiv.innerHTML = html;
        }

        function escapeHtml(str) {
            if (str == null) return '';
            return String(str).replace(/[&<>]/g, function(m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            });
        }

        // 搜索输入防抖，避免每敲一个键就全量渲染
        let searchTimer = null;
        document.getElementById('search').addEventListener('input', function() {
            clearTimeout(searchTimer);
            searchTimer = setTimeout(function() { window.filterComics(); }, 200);
        });

        window.filterComics = function() {
            const search = (document.getElementById('search').value || '').toLowerCase();
            const filtered = comicsData.filter(c =>
                (c.title || '').toLowerCase().includes(search) ||
                (c.author || '').toLowerCase().includes(search)
            );
            renderComics(filtered);
        };
    </script>
</body>
</html>
