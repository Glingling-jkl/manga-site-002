<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>漫画站 · 主页</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* 启动画面样式（淡粉色双圈动画） */
        .splash-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: white;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.5s ease;
        }
        .splash-screen.hidden {
            display: none;
        }
        .splash-content {
            position: relative;
            width: 220px;
            height: 220px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .spinner-inner {
            position: absolute;
            width: 180px;
            height: 180px;
            border: 6px solid #ffe4ec;
            border-top-color: #ffb6c1;
            border-radius: 50%;
            animation: spin 1.5s infinite linear;
            transition: opacity 0.5s ease;
        }
        .spinner-outer {
            position: absolute;
            width: 210px;
            height: 210px;
            border: 6px solid #ffe4ec;
            border-top-color: #ffb6c1;
            border-radius: 50%;
            animation: spin 2s infinite linear reverse;
            opacity: 0.5;
            transition: opacity 0.5s ease;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .center-icon {
            position: absolute;
            font-size: 100px;
            color: #ffb6c1;
            opacity: 0;
            transition: opacity 1s ease;
            pointer-events: none;
            z-index: 10;
            transform: translateY(-4px);
        }
        .center-icon.visible {
            opacity: 1;
        }
        #main-content {
            display: none;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        .import-button {
            background: linear-gradient(145deg, #0066ff, #0050cc);
            color: white;
            border: none;
            border-radius: 16px;
            width: 100%;
            aspect-ratio: 1 / 1.2;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 10px 20px rgba(0,102,255,0.4);
            transition: transform 0.2s, box-shadow 0.2s;
            margin-bottom: 20px;
        }
        .import-button:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 30px rgba(0,102,255,0.6);
        }
        .import-hint {
            font-size: 1rem;
            color: #666;
            text-align: center;
            margin-bottom: 10px;
        }
        .copyright {
            font-size: 0.8rem;
            color: #999;
            text-align: center;
            margin-top: 30px;
            padding-top: 15px;
            border-top: 1px solid #eee;
        }
        .comic-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        .comic-card {
            background: #fafafa;
            border-radius: 16px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            text-align: center;
            padding-bottom: 10px;
        }
        .comic-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.15);
        }
        .comic-card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
        }
        .comic-card h3 {
            font-size: 16px;
            margin: 10px 0 5px;
        }
        .tags {
            margin-top: 5px;
            font-size: 0.8rem;
        }
        .tags span {
            display: inline-block;
            background: #f0f0f0;
            color: #333;
            border-radius: 12px;
            padding: 2px 8px;
            margin-right: 4px;
        }
        .fab-upload {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: #0070f3;
            color: white;
            font-size: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 10px rgba(0,112,243,0.5);
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            z-index: 1000;
            display: none;
        }
        .fab-upload:hover {
            transform: scale(1.1);
            box-shadow: 0 6px 15px rgba(0,112,243,0.7);
        }
    </style>
</head>
<body>
    <div id="splash" class="splash-screen">
        <div class="splash-content">
            <div class="spinner-outer" id="spinnerOuter"></div>
            <div class="spinner-inner" id="spinnerInner"></div>
            <div class="center-icon" id="centerIcon">✿</div>
        </div>
    </div>

    <div id="main-content">
        <div class="container">
            <div class="import-button" onclick="location.href='reader.html'">
                <span>导入</span>
            </div>
            <div class="import-hint">在本地观看漫画</div>

            <div id="user-area" style="margin-top: 30px; text-align: center;"></div>
            <div id="comic-list-area" style="display: none; margin-top: 30px;">
                <h2>📚 在线漫画</h2>
                <input type="text" id="search" placeholder="搜索漫画..." onkeyup="filterComics()">
                <div id="comic-list" class="comic-grid"></div>
            </div>
            <div class="copyright">✿本网站由G_灵零7所有</div>
        </div>
    </div>

    <div id="fab-upload" class="fab-upload" onclick="location.href='admin-upload.html'">📤</div>

    <script>
        (function() {
            if (sessionStorage.getItem('splashPlayed')) {
                document.getElementById('splash').classList.add('hidden');
                document.getElementById('main-content').style.display = 'block';
                document.getElementById('main-content').style.opacity = '1';
                initPage();
                return;
            }

            window.addEventListener('pageshow', function(event) {
                if (event.persisted) {
                    document.getElementById('splash').classList.add('hidden');
                    document.getElementById('main-content').style.display = 'block';
                    document.getElementById('main-content').style.opacity = '1';
                    initPage();
                }
            });

            requestAnimationFrame(function() {
                const splash = document.getElementById('splash');
                const spinnerInner = document.getElementById('spinnerInner');
                const spinnerOuter = document.getElementById('spinnerOuter');
                const centerIcon = document.getElementById('centerIcon');
                const mainContent = document.getElementById('main-content');

                setTimeout(() => centerIcon.classList.add('visible'), 1500);
                setTimeout(() => {
                    spinnerInner.style.opacity = '0';
                    spinnerOuter.style.opacity = '0';
                }, 2500);
                setTimeout(() => centerIcon.classList.remove('visible'), 4000);
                setTimeout(() => {
                    splash.classList.add('hidden');
                    mainContent.style.display = 'block';
                    setTimeout(() => mainContent.style.opacity = '1', 10);
                    sessionStorage.setItem('splashPlayed', 'true');
                    initPage();
                }, 4750);
            });
        })();

        function initPage() {
            const isLoggedIn = localStorage.getItem('loggedIn') === 'true';
            const currentUser = localStorage.getItem('currentUser') || '';
            const userRole = localStorage.getItem('userRole') || '';
            const userArea = document.getElementById('user-area');
            const fabUpload = document.getElementById('fab-upload');

            if (isLoggedIn) {
                let userHtml = `<p>欢迎，${currentUser} (${userRole})</p>`;
                if (userRole === 'system' || userRole === 'admin') {
                    userHtml += `<button onclick="location.href='admin-users.html'" style="width:auto; padding:8px 20px; margin-top:10px; margin-right:10px;">👥 用户管理</button>`;
                }
                userHtml += `<button onclick="logout()" style="width:auto; padding:8px 20px; margin-top:10px;">退出登录</button>`;
                userArea.innerHTML = userHtml;
                document.getElementById('comic-list-area').style.display = 'block';
                loadComics();
                if (userRole === 'system' || userRole === 'admin') {
                    fabUpload.style.display = 'flex';
                } else {
                    fabUpload.style.display = 'none';
                }
            } else {
                userArea.innerHTML = `<p>您还未登录，<a href="login.html" style="color:#0070f3;">点击登录</a> 可查看在线漫画。</p>`;
                fabUpload.style.display = 'none';
            }
        }

        window.logout = function() {
            localStorage.removeItem('loggedIn');
            localStorage.removeItem('currentUser');
            localStorage.removeItem('userRole');
            localStorage.removeItem('currentUserId');
            window.location.reload();
        };

        let comicsData = [];

        async function loadComics() {
            try {
                const resp = await fetch('/api/comics', {
                    headers: { 'X-Auth-UserId': localStorage.getItem('currentUserId') || '' }
                });
                const data = await resp.json();
                if (data.success) {
                    comicsData = data.data;
                    renderComics(comicsData);
                }
            } catch (err) {
                console.error('加载漫画失败', err);
            }
        }

        function renderComics(comics) {
            const listDiv = document.getElementById('comic-list');
            if (!listDiv) return;
            if (comics.length === 0) {
                listDiv.innerHTML = '<p>暂无漫画</p>';
                return;
            }
            let html = '';
            for (let c of comics) {
                html += `
                    <div class="comic-card" onclick="location.href='detail.html?id=${c.id}'">
                        <img src="${c.cover_url}" alt="${c.title}" loading="lazy">
                        <h3>${c.title}</h3>
                        <p>${c.author} · ${c.chapters}话</p>
                        <div class="tags">${c.tags.map(t => `<span>${t}</span>`).join('')}</div>
                    </div>
                `;
            }
            listDiv.innerHTML = html;
        }

        window.filterComics = function() {
            const search = document.getElementById('search').value.toLowerCase();
            const filtered = comicsData.filter(c => 
                c.title.toLowerCase().includes(search) || 
                c.author.toLowerCase().includes(search)
            );
            renderComics(filtered);
        };
    </script>
</body>
</html>
