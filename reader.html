<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <title>全屏阅读器</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: black;
            color: white;
            font-family: system-ui, sans-serif;
            overflow-x: hidden;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        #controls {
            position: fixed;
            top: 0; left: 0; right: 0;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(5px);
            padding: 16px;
            display: flex;
            align-items: center;
            gap: 16px;
            z-index: 100;
            transition: opacity 0.3s;
            opacity: 0;
            pointer-events: none;
        }
        #controls.visible {
            opacity: 1;
            pointer-events: auto;
        }
        #back-btn {
            background: none;
            border: none;
            color: white;
            font-size: 1.2rem;
            padding: 8px 16px;
            cursor: pointer;
            border-radius: 40px;
            background: rgba(255,255,255,0.2);
        }
        #back-btn:active {
            background: rgba(255,255,255,0.4);
        }
        #upload-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            color: white;
            font-size: 1.5rem;
            padding: 20px;
        }
        #upload-area input {
            font-size: 1.2rem;
            padding: 15px 20px;
            margin-top: 20px;
            width: auto;
            max-width: 400px;
            background: #2a2a2a;
            color: white;
            border: 2px solid #0070f3;
            border-radius: 60px;
            cursor: pointer;
        }
        #comic-viewer {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .page-img {
            max-width: 100%;
            height: auto;
            display: block;
            margin: 0 auto;
        }
        #reset-btn {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: #0070f3;
            color: white;
            border: none;
            border-radius: 40px;
            padding: 12px 30px;
            font-size: 1.2rem;
            font-weight: bold;
            box-shadow: 0 5px 20px rgba(0,112,243,0.5);
            cursor: pointer;
            z-index: 200;
            display: none;
            transition: opacity 0.3s;
        }
        #reset-btn:hover {
            background: #0051b3;
        }
        #reset-btn.visible {
            display: block;
        }
        .retry-button {
            font-size: 1.2rem;
            padding: 15px 20px;
            margin: 20px auto;
            width: auto;
            max-width: 400px;
            background: #2a2a2a;
            color: white;
            border: 2px solid #0070f3;
            border-radius: 60px;
            cursor: pointer;
            display: inline-block;
            text-align: center;
            border: none;
            outline: none;
        }
        .retry-button:hover {
            background: #3a3a3a;
        }
        .progress-container {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80%;
            text-align: center;
            color: white;
            z-index: 300;
        }
        .progress-bar {
            width: 100%;
            height: 8px;
            background: #333;
            border-radius: 4px;
            overflow: hidden;
            margin: 10px 0;
        }
        .progress-fill {
            height: 100%;
            background: #0070f3;
            width: 0%;
            transition: width 0.2s;
        }
        .thread-info {
            margin-top: 5px;
            font-size: 0.9rem;
            color: #ccc;
        }
        .error-details {
            background: rgba(0,0,0,0.8);
            border-left: 4px solid #ff6b6b;
            padding: 10px;
            margin: 10px;
            font-family: monospace;
            font-size: 0.8rem;
            text-align: left;
            white-space: pre-wrap;
            word-break: break-all;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
</head>
<body>
    <div id="controls" class="visible">
        <button id="back-btn">← 返回</button>
        <span>点击屏幕显示/隐藏控制栏</span>
    </div>

    <button id="reset-btn">重置并导入</button>

    <div id="upload-area">
        <p>📦 选择漫画压缩包 (ZIP)</p>
        <input type="file" id="zip-upload" accept=".zip">
    </div>

    <div id="progress-container" class="progress-container" style="display: none;">
        <p id="progress-message">下载中...</p>
        <div class="progress-bar" id="progress-bar" style="display: block;">
            <div id="progress-fill" class="progress-fill"></div>
        </div>
        <p id="progress-percent">0%</p>
        <div id="thread-info" class="thread-info"></div>
    </div>

    <div id="comic-viewer"></div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const comicId = urlParams.get('id') || 'default';
        const zipUrl = urlParams.get('zip');
        const isOnline = !!zipUrl;

        const controls = document.getElementById('controls');
        const resetBtn = document.getElementById('reset-btn');
        const uploadArea = document.getElementById('upload-area');
        const uploadInput = document.getElementById('zip-upload');
        const viewer = document.getElementById('comic-viewer');
        const progressContainer = document.getElementById('progress-container');
        const progressFill = document.getElementById('progress-fill');
        const progressPercent = document.getElementById('progress-percent');
        const progressMessage = document.getElementById('progress-message');
        const threadInfo = document.getElementById('thread-info');
        let hideTimeout;

        if (isOnline) {
            resetBtn.style.display = 'none';
        }

        // 显示错误详情
        function showError(message, details = null) {
            const errorHtml = `
                <div class="error-details">
                    <strong>❌ 加载失败</strong><br>
                    ${message}<br>
                    ${details ? `<br>📄 详细信息：<br>${escapeHtml(details)}` : ''}
                    <br><br>
                    💡 你可以尝试：
                    <br>• <a href="${zipUrl}" target="_blank" style="color:#ffb6c1;">直接打开漫画链接</a>
                    <br>• 检查网络连接后 <button onclick="window.location.reload()">重试</button>
                </div>
            `;
            viewer.innerHTML = errorHtml;
            if (progressContainer) progressContainer.style.display = 'none';
        }

        function escapeHtml(str) {
            return str.replace(/[&<>]/g, function(m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            });
        }

        // 带进度回调的 fetch
        async function fetchWithProgress(url, onProgress, options = {}, timeout = 30000) {
            const controller = new AbortController();
            const id = setTimeout(() => controller.abort(), timeout);
            try {
                const response = await fetch(url, {
                    ...options,
                    signal: controller.signal,
                    mode: 'cors',
                    credentials: 'omit'
                });
                clearTimeout(id);
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }
                
                const contentLength = response.headers.get('content-length');
                const total = contentLength ? parseInt(contentLength, 10) : 0;
                
                if (!total || !onProgress) {
                    return await response.arrayBuffer();
                }
                
                // 读取流并报告进度
                const reader = response.body.getReader();
                const chunks = [];
                let received = 0;
                
                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    chunks.push(value);
                    received += value.length;
                    onProgress(received, total);
                }
                
                // 合并所有块
                const allChunks = new Uint8Array(received);
                let position = 0;
                for (const chunk of chunks) {
                    allChunks.set(chunk, position);
                    position += chunk.length;
                }
                
                return allChunks.buffer;
            } catch (err) {
                clearTimeout(id);
                throw err;
            }
        }

        // 加载单个 ZIP 并解压
        async function loadZipFile(file) {
            try {
                const zip = await JSZip.loadAsync(file);
                const imageFiles = Object.keys(zip.files)
                    .filter(name => /\.(jpg|jpeg|png|gif|webp|bmp)$/i.test(name))
                    .sort((a, b) => a.localeCompare(b, undefined, { numeric: true, sensitivity: 'base' }));
                if (imageFiles.length === 0) {
                    viewer.innerHTML += '<p>压缩包中没有图片</p><button class="retry-button" onclick="window.location.reload()">重新导入</button>';
                    return;
                }
                for (let name of imageFiles) {
                    const blob = await zip.files[name].async('blob');
                    const url = URL.createObjectURL(blob);
                    const img = document.createElement('img');
                    img.src = url;
                    img.className = 'page-img';
                    img.alt = name;
                    viewer.appendChild(img);
                }
            } catch (err) {
                viewer.innerHTML += `<p style="color:red;">解压失败：${err.message}</p>`;
            }
        }

        // 下载单个分片（带重试和进度）
        async function downloadPart(url, partIndex, updateProgress, partNumber, totalParts) {
            const maxRetries = 2;
            let retryCount = 0;
            
            while (retryCount <= maxRetries) {
                try {
                    console.log(`正在下载分片 ${partIndex}: ${url}`);
                    
                    // 定义分片进度回调
                    const onPartProgress = (received, total) => {
                        const partPercent = (received / total) * 100;
                        updateProgress(partNumber, totalParts, partPercent);
                    };
                    
                    const arrayBuffer = await fetchWithProgress(url, onPartProgress, {}, 30000);
                    const blob = new Blob([arrayBuffer], { type: 'application/zip' });
                    const file = new File([blob], `part_${partIndex}.zip`, { type: 'application/zip' });
                    await loadZipFile(file);
                    
                    // 下载成功，标记为完成
                    updateProgress(partNumber, totalParts, 100);
                    return;
                } catch (err) {
                    if (retryCount < maxRetries) {
                        console.warn(`分片 ${partIndex} 下载失败，重试 ${retryCount + 1}/${maxRetries}: ${err.message}`);
                        await new Promise(resolve => setTimeout(resolve, 1000 * (retryCount + 1)));
                        retryCount++;
                    } else {
                        throw new Error(`分片 ${partIndex} 下载失败: ${err.message}`);
                    }
                }
            }
        }

        // 主加载逻辑
        if (zipUrl) {
            (async () => {
                uploadArea.style.display = 'none';
                progressContainer.style.display = 'block';
                progressFill.style.width = '0%';
                progressPercent.innerText = '0%';
                progressMessage.innerText = '加载漫画信息...';
                threadInfo.innerText = '';

                try {
                    // 判断是单文件还是分片
                    const isSplit = zipUrl.includes('/info.json');
                    
                    if (!isSplit) {
                        // 旧版单文件漫画：直接下载 ZIP，带进度条
                        progressMessage.innerText = '下载漫画中...';
                        const proxyUrl = `/api/proxy?url=${encodeURIComponent(zipUrl)}`;
                        console.log('加载单文件 ZIP (proxy):', proxyUrl);
                        
                        let lastPercent = 0;
                        const onProgress = (received, total) => {
                            if (total > 0) {
                                const percent = Math.round((received / total) * 100);
                                if (percent !== lastPercent) {
                                    lastPercent = percent;
                                    progressFill.style.width = percent + '%';
                                    progressPercent.innerText = percent + '%';
                                    console.log(`单文件下载进度: ${percent}%`);
                                }
                            }
                        };
                        
                        const arrayBuffer = await fetchWithProgress(proxyUrl, onProgress, {}, 60000);
                        const blob = new Blob([arrayBuffer], { type: 'application/zip' });
                        const file = new File([blob], 'comic.zip', { type: 'application/zip' });
                        progressContainer.style.display = 'none';
                        await loadZipFile(file);
                        return;
                    }
                    
                    // 分片漫画流程
                    const infoUrl = zipUrl;
                    const proxyInfoUrl = `/api/proxy?url=${encodeURIComponent(infoUrl)}`;
                    console.log('加载 info.json (proxy):', proxyInfoUrl);
                    
                    const infoResponse = await fetchWithTimeout(proxyInfoUrl, {}, 10000);
                    if (!infoResponse.ok) {
                        throw new Error(`无法加载 info.json (HTTP ${infoResponse.status})`);
                    }
                    
                    const info = await infoResponse.json();
                    const baseUrl = zipUrl.substring(0, zipUrl.lastIndexOf('/'));
                    threadInfo.innerText = `分片模式 (${info.total_parts} 个分片)`;
                    progressMessage.innerText = '下载中...';
                    
                    viewer.innerHTML = '';
                    
                    // 每个分片的进度
                    const partProgress = new Array(info.total_parts).fill(0);
                    
                    // 更新总进度
                    const updateTotalProgress = () => {
                        const totalPercent = partProgress.reduce((sum, p) => sum + p, 0) / info.total_parts;
                        progressFill.style.width = totalPercent + '%';
                        progressPercent.innerText = Math.round(totalPercent) + '%';
                    };
                    
                    // 更新单个分片进度
                    const updateProgress = (partNumber, totalParts, percent) => {
                        partProgress[partNumber - 1] = percent;
                        updateTotalProgress();
                        console.log(`分片 ${partNumber}/${totalParts} 进度: ${percent}%`);
                    };
                    
                    // 并发下载所有分片
                    const CONCURRENT_LIMIT = 3;
                    const parts = [];
                    for (let i = 0; i < info.parts.length; i++) {
                        const rawPartUrl = `${baseUrl}/zips/${info.parts[i]}`;
                        const partUrl = `/api/proxy?url=${encodeURIComponent(rawPartUrl)}`;
                        parts.push({ url: partUrl, index: i + 1 });
                    }
                    
                    // 使用 Promise 池控制并发
                    for (let i = 0; i < parts.length; i += CONCURRENT_LIMIT) {
                        const batch = parts.slice(i, i + CONCURRENT_LIMIT);
                        const batchPromises = batch.map(part => downloadPart(part.url, part.index, updateProgress, part.index, info.total_parts));
                        await Promise.all(batchPromises);
                    }
                    
                    progressContainer.style.display = 'none';
                } catch (err) {
                    console.error('加载失败:', err);
                    progressContainer.style.display = 'none';
                    showError(err.message, err.stack || '无详细信息');
                }
            })();
        }

        // 带超时的 fetch（用于小文件）
        async function fetchWithTimeout(url, options = {}, timeout = 30000) {
            const controller = new AbortController();
            const id = setTimeout(() => controller.abort(), timeout);
            try {
                const response = await fetch(url, {
                    ...options,
                    signal: controller.signal,
                    mode: 'cors',
                    credentials: 'omit'
                });
                clearTimeout(id);
                return response;
            } catch (err) {
                clearTimeout(id);
                throw err;
            }
        }

        // ---------- 以下为控制栏、返回按钮、本地上传等原有功能 ----------
        function showControls() {
            controls.classList.add('visible');
            clearTimeout(hideTimeout);
            hideTimeout = setTimeout(() => {
                controls.classList.remove('visible');
            }, 2000);
        }

        document.body.addEventListener('click', (e) => {
            if (e.target.closest('#back-btn') || e.target.closest('#reset-btn') || e.target.closest('.retry-button')) return;
            showControls();
        });

        showControls();

        const backBtn = document.getElementById('back-btn');
        let timer;
        let longPressed = false;

        backBtn.addEventListener('mousedown', () => {
            timer = setTimeout(() => {
                longPressed = true;
                window.location.href = 'index.html';
            }, 500);
        });
        backBtn.addEventListener('mouseup', () => {
            clearTimeout(timer);
            if (!longPressed) {
                window.location.href = `detail.html?id=${comicId}`;
            }
            longPressed = false;
        });
        backBtn.addEventListener('mouseleave', () => {
            clearTimeout(timer);
            longPressed = false;
        });

        backBtn.addEventListener('touchstart', (e) => {
            e.preventDefault();
            timer = setTimeout(() => {
                longPressed = true;
                window.location.href = 'index.html';
            }, 500);
        });
        backBtn.addEventListener('touchend', (e) => {
            e.preventDefault();
            clearTimeout(timer);
            if (!longPressed) {
                window.location.href = `detail.html?id=${comicId}`;
            }
            longPressed = false;
        });
        backBtn.addEventListener('touchcancel', () => {
            clearTimeout(timer);
            longPressed = false;
        });

        resetBtn.addEventListener('click', () => {
            if (isOnline) return;
            resetBtn.classList.remove('visible');
            uploadArea.style.display = 'flex';
            viewer.innerHTML = '';
            uploadInput.value = '';
            uploadInput.click();
        });

        function checkScroll() {
            if (isOnline) return;
            if (uploadArea.style.display === 'none' && viewer.children.length > 0) {
                const scrollY = window.scrollY;
                const windowHeight = window.innerHeight;
                const documentHeight = document.documentElement.scrollHeight;
                if (scrollY + windowHeight >= documentHeight - 50) {
                    resetBtn.classList.add('visible');
                } else {
                    resetBtn.classList.remove('visible');
                }
            } else {
                resetBtn.classList.remove('visible');
            }
        }
        window.addEventListener('scroll', checkScroll);

        const savedScroll = localStorage.getItem(`progress_${comicId}`);
        if (savedScroll) {
            window.addEventListener('load', () => {
                setTimeout(() => {
                    window.scrollTo(0, parseInt(savedScroll));
                }, 100);
            });
        }

        let scrollTimer;
        window.addEventListener('scroll', () => {
            clearTimeout(scrollTimer);
            scrollTimer = setTimeout(() => {
                localStorage.setItem(`progress_${comicId}`, window.scrollY);
            }, 200);
        });

        uploadInput.addEventListener('change', async (event) => {
            const file = event.target.files[0];
            if (!file) return;
            uploadArea.style.display = 'none';
            viewer.innerHTML = '';
            await loadZipFile(file);
        });
    </script>
</body>
</html>
