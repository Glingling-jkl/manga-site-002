<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <title>全屏阅读器</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: black;
            color: white;
            font-family: system-ui, sans-serif;
            overflow-x: hidden;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        #controls {
            position: fixed;
            top: 0; left: 0; right: 0;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(5px);
            padding: 16px;
            display: flex;
            align-items: center;
            gap: 16px;
            z-index: 100;
            transition: opacity 0.3s;
            opacity: 0;
            pointer-events: none;
        }
        #controls.visible {
            opacity: 1;
            pointer-events: auto;
        }
        #back-btn {
            background: none;
            border: none;
            color: white;
            font-size: 1.2rem;
            padding: 8px 16px;
            cursor: pointer;
            border-radius: 40px;
            background: rgba(255,255,255,0.2);
        }
        #back-btn:active {
            background: rgba(255,255,255,0.4);
        }
        #upload-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            color: white;
            font-size: 1.5rem;
            padding: 20px;
        }
        #upload-area input {
            font-size: 1.2rem;
            padding: 15px 20px;
            margin-top: 20px;
            width: auto;
            max-width: 400px;
            background: #2a2a2a;
            color: white;
            border: 2px solid #0070f3;
            border-radius: 60px;
            cursor: pointer;
        }
        #comic-viewer {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .page-img {
            max-width: 100%;
            height: auto;
            display: block;
            margin: 0 auto;
        }
        #reset-btn {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: #0070f3;
            color: white;
            border: none;
            border-radius: 40px;
            padding: 12px 30px;
            font-size: 1.2rem;
            font-weight: bold;
            box-shadow: 0 5px 20px rgba(0,112,243,0.5);
            cursor: pointer;
            z-index: 200;
            display: none;
            transition: opacity 0.3s;
        }
        #reset-btn:hover {
            background: #0051b3;
        }
        #reset-btn.visible {
            display: block;
        }
        .retry-button {
            font-size: 1.2rem;
            padding: 15px 20px;
            margin: 20px auto;
            width: auto;
            max-width: 400px;
            background: #2a2a2a;
            color: white;
            border: 2px solid #0070f3;
            border-radius: 60px;
            cursor: pointer;
            display: inline-block;
            text-align: center;
            border: none;
            outline: none;
        }
        .retry-button:hover {
            background: #3a3a3a;
        }
        .progress-container {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80%;
            text-align: center;
            color: white;
            z-index: 300;
        }
        .progress-bar {
            width: 100%;
            height: 8px;
            background: #333;
            border-radius: 4px;
            overflow: hidden;
            margin: 10px 0;
        }
        .progress-fill {
            height: 100%;
            background: #0070f3;
            width: 0%;
            transition: width 0.2s;
        }
        .thread-info {
            margin-top: 5px;
            font-size: 0.9rem;
            color: #ccc;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
</head>
<body>
    <div id="controls" class="visible">
        <button id="back-btn">← 返回</button>
        <span>点击屏幕显示/隐藏控制栏</span>
    </div>

    <button id="reset-btn">重置并导入</button>

    <div id="upload-area">
        <p>📦 选择漫画压缩包 (ZIP)</p>
        <input type="file" id="zip-upload" accept=".zip">
    </div>

    <div id="progress-container" class="progress-container" style="display: none;">
        <p id="progress-message">下载中...</p>
        <div class="progress-bar" id="progress-bar" style="display: block;">
            <div id="progress-fill" class="progress-fill"></div>
        </div>
        <p id="progress-percent">0%</p>
        <div id="thread-info" class="thread-info"></div>
    </div>

    <div id="comic-viewer"></div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const comicId = urlParams.get('id') || 'default';
        const zipUrl = urlParams.get('zip');
        const isOnline = !!zipUrl;

        const controls = document.getElementById('controls');
        const resetBtn = document.getElementById('reset-btn');
        const uploadArea = document.getElementById('upload-area');
        const uploadInput = document.getElementById('zip-upload');
        const viewer = document.getElementById('comic-viewer');
        const progressContainer = document.getElementById('progress-container');
        const progressFill = document.getElementById('progress-fill');
        const progressPercent = document.getElementById('progress-percent');
        const progressMessage = document.getElementById('progress-message');
        const threadInfo = document.getElementById('thread-info');
        let hideTimeout;

        if (isOnline) {
            resetBtn.style.display = 'none';
        }

        // 加载单个 ZIP 并解压（边加载边显示图片）
        async function loadZipFile(file) {
            try {
                const zip = await JSZip.loadAsync(file);
                const imageFiles = Object.keys(zip.files)
                    .filter(name => /\.(jpg|jpeg|png|gif|webp|bmp)$/i.test(name))
                    .sort((a, b) => a.localeCompare(b, undefined, { numeric: true, sensitivity: 'base' }));
                if (imageFiles.length === 0) {
                    viewer.innerHTML += '<p>压缩包中没有图片</p><button class="retry-button" onclick="window.location.reload()">重新导入</button>';
                    return;
                }
                for (let name of imageFiles) {
                    const blob = await zip.files[name].async('blob');
                    const url = URL.createObjectURL(blob);
                    const img = document.createElement('img');
                    img.src = url;
                    img.className = 'page-img';
                    img.alt = name;
                    viewer.appendChild(img);
                }
            } catch (err) {
                viewer.innerHTML += `<p style="color:red;">解压失败：${err.message}</p>`;
            }
        }

        // 下载单个分片
        async function downloadPart(url, partIndex) {
            const response = await fetch(url, { mode: 'cors' });
            if (!response.ok) throw new Error(`HTTP ${response.status}`);
            const blob = await response.blob();
            const file = new File([blob], `part_${partIndex}.zip`, { type: 'application/zip' });
            await loadZipFile(file);
        }

        // 主加载逻辑
        if (zipUrl) {
            (async () => {
                uploadArea.style.display = 'none';
                progressContainer.style.display = 'block';
                progressFill.style.width = '0%';
                progressPercent.innerText = '0%';
                progressMessage.innerText = '加载漫画信息...';
                threadInfo.innerText = '';

                try {
                    // 尝试获取 info.json（分片模式标志）
                    const infoUrl = zipUrl.replace(/\/[^/]+$/, '/info.json');
                    const infoRes = await fetch(infoUrl, { mode: 'cors' });
                    
                    if (infoRes.ok) {
                        // 分片模式
                        const info = await infoRes.json();
                        const baseUrl = zipUrl.substring(0, zipUrl.lastIndexOf('/'));
                        threadInfo.innerText = `分片模式 (${info.total_parts} 个分片)`;
                        progressMessage.innerText = '下载中...';
                        
                        viewer.innerHTML = ''; // 清空，准备显示图片
                        for (let i = 0; i < info.parts.length; i++) {
                            const partUrl = `${baseUrl}/parts/${info.parts[i]}`; // 添加 parts/ 前缀
                            await downloadPart(partUrl, i + 1);
                            const percent = Math.round(((i + 1) / info.total_parts) * 100);
                            progressFill.style.width = percent + '%';
                            progressPercent.innerText = percent + '%';
                        }
                    } else {
                        // 单文件模式（旧漫画）
                        threadInfo.innerText = '单文件模式';
                        progressMessage.innerText = '下载中...';
                        viewer.innerHTML = '';
                        const response = await fetch(zipUrl, { mode: 'cors' });
                        if (!response.ok) throw new Error(`HTTP ${response.status}`);
                        const blob = await response.blob();
                        const file = new File([blob], 'comic.zip', { type: 'application/zip' });
                        await loadZipFile(file);
                        progressFill.style.width = '100%';
                        progressPercent.innerText = '100%';
                    }
                    
                    progressContainer.style.display = 'none';
                } catch (err) {
                    console.error('加载失败:', err);
                    progressContainer.style.display = 'none';
                    viewer.innerHTML = `
                        <p style="color:red;">加载失败：${err.message}</p>
                        <p style="color:#ccc; font-size:0.9rem;">尝试直接打开链接：<a href="${zipUrl}" target="_blank" style="color:#ffb6c1;">${zipUrl}</a></p>
                        <button class="retry-button" onclick="window.location.reload()">重试</button>
                    `;
                }
            })();
        }

        // ---------- 以下为控制栏、返回按钮、本地上传等原有功能 ----------
        function showControls() {
            controls.classList.add('visible');
            clearTimeout(hideTimeout);
            hideTimeout = setTimeout(() => {
                controls.classList.remove('visible');
            }, 2000);
        }

        document.body.addEventListener('click', (e) => {
            if (e.target.closest('#back-btn') || e.target.closest('#reset-btn') || e.target.closest('.retry-button')) return;
            showControls();
        });

        showControls();

        const backBtn = document.getElementById('back-btn');
        let timer;
        let longPressed = false;

        backBtn.addEventListener('mousedown', () => {
            timer = setTimeout(() => {
                longPressed = true;
                window.location.href = 'index.html';
            }, 500);
        });
        backBtn.addEventListener('mouseup', () => {
            clearTimeout(timer);
            if (!longPressed) {
                window.location.href = `detail.html?id=${comicId}`;
            }
            longPressed = false;
        });
        backBtn.addEventListener('mouseleave', () => {
            clearTimeout(timer);
            longPressed = false;
        });

        backBtn.addEventListener('touchstart', (e) => {
            e.preventDefault();
            timer = setTimeout(() => {
                longPressed = true;
                window.location.href = 'index.html';
            }, 500);
        });
        backBtn.addEventListener('touchend', (e) => {
            e.preventDefault();
            clearTimeout(timer);
            if (!longPressed) {
                window.location.href = `detail.html?id=${comicId}`;
            }
            longPressed = false;
        });
        backBtn.addEventListener('touchcancel', () => {
            clearTimeout(timer);
            longPressed = false;
        });

        resetBtn.addEventListener('click', () => {
            if (isOnline) return;
            resetBtn.classList.remove('visible');
            uploadArea.style.display = 'flex';
            viewer.innerHTML = '';
            uploadInput.value = '';
            uploadInput.click();
        });

        function checkScroll() {
            if (isOnline) return;
            if (uploadArea.style.display === 'none' && viewer.children.length > 0) {
                const scrollY = window.scrollY;
                const windowHeight = window.innerHeight;
                const documentHeight = document.documentElement.scrollHeight;
                if (scrollY + windowHeight >= documentHeight - 50) {
                    resetBtn.classList.add('visible');
                } else {
                    resetBtn.classList.remove('visible');
                }
            } else {
                resetBtn.classList.remove('visible');
            }
        }
        window.addEventListener('scroll', checkScroll);

        const savedScroll = localStorage.getItem(`progress_${comicId}`);
        if (savedScroll) {
            window.addEventListener('load', () => {
                setTimeout(() => {
                    window.scrollTo(0, parseInt(savedScroll));
                }, 100);
            });
        }

        let scrollTimer;
        window.addEventListener('scroll', () => {
            clearTimeout(scrollTimer);
            scrollTimer = setTimeout(() => {
                localStorage.setItem(`progress_${comicId}`, window.scrollY);
            }, 200);
        });

        uploadInput.addEventListener('change', async (event) => {
            const file = event.target.files[0];
            if (!file) return;
            uploadArea.style.display = 'none';
            viewer.innerHTML = '';
            await loadZipFile(file);
        });
    </script>
</body>
</html>
