<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <title>全屏阅读器</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0b0e14;
            background-image:
                radial-gradient(800px 500px at 85% -10%, rgba(0, 112, 243, 0.12), transparent 60%),
                radial-gradient(700px 450px at -10% 90%, rgba(255, 182, 193, 0.08), transparent 60%);
            background-attachment: fixed;
            color: white;
            font-family: system-ui, -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            overflow-x: hidden;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        #controls {
            position: fixed;
            top: 0; left: 0; right: 0;
            background: rgba(10, 14, 22, 0.82);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            padding: 16px;
            display: flex;
            align-items: center;
            gap: 16px;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transform: translateY(-100%);
            transition: transform 0.32s var(--ease-out, cubic-bezier(0.22, 0.61, 0.36, 1)), opacity 0.28s ease;
        }
        #controls.visible {
            opacity: 1;
            pointer-events: auto;
            transform: translateY(0);
        }
        #controls span {
            color: rgba(255, 255, 255, 0.75);
            font-size: 0.9rem;
        }
        #back-btn {
            background: none;
            border: none;
            color: white;
            font-size: 1.1rem;
            padding: 10px 20px;
            cursor: pointer;
            border-radius: 40px;
            background: rgba(255, 255, 255, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.15);
            transition: background 0.2s ease, transform 0.2s var(--ease-out, cubic-bezier(0.34, 1.56, 0.64, 1));
        }
        #back-btn:hover { background: rgba(255, 255, 255, 0.22); transform: translateX(-2px); }
        #back-btn:active { background: rgba(255, 255, 255, 0.32); }
        #upload-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            color: white;
            font-size: 1.4rem;
            padding: 20px;
            animation: fadeIn .6s ease both;
        }
        #upload-area input {
            font-size: 1.1rem;
            padding: 15px 24px;
            margin-top: 20px;
            width: auto;
            max-width: 400px;
            background: rgba(255, 255, 255, 0.06);
            color: white;
            border: 2px solid #0070f3;
            border-radius: 60px;
            cursor: pointer;
            transition: background 0.2s ease, box-shadow 0.25s ease;
        }
        #upload-area input:hover {
            background: rgba(0, 112, 243, 0.15);
            box-shadow: 0 0 24px rgba(0, 112, 243, 0.35);
        }
        #comic-viewer {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .page-img {
            max-width: 100%;
            height: auto;
            display: block;
            margin: 0 auto;
            animation: imgIn .5s ease both;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
        }
        @keyframes imgIn {
            from { opacity: 0; transform: translateY(10px); }
            to   { opacity: 1; transform: none; }
        }
        #reset-btn {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: linear-gradient(135deg, #0070f3, #4da3ff);
            color: white;
            border: none;
            border-radius: 40px;
            padding: 13px 32px;
            font-size: 1.1rem;
            font-weight: bold;
            box-shadow: 0 8px 26px rgba(0, 112, 243, 0.55);
            cursor: pointer;
            z-index: 200;
            display: none;
            transition: transform 0.2s var(--ease-out, cubic-bezier(0.34, 1.56, 0.64, 1)), box-shadow 0.25s ease;
            animation: fabIn .4s cubic-bezier(0.34, 1.56, 0.64, 1) backwards;
        }
        #reset-btn:hover {
            transform: translateX(-50%) translateY(-3px);
            box-shadow: 0 12px 34px rgba(0, 112, 243, 0.7);
        }
        #reset-btn.visible { display: block; }
        .retry-button {
            font-size: 1.1rem;
            padding: 14px 24px;
            margin: 20px auto;
            width: auto;
            max-width: 400px;
            background: rgba(255, 255, 255, 0.08);
            color: white;
            border: 2px solid #0070f3;
            border-radius: 60px;
            cursor: pointer;
            display: inline-block;
            text-align: center;
            border: none;
            outline: none;
            transition: background 0.2s ease;
        }
        .retry-button:hover { background: rgba(0, 112, 243, 0.2); }
        .progress-container {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80%;
            max-width: 420px;
            text-align: center;
            color: white;
            z-index: 300;
            animation: fadeUpCenter .4s ease backwards;
        }
        /* 专用入场动画：保留 translate(-50%,-50%) 居中偏移，避免动画结束后偏移被覆盖 */
        @keyframes fadeUpCenter {
            from { opacity: 0; transform: translate(-50%, -50%) translateY(16px); }
            to   { opacity: 1; transform: translate(-50%, -50%); }
        }
        .progress-bar {
            width: 100%;
            height: 10px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 6px;
            overflow: hidden;
            margin: 12px 0;
            box-shadow: inset 0 1px 3px rgba(0, 0, 0, 0.4);
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #0070f3, #4da3ff, #ff8fab);
            background-size: 200% 100%;
            width: 0%;
            border-radius: 6px;
            transition: width 0.2s ease;
            animation: gradientMove 2s linear infinite;
            box-shadow: 0 0 14px rgba(77, 163, 255, 0.7);
        }
        @keyframes gradientMove {
            0%   { background-position: 0% 50%; }
            100% { background-position: 200% 50%; }
        }
        #progress-percent {
            font-size: 1.3rem;
            font-weight: 800;
            background: linear-gradient(120deg, #4da3ff, #ff8fab);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .thread-info {
            margin-top: 6px;
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.6);
        }
        .error-details {
            background: rgba(15, 20, 30, 0.92);
            border: 1px solid rgba(255, 107, 107, 0.4);
            border-left: 4px solid #ff6b6b;
            padding: 14px;
            margin: 20px auto;
            max-width: 520px;
            border-radius: 14px;
            font-family: 'SF Mono', Consolas, monospace;
            font-size: 0.8rem;
            text-align: left;
            white-space: pre-wrap;
            word-break: break-all;
            animation: fadeUp .4s ease both;
            box-shadow: 0 10px 34px rgba(0, 0, 0, 0.5);
        }
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(16px); }
            to   { opacity: 1; transform: none; }
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to   { opacity: 1; }
        }
        @keyframes fabIn {
            from { opacity: 0; transform: translateX(-50%) translateY(20px) scale(0.85); }
            to   { opacity: 1; transform: translateX(-50%) translateY(0) scale(1); }
        }
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
    <script>
        // JSZip 多 CDN 回退加载：单一 CDN 不可用时自动切换备用源，保证阅读器可用
        (function () {
            var srcs = [
                'https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js',
                'https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js',
                'https://unpkg.com/jszip@3.10.1/dist/jszip.min.js'
            ];
            for (var i = 0; i < srcs.length; i++) {
                document.write('<script src="' + srcs[i] + '"><\/script>');
                if (typeof JSZip !== 'undefined') break;
            }
        })();
    </script>
</head>
<body>
    <div id="controls" class="visible">
        <button id="back-btn">← 返回</button>
        <span>点击屏幕显示/隐藏控制栏</span>
    </div>

    <button id="reset-btn">重置并导入</button>

    <div id="upload-area">
        <p>📦 选择漫画压缩包 (ZIP)</p>
        <input type="file" id="zip-upload" accept=".zip">
    </div>

    <div id="progress-container" class="progress-container" style="display: none;">
        <p id="progress-message">下载中...</p>
        <div class="progress-bar" id="progress-bar" style="display: block;">
            <div id="progress-fill" class="progress-fill"></div>
        </div>
        <p id="progress-percent">0%</p>
        <div id="thread-info" class="thread-info"></div>
    </div>

    <div id="comic-viewer"></div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const comicId = urlParams.get('id') || 'default';
        const zipUrl = urlParams.get('zip');
        const isOnline = !!zipUrl;

        const controls = document.getElementById('controls');
        const resetBtn = document.getElementById('reset-btn');
        const uploadArea = document.getElementById('upload-area');
        const uploadInput = document.getElementById('zip-upload');
        const viewer = document.getElementById('comic-viewer');
        const progressContainer = document.getElementById('progress-container');
        const progressFill = document.getElementById('progress-fill');
        const progressPercent = document.getElementById('progress-percent');
        const progressMessage = document.getElementById('progress-message');
        const threadInfo = document.getElementById('thread-info');
        let hideTimeout;

        if (isOnline) {
            resetBtn.style.display = 'none';
        }

        // 显示错误详情
        function showError(message, details = null) {
            const errorHtml = `
                <div class="error-details">
                    <strong>❌ 加载失败</strong><br>
                    ${escapeHtml(message)}<br>
                    ${details ? `<br>📄 详细信息：<br>${escapeHtml(details)}` : ''}
                    <br><br>
                    💡 你可以尝试：
                    <br>• <a href="${escapeAttr(zipUrl)}" target="_blank" style="color:#ffb6c1;">直接打开漫画链接</a>
                    <br>• 检查网络连接后 <button onclick="window.location.reload()">重试</button>
                </div>
            `;
            viewer.innerHTML = errorHtml;
            if (progressContainer) progressContainer.style.display = 'none';
        }

        function escapeHtml(str) {
            if (str == null) return '';
            return String(str).replace(/[&<>]/g, function(m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            });
        }

        // 用于 HTML 属性上下文的转义（额外转义引号）
        function escapeAttr(str) {
            return escapeHtml(str).replace(/"/g, '&quot;').replace(/'/g, '&#39;');
        }

        // 带超时和重试的 fetch
        async function fetchWithTimeout(url, options = {}, timeout = 30000) {
            const controller = new AbortController();
            const id = setTimeout(() => controller.abort(), timeout);
            try {
                const response = await fetch(url, {
                    ...options,
                    signal: controller.signal,
                    mode: 'cors',
                    credentials: 'omit'
                });
                clearTimeout(id);
                return response;
            } catch (err) {
                clearTimeout(id);
                throw err;
            }
        }

        // 加载单个 ZIP 并返回图片元素数组（不直接渲染）
        // 若提供 onImage(name, blob) 回调，则逐张解压并回调（渐进渲染），返回空数组
        async function extractZipImages(file, onImage) {
            if (typeof JSZip === 'undefined') {
                throw new Error('解压库加载失败，请刷新页面重试');
            }
            const zip = await JSZip.loadAsync(file);
            const imageFiles = Object.keys(zip.files)
                .filter(name => !zip.files[name].dir && /\.(jpg|jpeg|png|gif|webp|bmp)$/i.test(name))
                .sort((a, b) => a.localeCompare(b, undefined, { numeric: true, sensitivity: 'base' }));
            if (imageFiles.length === 0) {
                throw new Error('压缩包中没有图片');
            }
            if (typeof onImage === 'function') {
                for (let name of imageFiles) {
                    const blob = await zip.files[name].async('blob');
                    onImage(name, blob);
                }
                return [];
            }
            const images = [];
            for (let name of imageFiles) {
                const blob = await zip.files[name].async('blob');
                images.push(createPageImg(name, URL.createObjectURL(blob)));
            }
            return images;
        }

        // 创建页面图片元素：图片解码完成后立即释放 Blob URL，避免大漫画内存持续增长
        function createPageImg(name, url) {
            const img = document.createElement('img');
            img.className = 'page-img';
            img.alt = name;
            img.loading = 'lazy';
            img.src = url;
            img.addEventListener('load', function () { URL.revokeObjectURL(url); }, { once: true });
            img.addEventListener('error', function () { URL.revokeObjectURL(url); }, { once: true });
            return img;
        }

        // 下载单个分片并提取图片
        async function downloadAndExtractPart(url, partIndex, retryCount = 0) {
            const maxRetries = 2;
            try {
                console.log(`正在下载分片 ${partIndex}: ${url}`);
                const response = await fetchWithTimeout(url, {}, 90000);
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status} ${response.statusText}`);
                }
                const blob = await response.blob();
                const file = new File([blob], `part_${partIndex}.zip`, { type: 'application/zip' });
                const images = await extractZipImages(file);
                return images;
            } catch (err) {
                if (retryCount < maxRetries) {
                    console.warn(`分片 ${partIndex} 下载失败，重试 ${retryCount + 1}/${maxRetries}: ${err.message}`);
                    await new Promise(resolve => setTimeout(resolve, 1000 * (retryCount + 1)));
                    return downloadAndExtractPart(url, partIndex, retryCount + 1);
                }
                throw new Error(`分片 ${partIndex} 下载失败: ${err.message}`);
            }
        }

        // 主加载逻辑
        if (zipUrl) {
            (async () => {
                uploadArea.style.display = 'none';
                progressContainer.style.display = 'block';
                progressFill.style.width = '0%';
                progressPercent.innerText = '0%';
                progressMessage.innerText = '加载漫画信息...';
                threadInfo.innerText = '';

                try {
                    // 判断是单文件还是分片
                    const isSplit = zipUrl.includes('/info.json');
                    
                    if (!isSplit) {
                        // 旧版单文件漫画：直接下载 ZIP
                        progressMessage.innerText = '下载漫画中...';
                        const proxyUrl = `/api/proxy?url=${encodeURIComponent(zipUrl)}`;
                        console.log('加载单文件 ZIP (proxy):', proxyUrl);
                        
                        let lastPercent = 0;
                        const onProgress = (received, total) => {
                            if (total > 0) {
                                const percent = Math.round((received / total) * 100);
                                if (percent !== lastPercent) {
                                    lastPercent = percent;
                                    progressFill.style.width = percent + '%';
                                    progressPercent.innerText = percent + '%';
                                    console.log(`单文件下载进度: ${percent}%`);
                                }
                            } else {
                                // 服务器未提供总大小（如流式响应）：实时显示已下载大小，进度条呈不确定状态
                                const mb = (received / 1024 / 1024).toFixed(1);
                                progressFill.style.width = '100%';
                                progressFill.style.opacity = '0.35';
                                progressPercent.innerText = mb + ' MB';
                            }
                        };
                        
                        // 使用带进度的 fetch（大文件超时放宽到 5 分钟）
                        const arrayBuffer = await fetchWithProgress(proxyUrl, onProgress, {}, 300000);
                        progressMessage.innerText = '解压中...';
                        const blob = new Blob([arrayBuffer], { type: 'application/zip' });
                        const file = new File([blob], 'comic.zip', { type: 'application/zip' });
                        // 逐页解压并渲染，避免超大漫画一次性占用大量内存导致页面卡死
                        viewer.innerHTML = '';
                        await extractZipImages(file, function (name, imgBlob) {
                            viewer.appendChild(createPageImg(name, URL.createObjectURL(imgBlob)));
                        });
                        progressContainer.style.display = 'none';
                        return;
                    }
                    
                    // 分片漫画流程
                    const infoUrl = zipUrl;
                    const proxyInfoUrl = `/api/proxy?url=${encodeURIComponent(infoUrl)}`;
                    console.log('加载 info.json (proxy):', proxyInfoUrl);
                    
                    const infoResponse = await fetchWithTimeout(proxyInfoUrl, {}, 10000);
                    if (!infoResponse.ok) {
                        throw new Error(`无法加载 info.json (HTTP ${infoResponse.status})`);
                    }
                    
                    const info = await infoResponse.json();
                    if (!info || !Array.isArray(info.parts) || info.parts.length === 0) {
                        throw new Error('漫画分片信息无效或已损坏');
                    }
                    const baseUrl = zipUrl.substring(0, zipUrl.lastIndexOf('/'));
                    threadInfo.innerText = `分片模式 (${info.parts.length} 个分片)`;
                    progressMessage.innerText = '下载中...';
                    
                    viewer.innerHTML = ''; // 清空，等待渲染
                    
                    // 存储每个分片解压后的图片列表
                    const partImages = new Array(info.parts.length).fill(null);
                    let renderedUpTo = 0; // 已渲染的最大分片索引（从0开始）
                    let hasError = false;
                    
                    // 渲染函数：按顺序渲染可用的分片
                    function tryRender() {
                        while (renderedUpTo < partImages.length && partImages[renderedUpTo] !== null) {
                            const images = partImages[renderedUpTo];
                            for (const img of images) {
                                viewer.appendChild(img);
                            }
                            renderedUpTo++;
                            // 更新总进度
                            const percent = Math.round((renderedUpTo / info.parts.length) * 100);
                            progressFill.style.width = percent + '%';
                            progressPercent.innerText = percent + '%';
                            console.log(`总进度: ${percent}%`);
                        }
                        if (renderedUpTo === info.parts.length) {
                            progressContainer.style.display = 'none';
                        }
                    }
                    
                    // 受限并发下载所有分片：避免分片过多时一次性发起大量请求被限流
                    const MAX_CONCURRENCY = 4;
                    let nextPartIndex = 0;
                    let downloadedParts = 0;
                    async function downloadWorker() {
                        while (nextPartIndex < info.parts.length && !hasError) {
                            const i = nextPartIndex++;
                            const partIndex = i + 1;
                            const rawPartUrl = `${baseUrl}/zips/${info.parts[i]}`;
                            const partUrl = `/api/proxy?url=${encodeURIComponent(rawPartUrl)}`;
                            const images = await downloadAndExtractPart(partUrl, partIndex);
                            if (hasError) return;
                            partImages[partIndex - 1] = images;
                            downloadedParts++;
                            // 下载进度即时反馈（页面渲染进度由 tryRender 按顺序推进）
                            threadInfo.innerText = `分片模式 (已下载 ${downloadedParts}/${info.parts.length})`;
                            console.log(`分片 ${partIndex} 下载完成`);
                            tryRender(); // 可能触发顺序渲染
                        }
                    }
                    const downloadPromises = [];
                    const workerCount = Math.min(MAX_CONCURRENCY, info.parts.length);
                    for (let w = 0; w < workerCount; w++) {
                        downloadPromises.push(downloadWorker().catch(err => {
                            if (!hasError) {
                                hasError = true;
                                throw err;
                            }
                        }));
                    }
                    
                    // 等待所有下载完成（渲染已异步处理）
                    await Promise.all(downloadPromises);
                    
                    // 最终检查：如果还有未渲染的分片（理论上已完成），再渲染一次
                    tryRender();
                    
                } catch (err) {
                    console.error('加载失败:', err);
                    progressContainer.style.display = 'none';
                    showError(err.message, err.stack || '无详细信息');
                }
            })();
        }

        // 带进度回调的 fetch（用于单文件）
        async function fetchWithProgress(url, onProgress, options = {}, timeout = 30000) {
            const controller = new AbortController();
            const id = setTimeout(() => controller.abort(), timeout);
            try {
                const response = await fetch(url, {
                    ...options,
                    signal: controller.signal,
                    mode: 'cors',
                    credentials: 'omit'
                });
                clearTimeout(id);
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }
                
                const contentLength = response.headers.get('content-length');
                const total = contentLength ? parseInt(contentLength, 10) : 0;
                
                // 只要有流式响应体就逐块读取并报告进度；total 为 0（无 Content-Length）时也能显示已接收大小
                if (!onProgress || !response.body || typeof response.body.getReader !== 'function') {
                    return await response.arrayBuffer();
                }
                
                // 读取流并报告进度
                const reader = response.body.getReader();
                const chunks = [];
                let received = 0;
                
                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    chunks.push(value);
                    received += value.length;
                    onProgress(received, total);
                }
                
                // 合并所有块
                const allChunks = new Uint8Array(received);
                let position = 0;
                for (const chunk of chunks) {
                    allChunks.set(chunk, position);
                    position += chunk.length;
                }
                
                return allChunks.buffer;
            } catch (err) {
                clearTimeout(id);
                throw err;
            }
        }

        // ---------- 以下为控制栏、返回按钮、本地上传等原有功能 ----------
        function showControls() {
            controls.classList.add('visible');
            clearTimeout(hideTimeout);
            hideTimeout = setTimeout(() => {
                controls.classList.remove('visible');
            }, 2000);
        }

        document.body.addEventListener('click', (e) => {
            if (e.target.closest('#back-btn') || e.target.closest('#reset-btn') || e.target.closest('.retry-button')) return;
            showControls();
        });

        showControls();

        const backBtn = document.getElementById('back-btn');
        let timer;
        let longPressed = false;

        // 无 id 参数（直接以 zip 打开）时返回主页，避免跳到无效的详情页
        function goBack() {
            if (comicId && comicId !== 'default') {
                window.location.href = `detail.html?id=${comicId}`;
            } else {
                window.location.href = 'index.html';
            }
        }

        backBtn.addEventListener('mousedown', () => {
            timer = setTimeout(() => {
                longPressed = true;
                window.location.href = 'index.html';
            }, 500);
        });
        backBtn.addEventListener('mouseup', () => {
            clearTimeout(timer);
            if (!longPressed) {
                goBack();
            }
            longPressed = false;
        });
        backBtn.addEventListener('mouseleave', () => {
            clearTimeout(timer);
            longPressed = false;
        });

        backBtn.addEventListener('touchstart', (e) => {
            e.preventDefault();
            timer = setTimeout(() => {
                longPressed = true;
                window.location.href = 'index.html';
            }, 500);
        });
        backBtn.addEventListener('touchend', (e) => {
            e.preventDefault();
            clearTimeout(timer);
            if (!longPressed) {
                goBack();
            }
            longPressed = false;
        });
        backBtn.addEventListener('touchcancel', () => {
            clearTimeout(timer);
            longPressed = false;
        });

        resetBtn.addEventListener('click', () => {
            if (isOnline) return;
            resetBtn.classList.remove('visible');
            uploadArea.style.display = 'flex';
            viewer.innerHTML = '';
            uploadInput.value = '';
            uploadInput.click();
        });

        function checkScroll() {
            if (isOnline) return;
            if (uploadArea.style.display === 'none' && viewer.children.length > 0) {
                const scrollY = window.scrollY;
                const windowHeight = window.innerHeight;
                const documentHeight = document.documentElement.scrollHeight;
                if (scrollY + windowHeight >= documentHeight - 50) {
                    resetBtn.classList.add('visible');
                } else {
                    resetBtn.classList.remove('visible');
                }
            } else {
                resetBtn.classList.remove('visible');
            }
        }
        window.addEventListener('scroll', checkScroll);

        const savedScroll = localStorage.getItem(`progress_${comicId}`);
        if (savedScroll) {
            window.addEventListener('load', () => {
                setTimeout(() => {
                    window.scrollTo(0, parseInt(savedScroll));
                }, 100);
            });
        }

        let scrollTimer;
        window.addEventListener('scroll', () => {
            clearTimeout(scrollTimer);
            scrollTimer = setTimeout(() => {
                localStorage.setItem(`progress_${comicId}`, window.scrollY);
            }, 200);
        });

        uploadInput.addEventListener('change', async (event) => {
            const file = event.target.files[0];
            if (!file) return;
            uploadArea.style.display = 'none';
            viewer.innerHTML = '';
            try {
                // 逐页解压渲染，避免大文件一次性占用过多内存
                await extractZipImages(file, function (name, imgBlob) {
                    viewer.appendChild(createPageImg(name, URL.createObjectURL(imgBlob)));
                });
            } catch (err) {
                alert('解压失败：' + err.message);
            }
        });
    </script>
</body>
</html>
