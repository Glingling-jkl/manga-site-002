<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <title>全屏阅读器</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: black;
            color: white;
            font-family: system-ui, sans-serif;
            overflow-x: hidden;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        #controls {
            position: fixed;
            top: 0; left: 0; right: 0;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(5px);
            padding: 16px;
            display: flex;
            align-items: center;
            gap: 16px;
            z-index: 100;
            transition: opacity 0.3s;
            opacity: 0;
            pointer-events: none;
        }
        #controls.visible {
            opacity: 1;
            pointer-events: auto;
        }
        #back-btn {
            background: none;
            border: none;
            color: white;
            font-size: 1.2rem;
            padding: 8px 16px;
            cursor: pointer;
            border-radius: 40px;
            background: rgba(255,255,255,0.2);
        }
        #back-btn:active {
            background: rgba(255,255,255,0.4);
        }
        #upload-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            color: white;
            font-size: 1.5rem;
            padding: 20px;
        }
        #upload-area input {
            font-size: 1.2rem;
            padding: 15px 20px;
            margin-top: 20px;
            width: auto;
            max-width: 400px;
            background: #2a2a2a;
            color: white;
            border: 2px solid #0070f3;
            border-radius: 60px;
            cursor: pointer;
        }
        #comic-viewer {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .page-img {
            max-width: 100%;
            height: auto;
            display: block;
            margin: 0 auto;
        }
        #reset-btn {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: #0070f3;
            color: white;
            border: none;
            border-radius: 40px;
            padding: 12px 30px;
            font-size: 1.2rem;
            font-weight: bold;
            box-shadow: 0 5px 20px rgba(0,112,243,0.5);
            cursor: pointer;
            z-index: 200;
            display: none;
            transition: opacity 0.3s;
        }
        #reset-btn:hover {
            background: #0051b3;
        }
        #reset-btn.visible {
            display: block;
        }
        .retry-button {
            font-size: 1.2rem;
            padding: 15px 20px;
            margin: 20px auto;
            width: auto;
            max-width: 400px;
            background: #2a2a2a;
            color: white;
            border: 2px solid #0070f3;
            border-radius: 60px;
            cursor: pointer;
            display: inline-block;
            text-align: center;
            border: none;
            outline: none;
        }
        .retry-button:hover {
            background: #3a3a3a;
        }
        .progress-container {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80%;
            text-align: center;
            color: white;
            z-index: 300;
        }
        .progress-bar {
            width: 100%;
            height: 8px;
            background: #333;
            border-radius: 4px;
            overflow: hidden;
            margin: 10px 0;
        }
        .progress-fill {
            height: 100%;
            background: #0070f3;
            width: 0%;
            transition: width 0.2s;
        }
        /* 不确定进度条的条纹动画（速度变慢） */
        .progress-fill.indeterminate {
            width: 100% !important;
            background: repeating-linear-gradient(
                45deg,
                #0070f3 0px,
                #0070f3 10px,
                #3399ff 10px,
                #3399ff 20px
            );
            background-size: 200% 100%;
            animation: move 2s linear infinite; /* 从1s改为2s */
        }
        @keyframes move {
            0% { background-position: 0 0; }
            100% { background-position: 200% 0; }
        }
        .thread-info {
            margin-top: 5px;
            font-size: 0.9rem;
            color: #ccc;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
</head>
<body>
    <div id="controls" class="visible">
        <button id="back-btn">← 返回</button>
        <span>点击屏幕显示/隐藏控制栏</span>
    </div>

    <button id="reset-btn">重置并导入</button>

    <div id="upload-area">
        <p>📦 选择漫画压缩包 (ZIP)</p>
        <input type="file" id="zip-upload" accept=".zip">
    </div>

    <div id="progress-container" class="progress-container" style="display: none;">
        <p id="progress-message">下载中...</p>
        <div class="progress-bar" id="progress-bar" style="display: block;">
            <div id="progress-fill" class="progress-fill"></div>
        </div>
        <p id="progress-percent">0%</p>
        <div id="thread-info" class="thread-info"></div>
    </div>

    <div id="comic-viewer"></div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const comicId = urlParams.get('id') || 'default';
        const zipUrl = urlParams.get('zip');
        const isOnline = !!zipUrl;

        console.log('在线模式:', isOnline, 'ZIP URL:', zipUrl, 'ID:', comicId);

        const controls = document.getElementById('controls');
        const resetBtn = document.getElementById('reset-btn');
        const uploadArea = document.getElementById('upload-area');
        const uploadInput = document.getElementById('zip-upload');
        const viewer = document.getElementById('comic-viewer');
        const progressContainer = document.getElementById('progress-container');
        const progressFill = document.getElementById('progress-fill');
        const progressPercent = document.getElementById('progress-percent');
        const progressMessage = document.getElementById('progress-message');
        const progressBar = document.getElementById('progress-bar');
        const threadInfo = document.getElementById('thread-info');
        let hideTimeout;

        if (isOnline) {
            resetBtn.style.display = 'none';
        }

        // ---------- 分片下载函数（实时进度）----------
        const CHUNK_COUNT = 12;

        async function fetchWithChunks(url) {
            const headRes = await fetch(url, { method: 'HEAD', mode: 'cors' });
            if (!headRes.ok) throw new Error(`HTTP ${headRes.status}`);

            const contentLength = headRes.headers.get('content-length');
            const acceptRanges = headRes.headers.get('accept-ranges');
            
            // 情况1：支持分片且有大小信息 -> 多线程下载
            if (acceptRanges === 'bytes' && contentLength) {
                threadInfo.innerText = `多线程 (${CHUNK_COUNT} 线程)`;
                progressFill.classList.remove('indeterminate');
                const total = parseInt(contentLength, 10);
                const chunkSize = Math.ceil(total / CHUNK_COUNT);
                let loaded = 0;

                const chunkPromises = [];
                for (let i = 0; i < CHUNK_COUNT; i++) {
                    const start = i * chunkSize;
                    const end = (i === CHUNK_COUNT - 1) ? total - 1 : Math.min(start + chunkSize - 1, total - 1);
                    if (start > end) continue;

                    const promise = (async () => {
                        const res = await fetch(url, {
                            mode: 'cors',
                            headers: { 'Range': `bytes=${start}-${end}` }
                        });
                        if (!res.ok) throw new Error(`Chunk ${i} failed: ${res.status}`);

                        const reader = res.body.getReader();
                        const chunks = [];
                        while (true) {
                            const { done, value } = await reader.read();
                            if (done) break;
                            chunks.push(value);
                            loaded += value.length;
                            const percent = Math.min(100, Math.round((loaded / total) * 100));
                            progressFill.style.width = percent + '%';
                            progressPercent.innerText = percent + '%';
                        }
                        const totalLength = chunks.reduce((acc, val) => acc + val.length, 0);
                        const merged = new Uint8Array(totalLength);
                        let offset = 0;
                        for (const chunk of chunks) {
                            merged.set(new Uint8Array(chunk), offset);
                            offset += chunk.length;
                        }
                        return merged;
                    })();
                    chunkPromises.push(promise);
                }

                const chunksData = await Promise.all(chunkPromises);
                return new Blob(chunksData, { type: 'application/zip' });
            }
            
            // 情况2：不支持分片，但有大小信息 -> 单线程下载，显示正常进度条
            if (contentLength) {
                threadInfo.innerText = '单线程下载';
                progressFill.classList.remove('indeterminate');
                const total = parseInt(contentLength, 10);
                let loaded = 0;

                const res = await fetch(url, { mode: 'cors' });
                if (!res.ok) throw new Error(`HTTP ${res.status}`);

                const reader = res.body.getReader();
                const chunks = [];
                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    chunks.push(value);
                    loaded += value.length;
                    const percent = Math.min(100, Math.round((loaded / total) * 100));
                    progressFill.style.width = percent + '%';
                    progressPercent.innerText = percent + '%';
                }
                const totalLength = chunks.reduce((acc, val) => acc + val.length, 0);
                const merged = new Uint8Array(totalLength);
                let offset = 0;
                for (const chunk of chunks) {
                    merged.set(new Uint8Array(chunk), offset);
                    offset += chunk.length;
                }
                return new Blob([merged], { type: 'application/zip' });
            }

            // 情况3：没有大小信息（既不支持分片也无content-length） -> 单线程下载，条纹动画
            threadInfo.innerText = '单线程下载（无进度）';
            progressFill.classList.add('indeterminate');
            progressFill.style.width = '100%';
            progressPercent.innerText = '--%';
            progressMessage.innerText = '下载中...';

            const res = await fetch(url, { mode: 'cors' });
            if (!res.ok) throw new Error(`HTTP ${res.status}`);
            const blob = await res.blob();
            // 下载完成后移除不确定样式
            progressFill.classList.remove('indeterminate');
            progressFill.style.width = '0%';
            return blob;
        }

        // ---------- 在线加载 ----------
        if (zipUrl) {
            (async () => {
                uploadArea.style.display = 'none';
                progressContainer.style.display = 'block';
                progressFill.style.width = '0%';
                progressPercent.innerText = '0%';
                progressFill.classList.remove('indeterminate');
                progressBar.style.display = 'block';
                progressPercent.style.display = 'block';
                progressMessage.innerText = '下载中...';
                threadInfo.innerText = '';

                try {
                    const blob = await fetchWithChunks(zipUrl);
                    progressContainer.style.display = 'none';
                    const file = new File([blob], 'comic.zip', { type: 'application/zip' });
                    await loadZipFile(file);
                } catch (err) {
                    console.error('加载失败:', err);
                    progressContainer.style.display = 'none';
                    viewer.innerHTML = `
                        <p style="color:red;">加载失败：${err.message}</p>
                        <p style="color:#ccc; font-size:0.9rem;">尝试直接打开链接：<a href="${zipUrl}" target="_blank" style="color:#ffb6c1;">${zipUrl}</a></p>
                        <button class="retry-button" onclick="window.location.reload()">重试</button>
                    `;
                }
            })();
        }

        // ---------- 控制栏显示/隐藏 ----------
        function showControls() {
            controls.classList.add('visible');
            clearTimeout(hideTimeout);
            hideTimeout = setTimeout(() => {
                controls.classList.remove('visible');
            }, 2000);
        }

        document.body.addEventListener('click', (e) => {
            if (e.target.closest('#back-btn') || e.target.closest('#reset-btn') || e.target.closest('.retry-button')) return;
            showControls();
        });

        showControls();

        // ---------- 返回按钮（短按回详情，长按回首页）----------
        const backBtn = document.getElementById('back-btn');
        let timer;
        let longPressed = false;

        backBtn.addEventListener('mousedown', () => {
            timer = setTimeout(() => {
                longPressed = true;
                window.location.href = 'index.html';
            }, 500);
        });
        backBtn.addEventListener('mouseup', () => {
            clearTimeout(timer);
            if (!longPressed) {
                window.location.href = `detail.html?id=${comicId}`;
            }
            longPressed = false;
        });
        backBtn.addEventListener('mouseleave', () => {
            clearTimeout(timer);
            longPressed = false;
        });

        backBtn.addEventListener('touchstart', (e) => {
            e.preventDefault();
            timer = setTimeout(() => {
                longPressed = true;
                window.location.href = 'index.html';
            }, 500);
        });
        backBtn.addEventListener('touchend', (e) => {
            e.preventDefault();
            clearTimeout(timer);
            if (!longPressed) {
                window.location.href = `detail.html?id=${comicId}`;
            }
            longPressed = false;
        });
        backBtn.addEventListener('touchcancel', () => {
            clearTimeout(timer);
            longPressed = false;
        });

        // ---------- 重置并导入按钮（仅本地模式）----------
        resetBtn.addEventListener('click', () => {
            if (isOnline) return;
            resetBtn.classList.remove('visible');
            uploadArea.style.display = 'flex';
            viewer.innerHTML = '';
            uploadInput.value = '';
            uploadInput.click();
        });

        // ---------- 滚动检测（仅本地模式）----------
        function checkScroll() {
            if (isOnline) return;
            if (uploadArea.style.display === 'none' && viewer.children.length > 0) {
                const scrollY = window.scrollY;
                const windowHeight = window.innerHeight;
                const documentHeight = document.documentElement.scrollHeight;
                if (scrollY + windowHeight >= documentHeight - 50) {
                    resetBtn.classList.add('visible');
                } else {
                    resetBtn.classList.remove('visible');
                }
            } else {
                resetBtn.classList.remove('visible');
            }
        }
        window.addEventListener('scroll', checkScroll);

        // ---------- 阅读进度保存 ----------
        const savedScroll = localStorage.getItem(`progress_${comicId}`);
        if (savedScroll) {
            window.addEventListener('load', () => {
                setTimeout(() => {
                    window.scrollTo(0, parseInt(savedScroll));
                }, 100);
            });
        }
        let scrollTimer;
        window.addEventListener('scroll', () => {
            clearTimeout(scrollTimer);
            scrollTimer = setTimeout(() => {
                localStorage.setItem(`progress_${comicId}`, window.scrollY);
            }, 200);
        });

        // ---------- 本地上传处理 ----------
        uploadInput.addEventListener('change', async (event) => {
            const file = event.target.files[0];
            if (!file) return;
            uploadArea.style.display = 'none';
            await loadZipFile(file);
        });

        // ---------- 核心解压函数 ----------
        async function loadZipFile(file) {
            viewer.innerHTML = '<p style="color:white; padding:20px;">解压中...</p>';
            try {
                const zip = await JSZip.loadAsync(file);
                const imageFiles = Object.keys(zip.files)
                    .filter(name => /\.(jpg|jpeg|png|gif|webp|bmp)$/i.test(name))
                    .sort((a, b) => a.localeCompare(b, undefined, {numeric: true, sensitivity: 'base'}));
                if (imageFiles.length === 0) {
                    viewer.innerHTML = '<p>压缩包中没有图片</p><button class="retry-button" onclick="window.location.reload()">重新导入</button>';
                    return;
                }
                viewer.innerHTML = '';
                for (let name of imageFiles) {
                    const blob = await zip.files[name].async('blob');
                    const url = URL.createObjectURL(blob);
                    const img = document.createElement('img');
                    img.src = url;
                    img.className = 'page-img';
                    img.alt = name;
                    viewer.appendChild(img);
                }
                const saved = localStorage.getItem(`progress_${comicId}`);
                if (saved) {
                    setTimeout(() => {
                        window.scrollTo(0, parseInt(saved));
                    }, 200);
                }
            } catch (err) {
                viewer.innerHTML = `<p style="color:red;">解压失败：${err.message}</p>`;
            }
        }
    </script>
</body>
</html>
